<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2b45">
<title>Τράπεζα θεμάτων · Ναυσιπλοΐα Ι</title>
<style>
:root{
  --navy:#0d2b45; --navy2:#173e5f; --sea:#1b6f8a; --foam:#e8f1f5; --sand:#f5f2ea;
  --ink:#1d2733; --mute:#5d6b78; --line:#d9dee3; --card:#fff;
  --ok:#2e8b57; --okbg:#e6f4ec; --bad:#c0392b; --badbg:#fbeaea; --half:#c98a00; --halfbg:#fdf3dc;
  --ab:#4e7a3f; --gold:#e3b23c;
  --fs:17px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--sand);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;min-height:3.1rem;box-shadow:0 2px 6px rgba(0,0,0,.18)}
#bar .t{flex:1;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{background:transparent;border:0;color:#fff;min-width:2.4rem;height:2.4rem;border-radius:.5rem;cursor:pointer;font-size:1.05rem}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar .tm{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.14);padding:.15rem .55rem;border-radius:1rem;font-size:.9rem}
#bar .tm.low{background:var(--bad)}
main{max-width:46rem;margin:0 auto;padding:1rem .8rem 5rem}
h1{font-size:1.45rem;margin:.2rem 0 .1rem;line-height:1.25}
h2{font-size:1.15rem;margin:1.2rem 0 .5rem}
.sub{color:var(--mute);font-size:.92rem}
.hero{background:linear-gradient(135deg,var(--navy),var(--sea));color:#fff;border-radius:1rem;padding:1.2rem 1.1rem 1rem;margin-bottom:1rem;position:relative;overflow:hidden}
.hero .k{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero h1{color:#fff;font-size:1.6rem}
.hero .who{margin-top:.6rem;font-weight:700;color:#bfe3ff;font-size:.95rem}
.hero svg{position:absolute;right:-.6rem;bottom:-.8rem;opacity:.16;width:7.5rem;height:7.5rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:.9rem .85rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;min-height:5.6rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile:hover{border-color:var(--sea)}
.tile b{font-size:1.02rem}
.tile span{color:var(--mute);font-size:.83rem;line-height:1.35}
.tile i{font-style:normal;font-size:1.35rem}
.tile .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:1rem;padding:0 .5rem;font-size:.8rem;font-weight:700}
.foot{color:var(--mute);font-size:.82rem;text-align:center;margin-top:1.4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1rem;margin-bottom:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:.7rem;padding:.75rem 1.1rem;min-height:3rem;font-weight:600;cursor:pointer;background:var(--sea);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--foam);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--sea);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:#fff;border-radius:2rem;padding:.45rem .85rem;cursor:pointer;font-size:.92rem;min-height:2.5rem}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* επιλογή ενοτήτων */
.chap{border:1px solid var(--line);border-radius:.8rem;background:#fff;margin-bottom:.5rem;overflow:hidden}
.chap>.h{display:flex;align-items:center;gap:.6rem;padding:.65rem .75rem;cursor:pointer}
.chap>.h .n{flex:1;font-weight:600}
.chap>.h .c{color:var(--mute);font-size:.85rem}
.chap .secs{border-top:1px solid var(--line);padding:.3rem .5rem .5rem}
.sec{display:flex;align-items:center;gap:.6rem;padding:.45rem .3rem;border-radius:.5rem;cursor:pointer}
.sec:hover{background:var(--foam)}
.sec .n{flex:1;font-size:.93rem}
.sec .n b{font-weight:600;margin-right:.35rem}
.sec .c{color:var(--mute);font-size:.82rem;white-space:nowrap}
.box{width:1.35rem;height:1.35rem;border:2px solid var(--sea);border-radius:.35rem;flex:none;display:grid;place-items:center;color:#fff;font-size:.85rem;line-height:1}
.box.on{background:var(--sea)}
.box.part{background:linear-gradient(var(--sea),var(--sea)) center/60% 3px no-repeat}
.arrow{transition:transform .15s;color:var(--mute)}
.open .arrow{transform:rotate(90deg)}
/* ερώτηση */
.qhead{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-bottom:.6rem}
.tag{font-size:.78rem;border-radius:1rem;padding:.12rem .55rem;background:var(--foam);color:var(--navy);font-weight:600}
.tag.code{background:#eef0f2;color:var(--mute);font-weight:500}
.tag.pt{background:#fff6dd;color:#7a5600}
.prog{height:.35rem;background:#dfe5ea;border-radius:1rem;overflow:hidden;margin:.2rem 0 .8rem}
.prog>div{height:100%;background:var(--sea)}
.kind{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--sea);font-weight:700;margin-bottom:.3rem}
.ctx{color:var(--mute);font-size:.93rem;margin-bottom:.5rem}
.q{font-size:1.06rem}
.q p{margin:.35rem 0}
.q p.in{padding-left:1.1rem}
.q .pt,.sol .pt{color:var(--mute);font-size:.85em;white-space:nowrap}
.gap{display:inline-block;min-width:5.5rem;border-bottom:2px solid var(--sea);margin:0 .15rem;padding:0 .3rem;text-align:center;color:var(--sea);font-weight:600;cursor:pointer;line-height:1.3}
.gap.sel{background:var(--foam);border-radius:.3rem .3rem 0 0}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.bad{color:var(--bad);border-color:var(--bad)}
.fig{display:block;max-width:100%;height:auto;margin:.6rem auto;border-radius:.4rem;background:#fff;cursor:zoom-in}
img.eq{max-width:100%;height:auto;display:block;margin:.2rem 0}
.opts{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}
.opt{display:flex;gap:.65rem;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:.75rem;padding:.7rem .8rem;cursor:pointer;min-height:3rem}
.opt:hover{border-color:var(--sea)}
.opt .l{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--foam);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.pick{border-color:var(--sea);background:#f2f8fb}
.opt.pick .l{background:var(--sea);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.tf .opt{justify-content:center;font-weight:700;font-size:1.05rem}
.words{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.9rem}
.word{border:1.5px solid var(--line);background:#fff;border-radius:.6rem;padding:.45rem .7rem;cursor:pointer;min-height:2.6rem}
.word b{color:var(--sea);margin-right:.25rem}
.word.used{opacity:.45}
.word.ok{border-color:var(--ok);background:var(--okbg)}
.word.bad{border-color:var(--bad);background:var(--badbg)}
/* αντιστοίχιση */
.colb{background:#f7f9fa;border:1px solid var(--line);border-radius:.7rem;padding:.6rem .75rem;margin:.7rem 0;font-size:.93rem}
.colb div{padding:.18rem 0;display:flex;gap:.5rem}
.colb div b{flex:none;width:1.7rem;color:var(--sea)}
.mrow{border:1px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;margin-bottom:.5rem;background:#fff}
.mrow .lt{font-weight:600;margin-bottom:.35rem}
.mrow .lt b{color:var(--sea);margin-right:.35rem}
.letters{display:flex;flex-wrap:wrap;gap:.35rem}
.letter{min-width:2.6rem;height:2.6rem;border:1.5px solid var(--line);background:#fff;border-radius:.55rem;cursor:pointer;font-weight:700;padding:0 .5rem}
.letter.pick{background:var(--sea);color:#fff;border-color:var(--sea)}
.letter.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.letter.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.letter.want{border:2px dashed var(--ok);color:var(--ok)}
.mrow.ok{border-color:var(--ok)}
.mrow.bad{border-color:var(--bad)}
/* απαντήσεις */
.fb{border-radius:.8rem;padding:.75rem .9rem;margin-top:.9rem;font-size:.97rem}
.fb.ok{background:var(--okbg);border:1px solid #b9dfc9}
.fb.bad{background:var(--badbg);border:1px solid #efc4c0}
.fb.half{background:var(--halfbg);border:1px solid #efd9a0}
.fb.info{background:#f2f6f9;border:1px solid var(--line)}
.fb .h{font-weight:700;margin-bottom:.15rem}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)} .fb.half .h{color:var(--half)}
.sol{background:#fbfcfd;border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:.6rem;padding:.7rem .85rem;margin-top:.9rem}
.sol .lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--sea);font-weight:700;margin-bottom:.25rem}
.sol p{margin:.25rem 0}
.sol p.in{padding-left:1.1rem}
.note{font-size:.88rem;color:#7a5600;background:#fff8e6;border-radius:.5rem;padding:.45rem .65rem;margin-top:.6rem}
.self{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem;margin-top:.8rem}
.self button{border:1.5px solid var(--line);background:#fff;border-radius:.7rem;padding:.6rem .3rem;cursor:pointer;font-weight:600;font-size:.9rem;min-height:3.2rem}
.self .g1{border-color:#9fd3b5;color:var(--ok)} .self .g5{border-color:#ecd18f;color:var(--half)} .self .g0{border-color:#eab2ac;color:var(--bad)}
.self button.on{color:#fff}
.self .g1.on{background:var(--ok)} .self .g5.on{background:var(--half)} .self .g0.on{background:var(--bad)}
.ask{color:var(--mute);font-size:.88rem;margin-top:.5rem}
.navq{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:.55rem .75rem calc(.55rem + env(safe-area-inset-bottom));z-index:15}
.navq .in{max-width:46rem;margin:0 auto;display:flex;gap:.5rem}
.navq .btn{flex:1}
.ab{color:var(--ab);font-size:.82em;font-weight:400}
.pal{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0 .8rem}
.pal button{min-width:2.2rem;height:2.2rem;padding:0 .3rem;border-radius:.45rem;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.8rem}
.pal .pgap{width:.7rem}
.thm{display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:baseline;background:var(--navy);color:#fff;border-radius:.6rem;padding:.45rem .8rem;margin-bottom:.6rem;font-size:.9rem}
.thm b{letter-spacing:.06em}
.thm .pts{margin-left:auto;opacity:.85;font-size:.82rem}
.tag.lab{background:var(--navy);color:#fff}
.struct{margin:.2rem 0 0;padding-left:1.1rem}
.struct li{margin:.25rem 0}
table.parts{margin:.9rem auto 0;border-collapse:collapse;font-size:.92rem;text-align:left}
table.parts td{padding:.25rem .6rem;border-bottom:1px solid var(--line)}
table.parts td:last-child{text-align:right;font-weight:700;white-space:nowrap}
table.parts td:first-child{white-space:nowrap}
.pal button.done{background:var(--foam);border-color:var(--sea)}
.pal button.cur{outline:2px solid var(--navy)}
.pal button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pal button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.pal button.half{background:var(--half);color:#fff;border-color:var(--half)}
/* αποτελέσματα */
.score{text-align:center;padding:1.2rem 1rem}
.score .big{font-size:2.6rem;font-weight:800;color:var(--navy);line-height:1.1}
.score .who{margin-top:.9rem;font-weight:700;color:var(--sea)}
.ring{width:8.5rem;height:8.5rem;margin:0 auto .6rem}
.list .li{display:flex;gap:.6rem;align-items:center;padding:.55rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border-bottom:0}
.list .li .d{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.8rem;flex:none;font-weight:700}
.d.ok{background:var(--ok)} .d.bad{background:var(--bad)} .d.half{background:var(--half)} .d.no{background:#b8c2cb}
.list .li .x{flex:1;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:.55rem;border-radius:1rem;background:#e4e9ee;overflow:hidden;display:flex}
.bar .a{background:var(--ok)} .bar .b{background:var(--gold)}
.pr{padding:.5rem .3rem;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .r{display:flex;justify-content:space-between;gap:.5rem;font-size:.92rem;margin-bottom:.25rem}
.pr .r span{color:var(--mute);white-space:nowrap}
.legend{display:flex;gap:1rem;font-size:.82rem;color:var(--mute);margin:.3rem 0 .6rem}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.3rem;vertical-align:-.1rem}
input[type=search]{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:.7rem;font:inherit;background:#fff}
.th{display:flex;gap:.6rem;align-items:center;padding:.6rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.th:last-child{border-bottom:0}
.th .cd{font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy);min-width:3.6rem}
.th .ss{flex:1;display:flex;flex-wrap:wrap;gap:.25rem}
.th .ss .tag{font-weight:500;font-size:.74rem}
.th .pc{font-size:.8rem;color:var(--mute);white-space:nowrap}
/* παράθυρα */
#modal{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
#modal[hidden]{display:none}
#modal .dlg{background:#fff;border-radius:1rem;max-width:26rem;width:100%;padding:1.1rem}
#modal .dlg h3{margin:.1rem 0 .4rem}
#modal .dlg .row{justify-content:flex-end;margin-top:1rem}
#zoom{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto}
#zoom[hidden]{display:none}
#zoom img{display:block;margin:auto;transform-origin:0 0}
#zoom .zb{position:fixed;right:.7rem;top:.7rem;display:flex;gap:.4rem;z-index:61}
#zoom .zb button{width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:1.2rem;cursor:pointer}
/* προβολέας */
body.proj{background:#fff}
body.proj main{max-width:52rem;padding:1rem 2vw 5rem}
body.proj .card{border:0;padding:0}
body.proj .q{font-size:1.15rem}
body.proj.dark{background:#0b1621;color:#eef3f7}
body.proj.dark .card,body.proj.dark .opt,body.proj.dark .mrow,body.proj.dark .colb,body.proj.dark .sol,body.proj.dark .word,body.proj.dark .letter{background:#13222f;color:#eef3f7;border-color:#2b4255}
body.proj.dark .fig{background:#fff}
body.proj.dark .navq{background:#0b1621;border-color:#2b4255}
body.proj.dark .ctx,body.proj.dark .sub{color:#a9b9c6}
body.proj.dark .ab{color:#9fd08a}
body.proj.dark .tag{background:#1d3448;color:#cfe3f1}
.kbd{font-size:.8rem;color:var(--mute);text-align:center;margin-top:.6rem}
@media (max-width:420px){ .tiles{grid-template-columns:1fr 1fr} .tile{min-height:5.2rem;padding:.75rem .7rem} h1{font-size:1.3rem} }
@media print{ #bar,.navq{display:none} }
</style>
</head>

ε αρχή μέτρησης τον Ισημερινό. Οι τιμές που λαμβάνει το γεωγραφικό μήκος είναι από 000° 00΄ έως 180° 00΄ με αρχή μέτρησης τον πρώτο μεσημβρινό (Greenwich)."},{"id":"18009-Θδ","th":"18009","part":"","lab":"δ","k":"open","secs":["1.3"],"p":5,"ctx":"Βασική προϋπόθεση για να προσδιορίσουμε την ακριβή θέση ενός τόπου πάνω στην επιφάνεια της γης, είναι να γνωρίζουμε τις γεωγραφικές συντεταγμένες του τόπου (στίγμα). Να απαντήσετε με συντομία στα εξής:","q":"Πως χαρακτηρίζονται οι γεωγραφικές συντεταγμένες;","sol":"Το γεωγραφικό πλάτος χαρακτηρίζεται Βόρειο/North (Β/N) ή Νότιο/South (Ν/S) ανάλογα αν ο τόπος είναι στο βόρειο ή νότιο ημισφαίριο αντίστοιχα. Το γεωγραφικό μήκος χαρακτηρίζεται Ανατολικό/ East (Α/E) ή Δυτικό/ West (Δ/W) ανάλογα αν ο τόπος είναι στο ανατολικό ή δυτικό ημισφαίριο αντίστοιχα."},{"id":"18720-2.1α","th":"18720","part":"2.1","lab":"α","k":"open","secs":["4.1-4.3"],"p":5,"ctx":"Να περιγράψετε με συντομία τις εργασίες στο ναυτικό χάρτη που χρησιμοποιείται:","q":"O διπαράλληλος κανόνας.","sol":"Για τη μέτρηση και χάραξη πορείας, διοπτεύσεως και οποιασδήποτε γωνίας στο ναυτικό χάρτη."},{"id":"18720-2.1β","th":"18720","part":"2.1","lab":"β","k":"open","secs":["4.1-4.3"],"p":5,"ctx":"Να περιγράψετε με συντομία τις εργασίες στο ναυτικό χάρτη που χρησιμοποιείται:","q":"O ναυτικός διαβήτης (κουμπάσο).","sol":"Για τη μέτρηση αποστάσεων και συντεταγμένων (φ/λ) στο ναυτικό χάρτη."},{"id":"18720-2.2α","th":"18720","part":"2.2","lab":"α","k":"open","secs":["5.1-5.2"],"p":5,"ctx":"Να απαντήσετε με συντομία στα εξής:","q":"Τί εννοούμε με τον όρο αναμέτρηση (DeadReckoning, D.R.);","sol":"Με τον όρο αναμέτρηση (DeadReckoning, D.R.), εννοούμε λογιστικό ή γραφικό προσδιορισμό του στίγματος του πλοίου, με βάση την πορεία, την ταχύτητα και το χρόνο πλου που μεσολάβησε αρχίζοντας από γνωστό ακριβές στίγμα."},{"id":"18720-2.2β","th":"18720","part":"2.2","lab":"β","k":"open","secs":["5.1-5.2"],"p":10,"ctx":"Να απαντήσετε με συντομία στα εξής:","q":"Ποια είναι τα βασικά στοιχεία, οι υπολογισμοί και οι συντμήσειςπου χρησιμοποιούνται στην αναμέτρηση; (απαιτούνται πέντε)","sol":"Πέντε (5) από: Πλεύση, Πορεία (ζλ), Γραμμή πορείας, Χρόνος, Ταχύτητα, Στίγμα ακριβείας, Στίγμα αναμέτρησης."},{"id":"20044-2.1","th":"20044","part":"2.1","k":"open","secs":["M5"],"p":15,"q":"Σύμφωνα με τα ακόλουθα διανύσματα, να αναφέρετε τη διεύθυνση και την ένταση του ανέμου.","img":"20044_fig","sol":"α. Β 50, β. ΒΑ 5, γ. ΒΑ 10"},{"id":"20044-2.2","th":"20044","part":"2.2","k":"open","secs":["M5"],"p":10,"q":"Να αναφέρετε ονομαστικά τα μέσα που χρησιμοποιούνται για την παροχή μετεωρολογικών πληροφοριών στα πλοία.","sol":"Αγγελίες – Μετεωρολογικά δελτία, το τηλομοιότυπο (Facsimile), το Navtex"},{"id":"20242-Θα","th":"20242","part":"","lab":"α","k":"open","secs":["1.1-1.2"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"άξονας της γης","sol":"Ο άξονας περί τον οποίο περιστρέφεται η γήινη σφαίρα."},{"id":"20242-Θβ","th":"20242","part":"","lab":"β","k":"open","secs":["1.1-1.2"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"μέγιστος κύκλος","sol":"Ο κύκλος που το επίπεδό του περνάει υποχρεωτικά από το κέντρο της γης."},{"id":"20242-Θγ","th":"20242","part":"","lab":"γ","k":"open","secs":["1.1-1.2"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"ισημερινός","sol":"Ο μέγιστος κύκλος που το επίπεδό του είναι κάθετο προς τον άξονα της γης."},{"id":"20242-Θδ","th":"20242","part":"","lab":"δ","k":"open","secs":["1.1-1.2"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"παράλληλος κύκλος ή παράλληλος πλάτους","sol":"Ο μικρός κύκλος που το επίπεδό του είναι παράλληλο προς το επίπεδο του ισημερινού, επομένως και κάθετο προς τον άξονα της γης."},{"id":"20242-Θε","th":"20242","part":"","lab":"ε","k":"open","secs":["1.1-1.2"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"μεσημβρινός","sol":"Ο μέγιστος κύκλος που διέρχεται από τους πόλους της γης και φυσικά περιέχει τον άξονά της."},{"id":"23964-Θα","th":"23964","part":"","lab":"α","k":"open","secs":["1.3"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Γεωγραφικό Πλάτος (φ)","sol":"Γεωγραφικό Πλάτος φ ενός σημείου ή τόπου επάνω στην επιφάνεια της γής ονομάζεται η γωνία που σχηματίζει η κάθετη στο ελλειψοειδές ή τη σφαίρα από το σημείο με το επίπεδο του ισημερινού."},{"id":"23964-Θβ","th":"23964","part":"","lab":"β","k":"open","secs":["1.3"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Γεωγραφικό μήκος (λ)","sol":"Γεωγραφικό Μήκος λ ενός σημείου ή τόπου στην επιφάνεια της γής ονομάζεται η γωνία που σχηματίζει το μεσημβρινό επίπεδο του σημείου με τον πρώτο μεσημβρινό."},{"id":"23964-Θγ","th":"23964","part":"","lab":"γ","k":"open","secs":["1.3"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Διαφορα πλατους (Δφ)","sol":"Διαφορά Πλάτους δύο τόπων ονομάζουμε το τόξο μεσημβρινού,που περιλαμβάνεται μεταξύ των δύο παραλλήλων πλάτους των τόπων."},{"id":"23964-Θδ","th":"23964","part":"","lab":"δ","k":"open","secs":["1.3"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Διαφορά μήκους (Δλ)","sol":"Διαφορά Μήκους δύο τόπων ονομάζουμε το μικρότερο από 180° τόξο του ισημερινού που περιλαμβάνεται μεταξύ των μεσημβρινών των τόπων αυτών."},{"id":"23964-Θε","th":"23964","part":"","lab":"ε","k":"open","secs":["1.3"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Τελικό Στίγμα","sol":"Τελικό Στίγμα είναι όταν γνωρίζουμε τις συντεταγμένες (φ/λ) του αρχικού στίγματος απόπλου του πλοίου και τις διαφορές πλάτους (Δφ/Δλ) ώς το τελικό στίγμα κατάπλου."},{"id":"24708-2.1","th":"24708","part":"2.1","k":"open","secs":["M5"],"p":15,"q":"Σύμφωνα με τα ακόλουθα διανύσματα, να αναφέρετε τη διεύθυνση και την ένταση του ανέμου.","img":"24708_fig","sol":"α. Β 60, β. Β15, γ. ΒΑ40"},{"id":"24708-2.2","th":"24708","part":"2.2","k":"open","secs":["M4"],"p":10,"q":"Να αναφέρετε ονομαστικά τα είδη των μετώπων.","sol":"Θερμό, Ψυχρό, Στάσιμο, Συνεσφιγμένο."},{"id":"17992-2.1","th":"17992","part":"2.1","k":"match","secs":["1.7","1.8-1.9"],"p":15,"q":"Δίδεται το παρακάτω σχήμα. Να γράψετε στην κόλλα σας τους αριθμούς 1,2,3 και δίπλα την ονομασία των γωνιών στις οποίες αντιστοιχούν.","rows":[{"t":"1.","s":"1.7","a":[0]},{"t":"2.","s":"1.8-1.9","a":[1]},{"t":"3.","s":"1.8-1.9","a":[2]}],"opts":["Απόκλιση (Απ)","Παραλλαγή (Πρ)","Παρεκτροπή (Τρ)"],"img":"17992_fig"},{"id":"17992-2.2","th":"17992","part":"2.2","k":"open","secs":["1.5-1.6"],"p":10,"q":"Στη ναυσιπλοΐα, η κατεύθυνση εκφράζεται σε μοίρες ή και ανεμόρομβους παλαιότερα, με αρχή μετρήσεως την κατεύθυνση του βορρά ή της πλώρης του πλοίου. Ποιες είναι οι κατευθύνσεις του βορρά που χρησιμοποιούνται;","sol":"Οι τρεις κατευθύνσεις του βορρά που χρησιμοποιούνται είναι ο Αληθής Βορράς (Βλ), ο Μαγνητικός Βορράς (Βμ) και ο Βορράς πυξίδας (Βπ)."},{"id":"24153-2.1","th":"24153","part":"2.1","k":"match","secs":["1.7","1.8-1.9"],"p":15,"q":"Δίδεται το παρακάτω σχήμα. Να γράψετε στην κόλλα σας τους αριθμούς 1,2,3 και δίπλα την ονομασία των γωνιών στις οποίες αντιστοιχούν.","rows":[{"t":"1.","s":"1.8-1.9","a":[1]},{"t":"2.","s":"1.7","a":[0]},{"t":"3.","s":"1.8-1.9","a":[2]}],"opts":["Απόκλιση (Απ)","Παραλλαγή (Πρ)","Παρεκτροπή (Τρ)"],"img":"24153_fig"},{"id":"24153-2.2","th":"24153","part":"2.2","k":"open","secs":["1.5-1.6"],"p":10,"q":"Από τι αντιπροσωπεύεται η κατεύθυνση της πλώρης του πλοίου;","sol":"Η κατεύθυνση της πλώρης του πλοίου αντιπροσωπεύεται από το διάμηκες αυτού, το οποίο είναι η νοητή γραμμή πλώρης-πρύμνης, ή και κάθε παράλληλη γραμμή προς αυτή."},{"id":"19020-2.1α","th":"19020","part":"2.1","lab":"α","k":"fill","secs":["3.3"],"p":3,"q":"Το κάθε στοιχείο που συνθέτει το φωτεινό φαινόμενο (αναλαμπή, έκλαμψη, διάλειψη κλπ.) του χαρακτηριστικού του φάρου ονομάζεται ⟨⟩.","opts":["φάροι","σύστημα «A»","εναλλασσόμενους","φάση","περίοδος","ραδιοσημαντήρες"],"a":3},{"id":"19020-2.1β","th":"19020","part":"2.1","lab":"β","k":"fill","secs":["3.3"],"p":3,"q":"Οι φάροι κατατάσσονται σε τρεις βασικές κατηγορίες: στους σταθερούς, τους ρυθμικούς και τους ⟨⟩.","opts":["φάροι","σύστημα «A»","εναλλασσόμενους","φάση","περίοδος","ραδιοσημαντήρες"],"a":2},{"id":"19020-2.1γ","th":"19020","part":"2.1","lab":"γ","k":"fill","secs":["3.3"],"p":3,"q":"Το χρονικό διάστημα που απαιτείται για να ολοκληρωθεί μια πλήρης εναλλαγή του χαρακτηριστικού ενός φωτεινού σήματος ονομάζεται ⟨⟩.","opts":["φάροι","σύστημα «A»","εναλλασσόμενους","φάση","περίοδος","ραδιοσημαντήρες"],"a":4},{"id":"19020-2.1δ","th":"19020","part":"2.1","lab":"δ","k":"fill","secs":["3.8"],"p":3,"q":"Το ⟨⟩ είναι συνδυασμός πλευρικής και τεταρτοκυκλικής σημάνσεως (κόκκινο στα αριστερά).","opts":["φάροι","σύστημα «A»","εναλλασσόμενους","φάση","περίοδος","ραδιοσημαντήρες"],"a":1},{"id":"19020-2.1ε","th":"19020","part":"2.1","lab":"ε","k":"fill","secs":["3.3"],"p":3,"q":"Τα φωτεινά σήματα εκπέμπονται από ειδικά μηχανήματα που ονομάζονται γενικά ⟨⟩.","opts":["φάροι","σύστημα «A»","εναλλασσόμενους","φάση","περίοδος","ραδιοσημαντήρες"],"a":0},{"id":"19020-2.2α","th":"19020","part":"2.2","lab":"α","k":"open","secs":["3.3"],"p":5,"ctx":"Να απαντήσετε με συντομία στα έξης:","q":"Πότε ένας φάρος ή φανός έχει τόξο ορατότητας ή φωτεινό τομέα 360°;","sol":"Ένας φάρος ή φανός έχει τόξο ορατότητας ή φωτεινό τομέα 360° όταν φωτίζει ολόκληρο τον ορίζοντα, δηλαδή κατά 360°."},{"id":"19020-2.2β","th":"19020","part":"2.2","lab":"β","k":"open","secs":["3.3"],"p":5,"ctx":"Να απαντήσετε με συντομία στα έξης:","q":"Πότε ένας φάρος ή φανός παρουσιάζει σκοτεινό τομέα;","sol":"Ένας φάρος ή φανός παρουσιάζει σκοτεινό τομέα όταν το φως του δεν είναι ορατό σε ολόκληρο τον ορίζοντα, δηλαδή κατά 360°."},{"id":"19602-2.1α","th":"19602","part":"2.1","lab":"α","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Τυχούσα λοξοδρομία αναπαριστάνεται ως ⟨⟩ γραμμή που τέμνει τους μεσημβρινούς υπό σταθερή γωνία.","opts":["διόπτρες","πλευρική","τομής","ευθεία","Χρόνος","απόσταση"],"a":3},{"id":"19602-2.1β","th":"19602","part":"2.1","lab":"β","k":"fill","secs":["3.8"],"p":3,"q":"Η ⟨⟩ σήμανση δείχνει το αριστερό και δεξιό μέρος της διαδρομής (πορείας) που πρέπει να ακολουθηθεί.","opts":["διόπτρες","πλευρική","τομής","ευθεία","Χρόνος","απόσταση"],"a":1},{"id":"19602-2.1γ","th":"19602","part":"2.1","lab":"γ","k":"fill","secs":["4.7-4.10"],"p":3,"q":"Για τη μέτρηση των διοπτεύσεων γήινων αντικειμένων και του αζιμούθ των ουράνιων σωμάτων χρησιμοποιούνται ⟨⟩ ή παλινώρια.","opts":["διόπτρες","πλευρική","τομής","ευθεία","Χρόνος","απόσταση"],"a":0},{"id":"19602-2.1δ","th":"19602","part":"2.1","lab":"δ","k":"fill","secs":["5.1-5.2"],"p":3,"q":"⟨⟩ είναι το χρονικό διάλειμμα μεταξύ δύο στιγμάτων.","opts":["διόπτρες","πλευρική","τομής","ευθεία","Χρόνος","απόσταση"],"a":4},{"id":"19602-2.1ε","th":"19602","part":"2.1","lab":"ε","k":"fill","secs":["6.10-6.11"],"p":3,"q":"Το ακτοπλοϊκό στίγμα με δύο ή περισσότερες διοπτεύσεις ισάριθμων καταφανών αντικειμένων είναι η τομή τους, γι’ αυτό και λέγεται στίγμα ⟨⟩.","opts":["διόπτρες","πλευρική","τομής","ευθεία","Χρόνος","απόσταση"],"a":2},{"id":"19602-2.2α","th":"19602","part":"2.2","lab":"α","k":"open","secs":["1.3"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"γεωγραφικό πλάτος φ (latitude, lat).","sol":"Γεωγραφικό πλάτος φ (latitude, lat) ονομάζεται το τόξο του μεσημβρινού που περνάει από τον τόπο και περιλαμβάνεται μεταξύ του ισημερινού και του παράλληλου πλάτους του ίδιου τόπου, χαρακτηρίζεται ως βόρειο Β ή νότιο Ν και παίρνει τιμές από 00° έως 90°."},{"id":"19602-2.2β","th":"19602","part":"2.2","lab":"β","k":"open","secs":["1.3"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"γεωγραφικό μήκος λ (longitude, long).","sol":"Γεωγραφικό μήκος λ (longitude, long) ονομάζεται το τόξο του ισημερινού που περιλαμβάνεται μεταξύ του πρώτου μεσημβρινού και του μεσημβρινού του τόπου, χαρακτηρίζεται ως ανατολικό Α ή δυτικό Δ και παίρνει τιμές από 000° έως 180°."},{"id":"20101-2.1α","th":"20101","part":"2.1","lab":"α","k":"fill","secs":["2.10-2.11"],"p":3,"q":"Ο ναυτικός χάρτης αναπαριστάνει ⟨⟩ τμήμα της επιφάνειας της γης σε φύλλο μερκατορικής προβολής με όλες τις χρήσιμες ναυτιλιακές πληροφορίες.","opts":["περιοχή","πορτολάνες","πλεύσιμο","μικρής","μεσημβρινούς","διορθώσεις"],"a":2},{"id":"20101-2.1β","th":"20101","part":"2.1","lab":"β","k":"fill","secs":["2.10-2.11"],"p":3,"q":"Ο τίτλος του χάρτη κατά κυριολεξία προσδιορίζει την ⟨⟩ που απεικονίζει ο χάρτης.","opts":["περιοχή","πορτολάνες","πλεύσιμο","μικρής","μεσημβρινούς","διορθώσεις"],"a":0},{"id":"20101-2.1γ","th":"20101","part":"2.1","lab":"γ","k":"fill","secs":["2.10-2.11"],"p":3,"q":"Τα όρια του μήκους του χάρτη προσδιορίζονται από τους δύο ακραίους ⟨⟩ αριστερά και δεξιά.","opts":["περιοχή","πορτολάνες","πλεύσιμο","μικρής","μεσημβρινούς","διορθώσεις"],"a":4},{"id":"20101-2.1δ","th":"20101","part":"2.1","lab":"δ","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Οι ⟨⟩ ονομάζονται και χάρτες λιμανιών.","opts":["περιοχή","πορτολάνες","πλεύσιμο","μικρής","μεσημβρινούς","διορθώσεις"],"a":1},{"id":"20101-2.1ε","th":"20101","part":"2.1","lab":"ε","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Με κριτήριο την κλίμακα του χάρτη έχουμε δύο είδη ναυτικών χαρτών, τους χάρτες μεγάλης κλίμακας και τους χάρτες ⟨⟩ κλίμακας.","opts":["περιοχή","πορτολάνες","πλεύσιμο","μικρής","μεσημβρινούς","διορθώσεις"],"a":3},{"id":"20101-2.2","th":"20101","part":"2.2","k":"open","secs":["2.6-2.9"],"p":10,"q":"Να αναφέρετε πέντε (5) ιδιότητες του μερκατορικού χάρτη.","sol":"Πέντε ιδιότητες του μερκατορικού χάρτη από τις εξής:<br>1) Οι μεσημβρινοί με τον ισημερινό και τους παράλληλους πλάτους αποτελούν δίκτυο παραλλήλων και καθέτων μεταξύ τους ευθείων γραμμών.<br>2) Οι μεσημβρινοί με την ίδια διαφορά μήκους ισαπέχουν, ενώ οι παράλληλοι με την ίδια διαφορά πλάτους παρουσιάζουν αυξομερείς αποστάσεις, αυξανόμενες συνεχώς προς τα ψηλότερα πλάτη.<br>3) Διατηρείται η ισότητα των γωνιών, επομένως και η ομοιότητα των μικρών σχημάτων.<br>4) Τυχούσα λοξοδρομία αναπαριστάνεται ως ευθεία γραμμή που τέμνει τους μεσημβρινούς υπό σταθερή γωνία.<br>5) Οι παραμορφώσεις των γεωγραφικών λεπτομερειών είναι μικρές κοντά στον ισημερινό και μεγαλύτερες στα ψηλότερα πλάτη.<br>6) Για τον ίδιο λόγο είναι αδύνατη η κατασκευή μερκατορικού χάρτη των πολικών περιοχών.<br>7) Εφόσον οι λοξοδρομίες παριστάνονται ως ευθείες γραμμές στο μερκατορικό χάρτη, οι ορθοδρομίες, ως μέγιστοι κύκλοι, θα φαίνονται σαν καμπύλες με τα κυρτά τους προς τους πόλους και τα κοίλα τους προς τον ισημερινό."},{"id":"20572-2.1α","th":"20572","part":"2.1","lab":"α","k":"fill","secs":["3.10"],"p":3,"ctx":"Οι ραδιοσημαντήρες είναι δύο ειδών:","q":"Οι ⟨⟩ που φέρουν δέκτη για λήψη και επεξεργασία των παλμών radar και πομπό για την εκπομπή των κωδικοποιημένων σημάτων.","opts":["διόπτευση","στραμμένη","racon","διακεκομμένη","μεταβλητή","απόσταση"],"a":2},{"id":"20572-2.1β","th":"20572","part":"2.1","lab":"β","k":"fill","secs":["3.10"],"p":3,"ctx":"Οι ραδιοσημαντήρες είναι δύο ειδών:","q":"Για να αναγνωρίζονται μεταξύ τους, κάθε σύστημα έχει δικό του κωδικό σήμα. Το σύστημα αυτό δίνει ⟨⟩ και απόσταση.","opts":["διόπτευση","στραμμένη","racon","διακεκομμένη","μεταβλητή","απόσταση"],"a":0},{"id":"20572-2.1γ","th":"20572","part":"2.1","lab":"γ","k":"fill","secs":["3.10"],"p":3,"ctx":"Οι ραδιοσημαντήρες είναι δύο ειδών:","q":"Οι ramark που εκπέμπουν ταχέως σε ⟨⟩ συχνότητα, ώστε να καλύπτουν οποιαδήποτε συχνότητα των radar (9310-9500 Mc).","opts":["διόπτευση","στραμμένη","racon","διακεκομμένη","μεταβλητή","απόσταση"],"a":4},{"id":"20572-2.1δ","th":"20572","part":"2.1","lab":"δ","k":"fill","secs":["3.10"],"p":3,"ctx":"Οι ραδιοσημαντήρες είναι δύο ειδών:","q":"Έτσι όταν η κεραία radar είναι ⟨⟩ προς το ramark οπωσδήποτε η συχνότητά του θα συμπέσει με εκείνη του radar.","opts":["διόπτευση","στραμμένη","racon","διακεκομμένη","μεταβλητή","απόσταση"],"a":1},{"id":"20572-2.1ε","th":"20572","part":"2.1","lab":"ε","k":"fill","secs":["3.10"],"p":3,"ctx":"Οι ραδιοσημαντήρες είναι δύο ειδών:","q":"Στην οθόνη του θα εμφανισθεί ⟨⟩ ευθεία γραμμή, από το κέντρο προς την περιφέρεια, η οποία θα αντιπροσωπεύει τη διόπτευση του ramark. Το σύστημα αυτό δεν δίνει και την απόσταση του ραδιοσημαντήρα.","opts":["διόπτευση","στραμμένη","racon","διακεκομμένη","μεταβλητή","απόσταση"],"a":3},{"id":"20572-2.2α","th":"20572","part":"2.2","lab":"α","k":"open","secs":["M3"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"απόλυτη υγρασία","sol":"Είναι ο λόγος της μάζα των υδρατμών διά τον όγκο αέρα που τους περιέχει. Μετριέται σε γραμμάρια ανά κυβικό μέτρο (gr/m<sup>3</sup>)."},{"id":"20572-2.2β","th":"20572","part":"2.2","lab":"β","k":"open","secs":["M3"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"σχετική υγρασία","sol":"Είναι ο λόγος της μάζας των υδρατμών που περιέχονται σε δεδομένο όγκο αέρα προς τη μάζα των υδρατμών που θα υπήρχε αν ο αέρας αυτός ήταν κορεσμένος στην ίδια θερμοκρασία. Εκφράζεται σε ποσοστό επί τοις εκατό (%)."},{"id":"23704-2.1α","th":"23704","part":"2.1","lab":"α","k":"fill","secs":["4.1-4.3"],"p":3,"q":"Ο ⟨⟩ χρησιμοποιείται για τη μέτρηση και χάραξη πορείας, διοπτεύσεως και οποιασδήποτε γωνίας στο ναυτικό χάρτη.","opts":["ναυτικός διαβήτης","στίγματος","διπαράλληλος κανόνας","απόσταση","ισημερινού"],"a":2},{"id":"23704-2.1β","th":"23704","part":"2.1","lab":"β","k":"fill","secs":["4.1-4.3"],"p":3,"q":"Για τη μέτρηση αποστάσεων και συντεταγμένων (φ/λ) στο ναυτικό χάρτη χρησιμοποιείται ο ⟨⟩ (κουμπάσο).","opts":["ναυτικός διαβήτης","στίγματος","διπαράλληλος κανόνας","απόσταση","ισημερινού"],"a":0},{"id":"23704-2.1γ","th":"23704","part":"2.1","lab":"γ","k":"fill","secs":["5.1-5.2"],"p":3,"q":"Με τον όρο αναμέτρηση (Dead Reckoning, D.R.), εννοούμε τον λογιστικό ή γραφικό προσδιορισμό ⟨⟩ του πλοίου, με βάση την πορεία, την ταχύτητα και το χρόνο πλου που μεσολάβησε, αρχίζοντας από γνωστό ακριβές στίγμα.","opts":["ναυτικός διαβήτης","στίγματος","διπαράλληλος κανόνας","απόσταση","ισημερινού"],"a":1},{"id":"23704-2.1δ","th":"23704","part":"2.1","lab":"δ","k":"fill","secs":["1.3"],"p":3,"q":"Γεωγραφικό μήκος ονομάζεται το τόξο του ⟨⟩ που περιλαμβάνεται μεταξύ του πρώτου μεσημβρινού και του μεσημβρινού του τόπου.","opts":["ναυτικός διαβήτης","στίγματος","διπαράλληλος κανόνας","απόσταση","ισημερινού"],"a":4},{"id":"23704-2.1ε","th":"23704","part":"2.1","lab":"ε","k":"fill","secs":["1.17-1.19"],"p":3,"q":"Το μήκος της νοητής γραμμής που συνδέει δύο σημεία πάνω στην επιφάνεια της γης, στην ναυσιπλοΐα χαρακτηρίζεται ως ⟨⟩","opts":["ναυτικός διαβήτης","στίγματος","διπαράλληλος κανόνας","απόσταση","ισημερινού"],"a":3},{"id":"23704-2.2α","th":"23704","part":"2.2","lab":"α","k":"open","secs":["1.17-1.19"],"p":5,"ctx":"Για τη μέτρηση των αποστάσεων στην ναυσιπλοΐα χρησιμοποιείται το ναυτικό μίλι (ν.μ.)","q":"Τι αντιπροσωπεύει το ναυτικό μίλι","sol":"Το ναυτικό μίλι αντιπροσωπεύει το σταθερό γραμμικό ανάπτυγμα τόξου μεσημβρινού ενός πρώτου της μοίρας (Δφ1’) στο γεωγραφικό πλάτος 45° Β ή Ν."},{"id":"23704-2.2β","th":"23704","part":"2.2","lab":"β","k":"open","secs":["1.17-1.19"],"p":5,"ctx":"Για τη μέτρηση των αποστάσεων στην ναυσιπλοΐα χρησιμοποιείται το ναυτικό μίλι (ν.μ.)","q":"Ποια η διεθνώς παραδεκτή τιμή του ναυτικού μιλίου σε μέτρα και σε τι υποδιαιρείται","sol":"Η διεθνώς παραδεκτή τιμή του ναυτικού μιλίου (ν.μ.) είναι ίση προς 1852 μέτρα ακριβώς. Το ν.μ. υποδιαιρείται σε δέκατα ή στάδια."},{"id":"24070-2.1α","th":"24070","part":"2.1","lab":"α","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Στο ναυτικό χάρτη κλίμακα μήκους είναι ο ⟨⟩.","opts":["ηλικία","ισημερινός","αγγελίες","μεσημβρινούς","απόσταση","ακτοπλοϊκοί"],"a":1},{"id":"24070-2.1β","th":"24070","part":"2.1","lab":"β","k":"fill","secs":["2.10-2.11"],"p":3,"q":"Η πρώτη έκδοση ενός χάρτη δείχνει την ⟨⟩ του.","opts":["ηλικία","ισημερινός","αγγελίες","μεσημβρινούς","απόσταση","ακτοπλοϊκοί"],"a":0},{"id":"24070-2.1γ","th":"24070","part":"2.1","lab":"γ","k":"fill","secs":["2.10-2.11"],"p":3,"q":"Τα όρια του μήκους του χάρτη προσδιορίζονται από τους δύο ακραίους ⟨⟩ αριστερά και δεξιά.","opts":["ηλικία","ισημερινός","αγγελίες","μεσημβρινούς","απόσταση","ακτοπλοϊκοί"],"a":3},{"id":"24070-2.1δ","th":"24070","part":"2.1","lab":"δ","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Οι χάρτες, οι οποίοι δείχνουν με λεπτομέρεια κινδύνους, όπως αβαθή, βράχους και υφάλους ονομάζονται ⟨⟩.","opts":["ηλικία","ισημερινός","αγγελίες","μεσημβρινούς","απόσταση","ακτοπλοϊκοί"],"a":5},{"id":"24070-2.1ε","th":"24070","part":"2.1","lab":"ε","k":"fill","secs":["2.10-2.11"],"p":3,"q":"Οι μικρές διορθώσεις προέρχονται από ⟨⟩.","opts":["ηλικία","ισημερινός","αγγελίες","μεσημβρινούς","απόσταση","ακτοπλοϊκοί"],"a":2},{"id":"24070-2.2","th":"24070","part":"2.2","k":"open","secs":["2.6-2.9"],"p":10,"q":"Να αναφέρετε πέντε (5) ιδιότητες του μερκατορικού χάρτη.","sol":"Πέντε ιδιότητες του μερκατορικού χάρτη από τις εξής:<br>1) Οι μεσημβρινοί με τον ισημερινό και τους παράλληλους πλάτους αποτελούν δίκτυο παραλλήλων και καθέτων μεταξύ τους ευθείων γραμμών.<br>2) Οι μεσημβρινοί με την ίδια διαφορά μήκους ισαπέχουν, ενώ οι παράλληλοι με την ίδια διαφορά πλάτους παρουσιάζουν αυξομερείς αποστάσεις, αυξανόμενες συνεχώς προς τα ψηλότερα πλάτη.<br>3) Διατηρείται η ισότητα των γωνιών, επομένως και η ομοιότητα των μικρών σχημάτων.<br>4) Τυχούσα λοξοδρομία αναπαριστάνεται ως ευθεία γραμμή που τέμνει τους μεσημβρινούς υπό σταθερή γωνία.<br>5) Οι παραμορφώσεις των γεωγραφικών λεπτομερειών είναι μικρές κοντά στον ισημερινό και μεγαλύτερες στα ψηλότερα πλάτη.<br>6) Για τον ίδιο λόγο είναι αδύνατη η κατασκευή μερκατορικού χάρτη των πολικών περιοχών.<br>7) Εφόσον οι λοξοδρομίες παριστάνονται ως ευθείες γραμμές στο μερκατορικό χάρτη, οι ορθοδρομίες, ως μέγιστοι κύκλοι, θα φαίνονται σαν καμπύλες με τα κυρτά τους προς τους πόλους και τα κοίλα τους προς τον ισημερινό."},{"id":"24071-2.1α","th":"24071","part":"2.1","lab":"α","k":"fill","secs":["3.3"],"p":3,"q":"Φάρος με ίση διάρκεια φωτός και σκότους ονομάζεται ⟨⟩.","opts":["δέσμη σπίθας","κατευθυνόμενοι","ραδιοσημαντήρες","περίοδος","ισοφασικός","φαροφύλακες"],"a":4},{"id":"24071-2.1β","th":"24071","part":"2.1","lab":"β","k":"fill","secs":["3.3"],"p":3,"q":"⟨⟩ ονομάζεται μια σπίθα, στην οποία μια δέσμη εκλάμψεων καθορισμένου αριθμού επαναλαμβάνεται κανονικά.","opts":["δέσμη σπίθας","κατευθυνόμενοι","ραδιοσημαντήρες","περίοδος","ισοφασικός","φαροφύλακες"],"a":0},{"id":"24071-2.1γ","th":"24071","part":"2.1","lab":"γ","k":"fill","secs":["3.3"],"p":3,"q":"Το χρονικό διάστημα που απαιτείται για να ολοκληρωθεί μια πλήρης εναλλαγή του χαρακτηριστικού ενός φωτεινού σήματος ονομάζεται ⟨⟩.","opts":["δέσμη σπίθας","κατευθυνόμενοι","ραδιοσημαντήρες","περίοδος","ισοφασικός","φαροφύλακες"],"a":3},{"id":"24071-2.1δ","th":"24071","part":"2.1","lab":"δ","k":"fill","secs":["3.3"],"p":3,"q":"Οι ⟨⟩ φανοί επισημαίνουν την πλεύσιμη κατεύθυνση φωτίζοντας με ιδιαίτερη ένταση έναν τομέα πολύ μικρού εύρους.","opts":["δέσμη σπίθας","κατευθυνόμενοι","ραδιοσημαντήρες","περίοδος","ισοφασικός","φαροφύλακες"],"a":1},{"id":"24071-2.1ε","th":"24071","part":"2.1","lab":"ε","k":"fill","secs":["3.3"],"p":3,"q":"Παλαιότερα, οι φάροι, οι οποίοι επεσήμαιναν επίκαιρα σημεία για την ασφάλεια της ναυσιπλοΐας, ήταν επανδρωμένοι με ειδικευμένο προσωπικό, τους ⟨⟩.","opts":["δέσμη σπίθας","κατευθυνόμενοι","ραδιοσημαντήρες","περίοδος","ισοφασικός","φαροφύλακες"],"a":5},{"id":"24071-2.2α","th":"24071","part":"2.2","lab":"α","k":"open","secs":["3.3"],"p":5,"ctx":"Να απαντήσετε με συντομία στα έξης:","q":"Τί ονομάζουμε φάση ενός φανού;","sol":"Το κάθε στοιχείο, που συνθέτει το φωτεινό φαινόμενο (αναλαμπή, έκλαμψη, διάλειψη) του χαρακτηριστικού του φάρου, ονομάζεται φάση."},{"id":"24071-2.2β","th":"24071","part":"2.2","lab":"β","k":"open","secs":["3.3"],"p":10,"ctx":"Να απαντήσετε με συντομία στα έξης:","q":"Ποιες είναι οι τρεις βασικές κατηγορίες, στις οποίες κατατάσσονται οι φάροι και οι φανοί, ανάλογα με τη σταθερότητα και τη διάρκεια του φωτός που εκπέμπουν;","sol":"Οι τρεις βασικές κατηγορίες, στις οποίες κατατάσσονται οι φάροι και οι φανοί, ανάλογα με τη σταθερότητα και τη διάρκεια του φωτός που εκπέμπουν, είναι: σταθεροί, ρυθμικοί και εναλλασσόμενοι."},{"id":"28273-2.1α","th":"28273","part":"2.1","lab":"α","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Τυχούσα λοξοδρομία αναπαριστάνεται ως ⟨⟩ γραμμή που τέμνει τους μεσημβρινούς υπό σταθερή γωνία.","opts":["σχημάτων","ευθεία","ισαπέχουν","παραλλήλων","πολικών","Ισημερινό"],"a":1},{"id":"28273-2.1β","th":"28273","part":"2.1","lab":"β","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Διατηρείται η ισότητα των γωνιών, επομένως και η ομοιότητα των μικρών ⟨⟩","opts":["σχημάτων","ευθεία","ισαπέχουν","παραλλήλων","πολικών","Ισημερινό"],"a":0},{"id":"28273-2.1γ","th":"28273","part":"2.1","lab":"γ","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Οι μεσημβρινοί με τον ισημερινό και τους παράλληλους πλάτους αποτελούν δίκτυο ⟨⟩ και κάθετων μεταξύ τους ευθειών γραμμών.","opts":["σχημάτων","ευθεία","ισαπέχουν","παραλλήλων","πολικών","Ισημερινό"],"a":3},{"id":"28273-2.1δ","th":"28273","part":"2.1","lab":"δ","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Οι μεσημβρινοί με την ίδια διαφορά μήκους ⟨⟩, ενώ οι παράλληλοι με την ίδια διαφορά πλάτους παρουσιάζουν αυξομερείς αποστάσεις, αυξανόμενες συνεχώς προς τα ψηλότερα πλάτη.","opts":["σχημάτων","ευθεία","ισαπέχουν","παραλλήλων","πολικών","Ισημερινό"],"a":2},{"id":"28273-2.1στ","th":"28273","part":"2.1","lab":"στ","k":"fill","secs":["2.6-2.9"],"p":3,"q":"Είναι αδύνατη η κατασκευή μερκατορικού χάρτη των ⟨⟩ περιοχών.","opts":["σχημάτων","ευθεία","ισαπέχουν","παραλλήλων","πολικών","Ισημερινό"],"a":4},{"id":"28273-2.2","th":"28273","part":"2.2","k":"open","secs":["2.6-2.9"],"p":10,"q":"Στο μερκατορικό χάρτη, τα αυξομερή πλάτη παρουσιάζουν μικρές τιμές για μικρά πλάτη και μεγάλες για μεγάλα πλάτη, έτσι, ώστε η τιμή του αυξουμερούς πλάτους να φθάνει το άπειρο στους πόλους. Να εξηγήσετε τη διαφορά μεταξύ των υψηλότερων γεωγραφικών πλατών και όσων βρίσκονται κοντά στον Ισημερινό κατά τη μερκατορική προβολή.","sol":"Στο μερκατορικό χάρτη, οι αποστάσεις μεταξύ των παραλλήλων της ίδιας διαφοράς πλάτους δεν είναι ίσες, αλλά γίνονται συνεχώς μεγαλύτερες όσο ανερχόμαστε σε ψηλότερα πλάτη. Επιφάνειες επομένως της γης κοντά στον ισημερινό υπόκεινται σε μικρότερη παραμόρφωση, κατά τη μερκατορική προβολή από εκείνες, που βρίσκονται σε ψηλότερα πλάτη. Έτσι στις πολικές περιοχές δεν υπάρχει ομοιότητα των σχημάτων και δεν είναι δυνατή η απεικόνιση των περιοχών αυτών κατά τη μερκατορική προβολή."},{"id":"28344-2.1","th":"28344","part":"2.1","k":"fillp","secs":["M2"],"p":15,"q":"Η ⟨α⟩ είναι το σημείο του ορίζοντα από όπου πνέει ο άνεμος, η ταχύτητα του οποίου ονομάζεται ⟨β⟩. Η ⟨γ⟩ είναι μία απο τις δυνάμεις που ρυθμίζουν την κίνηση του ανέμου. Ο ⟨δ⟩ άνεμος ισούται με τον ⟨ε⟩ άνεμο μείον τον άνεμο λόγω κίνησης πλοίου (δηλαδή συν το διάνυσμα πορείας - ταχύτητας του πλοίου).","opts":["ένταση","φαινόμενο","αληθής","διεύθυνση","τριβή","βαρομετρικό"],"a":[3,0,4,2,1],"labs":["α","β","γ","δ","ε"]},{"id":"28344-2.2α","th":"28344","part":"2.2","lab":"α","k":"open","secs":["M1"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Ατμοσφαιρική πίεση.","sol":"Αν θεωρήσουμε μια στήλη ατμοσφαιρικού αέρα με εμβαδόν βάσης ίσο με 1εκ<sup>2 </sup>και με ύψος να φθάνει στα όρια της ατμόσφαιρας, τότε το βάρος αυτής της στήλης ονομάζεται ατμοσφαιρική πίεση."},{"id":"28344-2.2β","th":"28344","part":"2.2","lab":"β","k":"open","secs":["M1"],"p":5,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Οριζόντια βαροβαθμίδα.","sol":"Το μέγεθος που μετρά τη γεωγραφική μεταβολή της βαρομετρικής πίεσης ονομάζεαι οριζόντια βαροβαθμίδα και ορίζεται ως η ελάτωση της πίεσης κάθετα προς τις ισοβαρείς, ανα μονάδα απόστασης."},{"id":"19067-2.1α","th":"19067","part":"2.1","lab":"α","k":"fill","secs":["1.20"],"p":3,"q":"Η απόσταση δυο τόπων που μετριέται πάνω στη λοξοδρομική καμπύλη αποτελείτη λοξοδρομική ⟨⟩ των τόπων αυτών.","opts":["λοξοδρομία","ορθοδρομία","απόσταση","σταθερή","ψηλότερα","μεσημβρινούς"],"a":2},{"id":"19067-2.1β","th":"19067","part":"2.1","lab":"β","k":"fill","secs":["1.20"],"p":3,"q":"Η ορθοδρομία και η λοξοδρομία συμπίπτουν για πλόες επάνω στον ισημερινό και στους ⟨⟩","opts":["λοξοδρομία","ορθοδρομία","απόσταση","σταθερή","ψηλότερα","μεσημβρινούς"],"a":5},{"id":"19067-2.1γ","th":"19067","part":"2.1","lab":"γ","k":"fill","secs":["1.20"],"p":3,"q":"Πλέοντας ορθοδρομικά διερχόμαστε πάντοτε από ⟨⟩ πλάτη.","opts":["λοξοδρομία","ορθοδρομία","απόσταση","σταθερή","ψηλότερα","μεσημβρινούς"],"a":4},{"id":"19067-2.1δ","th":"19067","part":"2.1","lab":"δ","k":"fill","secs":["1.20"],"p":3,"q":"Πλέοντας λοξοδρομικά έχουμε το σημαντικό πλεονέκτημα ότι τηρούμε ⟨⟩ πλεύση.","opts":["λοξοδρομία","ορθοδρομία","απόσταση","σταθερή","ψηλότερα","μεσημβρινούς"],"a":3},{"id":"19067-2.1ε","th":"19067","part":"2.1","lab":"ε","k":"fill","secs":["1.20"],"p":3,"q":"Η ⟨⟩ είναι καμπύλη στην επιφάνεια της γης, με χαρακτηριστικό της να τέμνει τους μεσημβρινούς με σταθερή γωνία.","opts":["λοξοδρομία","ορθοδρομία","απόσταση","σταθερή","ψηλότερα","μεσημβρινούς"],"a":0},{"id":"19067-2.2","th":"19067","part":"2.2","k":"match","secs":["1.20"],"p":10,"q":"Με βάση τοπαρακάτω σχήμα, μεταξύ των τόπων Α και Β, να αναφέρετε χωρίς τεκμηρίωση την κατηγορία πλου που αντιστοιχεί στην ευθεία γραμμή και στην καμπύλη.","rows":[{"t":"ευθεία γραμμή","s":"1.20","a":[0]},{"t":"καμπύλη","s":"1.20","a":[1]}],"opts":["ορθοδρομία","λοξοδρομία"],"img":"19067_fig"},{"id":"24154-2.1α","th":"24154","part":"2.1","lab":"α","k":"fill","secs":["2.10-2.11"],"p":3,"q":"Το σχήμα του χάρτη είναι ορθογώνιο παραλληλόγραμμο. Η κάθετη διάσταση του ύψους είναι προσανατολισμένη στην κατεύθυνση ⟨⟩.","opts":["ορθογώνιων","στίγμα ακρίβειας","τομέα","τόπο","Βορρά-Νότου","σταθεροί"],"a":4},{"id":"24154-2.1β","th":"24154","part":"2.1","lab":"β","k":"fill","secs":["3.3"],"p":3,"q":"Οι ⟨⟩ φάροι εκπέμπουν συνεχές και σταθερό φως, δηλαδή χωρίς διακοπές ή εναλλαγές των χαρακτηριστικών τους.","opts":["ορθογώνιων","στίγμα ακρίβειας","τομέα","τόπο","Βορρά-Νότου","σταθεροί"],"a":5},{"id":"24154-2.1γ","th":"24154","part":"2.1","lab":"γ","k":"fill","secs":["4.1-4.3"],"p":3,"q":"Η παράλληλη μεταφορά ευθείας γίνεται με τον διπαράλληλο κανόνα. Ακόμα μπορεί να γίνει με τη χρησιμοποίηση δυο ⟨⟩ τριγώνων.","opts":["ορθογώνιων","στίγμα ακρίβειας","τομέα","τόπο","Β ξαιτίας της μεταβολής της πίεσης με το ύψος είναι ανάγκη οι παρατηρήσεις των μετεωρολογικών σταθμών να διορθώνονται κατάλληλα, ώστε η μέτρησή τους να αντιστοιχεί σε μηδενικό ύψος. Αυτό λέγεται<span class=\"gap\"></span>:","opts":["αναγωγή στο βάρος του αέρα.","αναγωγή στην επιφάνεια της θάλασσας.","αναγωγή στην επιφάνεια της γης.","αναγωγή στη μεταβολή του αέρα."],"a":1},{"id":"19269-2.1","th":"19269","part":"2.1","k":"mc","secs":["1.8-1.9"],"p":5,"q":"Να επιλέξετε το σχήμα, το οποίο αποτυπώνει σωστά την περίπτωση που η Απόκλιση είναι δυτική, η Παρεκτροπή είναι ανατολική και η Παραλλαγή είναι ανατολική.","opts":["Σχήμα 1","Σχήμα 2","Σχήμα 3"],"a":1,"img":"19269_fig"},{"id":"19269-2.2α","th":"19269","part":"2.2","lab":"α","k":"open","secs":["1.7"],"p":7,"ctx":"Να απαντήσετε με συντομία στα εξής:","q":"Τί είναι η μαγνητική απόκλιση (Απ), πώς χαρακτηρίζεται και πώς μεταβάλλεται;","sol":"Μαγνητική Απόκλιση (Απ) είναι η γωνία που σχηματίζεται από την κατεύθυνση του αληθή βορρά (Βλ) έως την κατεύθυνση του μαγνητικού βορρά (Βμ). Χαρακτηρίζεται ως ανατολική +/Α/Ε ή δυτική –/Δ/W. Μεταβάλλεται 1. από τόπο σε τόπο, 2. με το χρόνο, 3. λόγω μαγνητικών διαταραχών."},{"id":"19269-2.2β","th":"19269","part":"2.2","lab":"β","k":"open","secs":["1.8-1.9"],"p":7,"ctx":"Να απαντήσετε με συντομία στα εξής:","q":"Τί είναι η παρεκτροπή (Τρ), πώς χαρακτηρίζεται και πώς μεταβάλλεται;","sol":"Παρεκτροπή (Τρ) είναι η γωνία που σχηματίζεται από την κατεύθυνση του μαγνητικού βορρά (Βμ) έως την κατεύθυνση του βορρά μαγνητικής πυξίδας (Β<sub>ΠΜ</sub>). Χαρακτηρίζεται ως ανατολική +/Α/Ε ή δυτική –/Δ/W. Μεταβάλλεται 1. από πυξίδα σε πυξίδα, 2. με την πορεία του πλοίου."},{"id":"19269-2.2γ","th":"19269","part":"2.2","lab":"γ","k":"open","secs":["1.8-1.9"],"p":6,"ctx":"Να απαντήσετε με συντομία στα εξής:","q":"Τί είναι η παραλλαγή (Πρ) και πώς χαρακτηρίζεται;","sol":"Παραλλαγή (Πρ) είναι η γωνία που σχηματίζεται από την κατεύθυνση του αληθή βορρά (Βλ) έως την κατεύθυνση του βορρά πυξίδας (Β<sub>Π</sub>). Χαρακτηρίζεται ως ανατολική +/Α/Ε ή δυτική –/Δ/W."},{"id":"18026-2.1α","th":"18026","part":"2.1","lab":"α","k":"tf","secs":["1.5-1.6"],"p":3,"q":"Η κατεύθυνση που δείχνει η μαγνητική πυξίδα όταν αυτή επηρεάζεται μόνο από το γήινο μαγνητικό πεδίο, ονομάζεται μαγνητικός Βορράς Βμ (Magnetic North).","a":true},{"id":"18026-2.1β","th":"18026","part":"2.1","lab":"β","k":"tf","secs":["1.8-1.9"],"p":3,"q":"Το πινακίδιο παρεκτροπών μάς ενημερώνει για τις τιμές της παρεκτροπής Τρ που παρουσιάζει μια μαγνητική πυξίδα, ανεξάρτητα από την πορεία που ακολουθεί το πλοίο μας.","a":false,"why":"Η παρεκτροπή Τρ μεταβάλλεται με την πορεία του πλοίου· το πινακίδιο παρεκτροπών δίνει την Τρ για κάθε πορεία."},{"id":"18026-2.1γ","th":"18026","part":"2.1","lab":"γ","k":"tf","secs":["1.7"],"p":3,"q":"Η γωνία που σχηματίζει ο αληθής Βορράς με το μαγνητικό Βορρά ονομάζεται παρεκτροπή Τρ (Deviation, Dev).","a":false,"why":"Η γωνία από τον αληθή βορρά Βλ έως τον μαγνητικό βορρά Βμ είναι η απόκλιση Απ. Παρεκτροπή Τρ είναι η γωνία από τον Βμ έως τον βορρά πυξίδας."},{"id":"18026-2.1δ","th":"18026","part":"2.1","lab":"δ","k":"tf","secs":["M1"],"p":3,"q":"Η ατμοσφαιρική πίεση παραμένει σταθερή σε όλους τους τόπους στη Γη.","a":false,"why":"Η ατμοσφαιρική πίεση διαφέρει από τόπο σε τόπο και η πίεση ενός τόπου παρουσιάζει τυχαίες και περιοδικές μεταβολές."},{"id":"18026-2.1ε","th":"18026","part":"2.1","lab":"ε","k":"tf","secs":["M1"],"p":3,"q":"Η οριζόντια βαροβαθμίδα έχει κατεύθυνση από τις υψηλότερες προς τις χαμηλότερες πιέσεις.","a":true},{"id":"18026-2.2","th":"18026","part":"2.2","k":"open","secs":["M2"],"p":10,"q":"Να αναφέρετε, επιγραμματικά, τις πέντε (5) δυνάμεις που ρυθμίζουν την κίνηση των ανέμων.","sol":"Οι δυνάμεις που ρυθμίζουν την κίνηση του ανέμου είναι:<br>Η δύναμη βαροβαθμίδας, η δύναμη Coriolis, η τριβή, η φυγόκεντρος, η βαρύτητα της Γης."},{"id":"18972-2.1α","th":"18972","part":"2.1","lab":"α","k":"tf","secs":["M5"],"p":3,"q":"Ένα από τα στάδια ανάλυσης και πρόγνωσης του καιρού είναι η ανάλυση των χαρτών καιρού.","a":true},{"id":"18972-2.1β","th":"18972","part":"2.1","lab":"β","k":"tf","secs":["M5"],"p":3,"q":"Ως σταθμούς θεωρούμε τόσο τους μετεωρολογικούς σταθμούς της ξηράς, όσο και τα πλοία που αναφέρουν παρατηρήσεις καιρού.","a":true},{"id":"18972-2.1γ","th":"18972","part":"2.1","lab":"γ","k":"tf","secs":["M5"],"p":3,"q":"Σύμφωνα με τους κανονισμούς του Παγκόσμιου Συστήματος προειδοποιήσεως και ασφάλειας κάθε πλοίο, εν πλω, δεν πρέπει να παρακολουθεί τις εκπομπές αγγελιών που έχουν σχέση με την ασφάλεια πλου.","a":false,"why":"Κάθε πλοίο εν πλω πρέπει να παρακολουθεί τις εκπομπές αγγελιών που έχουν σχέση με την ασφάλεια πλου."},{"id":"18972-2.1δ","th":"18972","part":"2.1","lab":"δ","k":"tf","secs":["M5"],"p":3,"q":"Το τηλομοιότυπο ( facsimile) είναι ένα ασύρματο μέσο που μεταδίδει έτοιμους χάρτες καιρού.","a":true},{"id":"18972-2.1ε","th":"18972","part":"2.1","lab":"ε","k":"tf","secs":["M5"],"p":3,"q":"Με το RADAR εντοπίζονται, συνήθως, η ομίχλη ή η ελαφριά βροχή.","a":false,"why":"Με το RADAR εντοπίζονται συνήθως οι ραγδαίες βροχές, οι καταιγίδες, τα μέτωπα και οι τροπικοί κυκλώνες, αλλά όχι η ομίχλη ή η ελαφριά βροχή."},{"id":"18972-2.2","th":"18972","part":"2.2","k":"open","secs":["M5"],"p":10,"q":"Να αναφέρετε ονομαστικά τα στάδια ανάλυσης και πρόγνωσης του καιρού.","sol":"η συγκέντρωση των μετεωρολογικών παρατηρήσεων, η σύνταξη των χαρτών καιρού επιφάνειας, η ανάλυση των χαρτών καιρού, η πρόγνωση"},{"id":"19266-2.1α","th":"19266","part":"2.1","lab":"α","k":"tf","secs":["6.3-6.4"],"p":3,"q":"Η γραμμή θέσεως αποτελεί το γεωμετρικό τόπο του στίγματος του πλοίου.","a":true},{"id":"19266-2.1β","th":"19266","part":"2.1","lab":"β","k":"tf","secs":["6.5-6.7"],"p":3,"q":"Οι ευθυγραμμίσεις με φανούς αναγράφονται στους φαροδείκτες και τους χάρτες.","a":true},{"id":"19266-2.1γ","th":"19266","part":"2.1","lab":"γ","k":"tf","secs":["6.5-6.7"],"p":3,"q":"Κατά τη νύκτα, η απότομη εμφάνιση ή απόκρυψη του εστιακού φωτός ενός φάρου, δεν μπορεί να χρησιμοποιηθεί για τον προσδιορισμό της αποστάσεως του πλοίου από το φάρο εκείνο.","a":false,"why":"Τη νύχτα, η απότομη εμφάνιση ή απόκρυψη του εστιακού φωτός ενός ισχυρού φάρου δίνει την απόσταση του πλοίου από αυτόν."},{"id":"19266-2.1δ","th":"19266","part":"2.1","lab":"δ","k":"tf","secs":["6.10-6.11"],"p":3,"q":"Η σύγχρονη λήψη των διοπτεύσεων δεν αποτελεί βασική προϋπόθεση για την ακρίβεια του στίγματος δυο ή περισσοτέρων αντικειμένων.","a":false,"why":"Η σύγχρονη λήψη των διοπτεύσεων αποτελεί βασική προϋπόθεση για την ακρίβεια του στίγματος."},{"id":"19266-2.1ε","th":"19266","part":"2.1","lab":"ε","k":"tf","secs":["6.12-6.14"],"p":3,"q":"Με τη γενική χρήση σήμερα του radar, το στίγμα με διόπτευση ενός αντικειμένου και απόσταση ενός άλλου αντικειμένου αποτελεί και αυτό στίγμα που ευρύτατα εφαρμόζεται στη ναυσιπλοΐα.","a":true},{"id":"19266-2.2","th":"19266","part":"2.2","k":"open","secs":["6.5-6.7"],"p":10,"q":"Προσεγγίζουσα γραμμή θέσεως μπορούμε να έχουμε με τη μέτρηση του βάθους της θάλασσας που αντιστοιχεί σε ορισμένη ισοβαθή καμπύλη σημειωμένη στο χάρτη. Εφόσον τα βάθη μετρούνται με βυθόμετρο, να αναφέρετε τον τρόπο για να αναγάγουμε τα βυθίσματα αυτά σε βάθη χάρτη.","sol":"Πρέπει στο βάθος του βυθομέτρου να προσθέσουμε το βύθισμα του πλοίου και από το άθροισμα αυτό να αφαιρέσουμε το ύψος της παλίρροιας της περιοχής, αν αυτό είναι αισθητό. Αυτό που προκύπτει είναι το συγκρίσιμο στοιχείο με το βάθος του χάρτη."},{"id":"23702-2.1α","th":"23702","part":"2.1","lab":"α","k":"tf","secs":["M2"],"p":3,"q":"Η διεύθυνση και η ένταση αποτελούν τα χαρακτηριστικά του ανέμου.","a":true},{"id":"23702-2.1β","th":"23702","part":"2.1","lab":"β","k":"tf","secs":["M4"],"p":3,"q":"Το θερμό, το ψυχρό, το στάσιμο και το συνεσφιγμένο δεν είναι είδη μετώπων.","a":false,"why":"Το θερμό, το ψυχρό, το στάσιμο και το συνεσφιγμένο είναι τα τέσσερα είδη μετώπων."},{"id":"23702-2.1γ","th":"23702","part":"2.1","lab":"γ","k":"tf","secs":["M6"],"p":3,"q":"Ως προς τις χρονικές μεταβολές, τα θαλάσσια ρεύματα διακρίνονται σε ρεύματα ακτής και ωκεάνια ρεύματα.","a":false,"why":"Ως προς τις χρονικές μεταβολές τα ρεύματα είναι μόνιμα, περιοδικά και εποχικά. Τα ρεύματα ακτής και τα ωκεάνια διακρίνονται ως προς τις ακτές."},{"id":"23702-2.1δ","th":"23702","part":"2.1","lab":"δ","k":"tf","secs":["M7"],"p":3,"q":"Το μήκος το ύψος, η περίοδος και η ταχύτητα αποτελούν στοιχεία του θαλάσσιου κύματος.","a":true},{"id":"23702-2.1ε","th":"23702","part":"2.1","lab":"ε","k":"tf","secs":["M8"],"p":3,"q":"Όταν εντοπίζεται παγόβουνο, συνιστάται ο ελιγμός αποφυγής να γίνεται, αν είναι δυνατόν, από την προσήνεμη πλευρά για αποφυγή τυχόν θραυσμάτων.","a":true},{"id":"23702-2.2","th":"23702","part":"2.2","k":"open","secs":["M5"],"p":10,"q":"Να αναφέρετε επιγραμματικά, τα στάδια ανάλυσης και πρόγνωσης του καιρού.","sol":"− Η συγκέντρωση των μετεωρολογικών παρατηρήσεων.<br>− Η σύνταξη των χαρτών καιρού επιφανείας.<br>− Η ανάλυση των χαρτών καιρού.<br>− Η πρόγνωση."},{"id":"23703-2.1α","th":"23703","part":"2.1","lab":"α","k":"tf","secs":["1.20"],"p":3,"q":"Πλέοντας λοξοδρομικά διανύουμε την ελάχιστη απόσταση.","a":false,"why":"Την ελάχιστη απόσταση τη διανύουμε πλέοντας ορθοδρομικά."},{"id":"23703-2.1β","th":"23703","part":"2.1","lab":"β","k":"tf","secs":["1.20"],"p":3,"q":"Η λοξοδρομία είναι καμπύλη στην επιφάνεια της γης, με χαρακτηριστικό της να τέμνει τους μεσημβρινούς με σταθερή γωνία.","a":true},{"id":"23703-2.1γ","th":"23703","part":"2.1","lab":"γ","k":"tf","secs":["1.20"],"p":3,"q":"Πλέοντας ορθοδρομικά διερχόμαστε πάντοτε από χαμηλότερα πλάτη.","a":false,"why":"Πλέοντας ορθοδρομικά διερχόμαστε πάντοτε από ψηλότερα πλάτη."},{"id":"23703-2.1δ","th":"23703","part":"2.1","lab":"δ","k":"tf","secs":["1.20"],"p":3,"q":"Πλέοντας λοξοδρομικά έχουμε το σημαντικό πλεονέκτημα ότι τηρούμε σταθερή πλεύση.","a":true},{"id":"23703-2.1ε","th":"23703","part":"2.1","lab":"ε","k":"tf","secs":["1.20"],"p":3,"q":"Η ορθοδρομία και η λοξοδρομία δεν συμπίπτουν για πλόες επάνω στον ισημερινό και στους μεσημβρινούς.","a":false,"why":"Η ορθοδρομία και η λοξοδρομία συμπίπτουν για πλόες επάνω στον ισημερινό και στους μεσημβρινούς."},{"id":"23703-2.2α","th":"23703","part":"2.2","lab":"α","k":"open","secs":["1.20"],"p":5,"ctx":"Απαντήστε με συντομία στα παρακάτω ερωτήματα.","q":"Τι ονομάζεται ορθοδρομική απόσταση.","sol":"Το μέτρο του ορθοδρομικού τόξου σε πρώτα της μοίρας δίνει την ορθοδρομική απόσταση σε ναυτικά μίλια."},{"id":"23703-2.2β","th":"23703","part":"2.2","lab":"β","k":"open","secs":["1.20"],"p":5,"ctx":"Απαντήστε με συντομία στα παρακάτω ερωτήματα.","q":"Τι ονομάζεται λοξοδρομική απόσταση δύο τόπων.","sol":"Η απόσταση δυο τόπων που μετριέται πάνω στη λοξοδρομική καμπύλη αποτελεί τη λοξοδρομική απόσταση των τόπων αυτών."},{"id":"23971-2.1α","th":"23971","part":"2.1","lab":"α","k":"tf","secs":["1.5-1.6"],"p":3,"q":"Στη ναυσιπλοΐα, η κατεύθυνση εκφράζεται σε μοίρες με αρχή μετρήσεως την κατεύθυνση του βορρά ή της πλώρης του πλοίου.","a":true},{"id":"23971-2.1β","th":"23971","part":"2.1","lab":"β","k":"tf","secs":["1.5-1.6"],"p":3,"q":"Η κατεύθυνση της πλώρης του πλοίου αντιπροσωπεύεται από το διάμηκες αυτού, το οποίο είναι η νοητή ευθεία πρύμης πλώρης, ή και η κάθε παράλληλη γραμμή προς αυτή.","a":true},{"id":"23971-2.1γ","th":"23971","part":"2.1","lab":"γ","k":"tf","secs":["1.5-1.6"],"p":3,"q":"Αληθής Βορράς (Βλ) είναι η κατεύθυνση τη οποία δίνει ο παράλληλος κάθε τόπου.","a":false,"why":"Τον αληθή βορρά Βλ τον δίνει ο μεσημβρινός κάθε τόπου, όχι ο παράλληλος."},{"id":"23971-2.1δ","th":"23971","part":"2.1","lab":"δ","k":"tf","secs":["1.5-1.6"],"p":3,"q":"Μαγνητικός Βορράς (Βμ) είναι η κατεύθυνση που δείχνει η μαγνητική βελόνη όταν αυτή επηρεάζεται μόνο από το γήινο μαγνητικό πεδίο.","a":true},{"id":"23971-2.1ε","th":"23971","part":"2.1","lab":"ε","k":"tf","secs":["1.5-1.6"],"p":3,"q":"Βορράς πυξίδας (Βπ) είναι η κατεύθυνση που δείχνει η μαγνητική βελόνη όταν αυτή βρίσκεται στη ξηρά.","a":false,"why":"Στην ξηρά η μαγνητική βελόνη δείχνει τον μαγνητικό βορρά Βμ. Βορράς πυξίδας Βπ είναι η κατεύθυνση της βελόνης πάνω στο σιδερένιο πλοίο, που την επηρεάζει και ο μαγνητισμός του πλοίου."},{"id":"23971-2.2α","th":"23971","part":"2.2","lab":"α","k":"open","secs":["1.1-1.2"],"p":2,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Ισημερινός","sol":"Ισημερινός ονομάζεται ο μέγιστος κύκλος που το επίπεδό του είναι κάθετο προς τον άξονα της γης."},{"id":"23971-2.2β","th":"23971","part":"2.2","lab":"β","k":"open","secs":["1.1-1.2"],"p":2,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Μέγιστος κύκλος","sol":"Μέγιστος κύκλος είναι ο κύκλος που το επίπεδό του περνάει υποχρεωτικά από το κέντρο της Γης."},{"id":"23971-2.2γ","th":"23971","part":"2.2","lab":"γ","k":"open","secs":["1.1-1.2"],"p":2,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Πρώτος μεσημβρινός","sol":"Πρώτος μεσημβρινός ονομάζεται ο μεσημβρινός που διέρχεται από το αστεροσκοπείο του Greenwitch της Βρετανίας"},{"id":"23971-2.2δ","th":"23971","part":"2.2","lab":"δ","k":"open","secs":["1.1-1.2"],"p":2,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Άξονας της Γης","sol":"Άξονας της Γης ονομάζεται ο αξονας που πέριξ αυτού περιστρέφεται η γήινη σφαίρα."},{"id":"23971-2.2ε","th":"23971","part":"2.2","lab":"ε","k":"open","secs":["1.1-1.2"],"p":2,"ctx":"Να καταγράψετε τους ορισμούς:","q":"Μικρός κύκλος","sol":"Μικρός κύκλος ονομάζεται ο κύκλος που το επίπεδό του δεν περνάει από το κέντρο της Γης."},{"id":"23989-2.1α","th":"23989","part":"2.1","lab":"α","k":"tf","secs":["M7"],"p":3,"q":"Στο θαλασσόμετρο αναγράφεται το μέγεθος και το ύψος των θαλασσίων κυμάτων.","a":false,"why":"Η κατάσταση της θάλασσας (ύψος κύματος) περιγράφεται αριθμητικά με την κλίμακα Douglas."},{"id":"23989-2.1β","th":"23989","part":"2.1","lab":"β","k":"tf","secs":["6.5-6.7"],"p":3,"q":"Όταν δυο καταφανή αντικείμενα σκοπεύονται απο τη γέφυρα με την ίδια διόπτευση, λέμε οτι βρίσκονται σε ευθυγράμμιση.","a":true},{"id":"23989-2.1γ","th":"23989","part":"2.1","lab":"γ","k":"tf","secs":["M3"],"p":3,"q":"Οι καταιγίδες είναι βίαια ατμοσφαιρικά φαινόμενα που συνοδεύονται και απο ηλεκτρικές εκκενώσεις.","a":true},{"id":"23989-2.1δ","th":"23989","part":"2.1","lab":"δ","k":"tf","secs":["1.17-1.19"],"p":3,"q":"Ένα ναυτικό μίλι είναι ίσο με 1852 χιλιόμετρα.","a":false,"why":"Ένα ναυτικό μίλι είναι ίσο με 1852 μέτρα, όχι χιλιόμετρα."},{"id":"23989-2.1ε","th":"23989","part":"2.1","lab":"ε","k":"tf","secs":["M2"],"p":3,"q":"Το ανεμόμετρο και ο ανεμοδείκτης του πλοίου μετρούν τον αληθή άνεμο.","a":false,"why":"Το ανεμόμετρο και ο ανεμοδείκτης του πλοίου μετρούν τον φαινόμενο άνεμο."},{"id":"23989-2.2","th":"23989","part":"2.2","k":"open","secs":["3.3"],"p":10,"q":"Σε πόσες βασικές κατηγορίες κατατάσσονται οι φάροι; Να τις αναφέρετε ονομαστικά.","sol":"Οι φάροι κατατάσσονται σε τρεις βασικές κατηγορίες: Τους σταθερούς, τους ρυθμικούς και τους εναλλασσόμενους."},{"id":"23995-2.1α","th":"23995","part":"2.1","lab":"α","k":"tf","secs":["1.17-1.19"],"p":3,"q":"Ως απόσταση ή δίαρμα d στη ναυσιπλοϊα χαρακτηρίζουμε το μήκος της νοητής γραμμής που συνδέει δύο σημεία πάνω στην επιφάνειατης γής.","a":true},{"id":"23995-2.1β","th":"23995","part":"2.1","lab":"β","k":"tf","secs":["3.8"],"p":3,"q":"Οι σημαντήρες ναυαγίων (wreck buoys) τοποθετούνται πολύ κοντά για να επισημαίνουν τις θέσεις του ναυαγίου.","a":true},{"id":"23995-2.1γ","th":"23995","part":"2.1","lab":"γ","k":"tf","secs":["M5"],"p":3,"q":"Το Τηλομοιότυπο (facsimile) είναι ένα ασύρματο μέσο που μεταδίδει έτοιμους χάρτες καιρού.","a":true},{"id":"23995-2.1δ","th":"23995","part":"2.1","lab":"δ","k":"tf","secs":["2.6-2.9"],"p":3,"q":"Στο μερκατορικό-ναυτικό χάρτη η ορθοδρομία συνιστά ευθεία γραμμή.","a":false,"why":"Στον μερκατορικό χάρτη ευθεία γραμμή είναι η λοξοδρομία· η ορθοδρομία φαίνεται σαν καμπύλη με τα κυρτά της προς τον πόλο."},{"id":"23995-2.1ε","th":"23995","part":"2.1","lab":"ε","k":"tf","secs":["3.10"],"p":3,"q":"Οι ραδιοσημαντήρες είναι τριών ειδών: Οι ramark, οι demark και οι jamark.","a":false,"why":"Οι ραδιοσημαντήρες είναι δύο ειδών: τα racon και τα ramark."},{"id":"23995-2.2","th":"23995","part":"2.2","k":"open","secs":["3.10"],"p":10,"q":"Τι είναι οι ραδιοφάροι;","sol":"Οι ραδιοφάροι (radio beacons) είναι απλοί πομποί που εκπέμπουν ραδιοσήματα σ’ορισμένη συχνότητα με ειδικό χαρακτηριστικό, που αποτελείται απο γράμμα ή ομάδα γραμμάτων του μορσικού αλφαβήτου"},{"id":"24063-2.1α","th":"24063","part":"2.1","lab":"α","k":"tf","secs":["6.10-6.11"],"p":3,"q":"Κατά την λήψη διοπτεύσεων προτιμούνται αντικείμενα που βρίσκονται πλησιέστερα στο πλοίο.","a":true},{"id":"24063-2.1β","th":"24063","part":"2.1","lab":"β","k":"tf","secs":["6.3-6.4"],"p":3,"q":"Ορθοδρομική και λοξοδρομική διόπτευση του ίδιου αντικειμένου διαφέρουν κατά την γωνία συνεύσεως.","a":false,"why":"Η ορθοδρομική και η λοξοδρομική διόπτευση διαφέρουν κατά το μισό της γωνίας συνεύσεως."},{"id":"24063-2.1γ","th":"24063","part":"2.1","lab":"γ","k":"tf","secs":["6.3-6.4"],"p":3,"q":"Η ένδειξη της εκπτώσεως του πλοίου, είναι μία από τις χρησιμότητες των διαπιστεύσεων.","a":true},{"id":"24063-2.1δ","th":"24063","part":"2.1","lab":"δ","k":"tf","secs":["6.12-6.14"],"p":3,"q":"Το στίγμα σύγχρονων αποστάσεων είναι η τομή που βρίσκεται πλησιέστερα προς το στίγμα αναμετρήσεως.","a":true},{"id":"24063-2.1ε","th":"24063","part":"2.1","lab":"ε","k":"tf","secs":["6.10-6.11"],"p":3,"q":"Το στίγμα του πλοίου με δύο σύγχρονες ευθυγραμμίσεις δεν πρόκειται για ιδανική περίπτωση ακρίβειας.","a":false,"why":"Η ευθυγράμμιση είναι η πιο ακριβής γραμμή θέσεως· το στίγμα με δύο σύγχρονες ευθυγραμμίσεις είναι ιδανική περίπτωση ακριβείας."},{"id":"24063-2.2","th":"24063","part":"2.2","k":"open","secs":["6.5-6.7"],"p":10,"q":"Να αναφέρετε συνοπτικά που μπορούν να χρησιμοποιηθούν οι ευθυγραμμίσεις.","sol":"α) Αν συνδυαστούν με οποιαδήποτε άλλη γραμμή θέσεως για το στίγμα του πλοίου.<br>β) Για ευθυγράμμιση ασφάλειας.<br>γ) Για ιθυντήρια πορεία.<br>δ) Για τον προσδιορισμό της παραλλαγής της πυξίδας.<br>ε) Για την ρύθμιση πυξίδων.<br>στ) Για την εκτέλεση δοκιμών ταχύτητας."},{"id":"24709-2.1α","th":"24709","part":"2.1","lab":"α","k":"tf","secs":["M1"],"p":3,"q":"Η πίεση ενός τόπου παρουσιάζει τυχαίες και περιοδικές μεταβολές.","a":true},{"id":"24709-2.1β","th":"24709","part":"2.1","lab":"β","k":"tf","secs":["M2"],"p":3,"q":"Οι τοπικοί άνεμοι επικρατούν σε ορισμένες μόνον περιοχές του κόσμου, εξαιτίας ειδικών τοπογραφικών χαρακτηριστικών, που μπορούν να κατευθύνουν τη ροή του ανέμου, σε συνδυασμό με ειδικές καιρικές καταστάσεις.","a":true},{"id":"24709-2.1γ","th":"24709","part":"2.1","lab":"γ","k":"tf","secs":["M3"],"p":3,"q":"Το ποσό των υδρατμών στην ατμόσφαιρα δεν μετριέται από την υγρασία.","a":false,"why":"Το ποσό των υδρατμών στην ατμόσφαιρα μετριέται από την υγρασία."},{"id":"24709-2.1δ","th":"24709","part":"2.1","lab":"δ","k":"tf","secs":["M6"],"p":3,"q":"Η πορεία που ακολουθεί ένα ρεύμα ονομάζεται διεύθυνση (set) και μετριέται σε μοίρες.","a":true},{"id":"24709-2.1ε","th":"24709","part":"2.1","lab":"ε","k":"tf","secs":["M6"],"p":3,"q":"Η ταχύτητα του ρεύματος ονομάζεται ένταση ρεύματος (drift) και μετριέται σε μοίρες.","a":false,"why":"Η ένταση ρεύματος (drift) μετριέται σε κόμβους, όχι σε μοίρες."},{"id":"24709-2.2","th":"24709","part":"2.2","k":"open","secs":["M1"],"p":10,"q":"Να αναφέρετε ονομαστικά τα όργανα μέτρησης της ατμοσφαιρικής πίεσης.","sol":"Υδραργυρικό βαρόμετρο, Μεταλλικό βαρόμετρο, Βαρογράφος."},{"id":"17978-Θ","th":"17978","part":"","k":"calc","secs":["1.10"],"p":25,"q":"<p>Στο πλησιέστερο ανεμολόγιο της περιοχής πλου στο ν. χάρτη αναγράφεται Απ= 2° 30΄ Α (2010) αυξανόμενη περίπου 3’ ετησίως.</p>\n<p>Δίδεται η παραλλαγή της μαγνητικής πυξίδας του πλοίου (Πρ<sub>Μ</sub>) 2° 06΄Δ.</p>\n<p><b>α)</b> Να βρεθεί η σύγχρονη απόκλιση (Απ) με έτος υπολογισμού το 2015.</p>\n<p><b>β)</b> Να υπολογιστεί η παρεκτροπή (Τρ) της μαγνητικής πυξίδας.</p>","sol":"<p><b>α)</b> Ισχύει:</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ </sub>± ολική μεταβολή (+ αυξ., - ελατ.), όπου: ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p>Συνεπώς:</p>\n<p>ολική μεταβολή = έτη × ετήσια μεταβολή = (2015 - 2010) × 3΄ = 5 × 3΄ = 15΄</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ </sub>+ ολική μεταβολή (+ αυξ.)</p>\n<p>Απ<sub>σ</sub> = 2° 30΄ + 15΄ = 2° 45΄Α/Ε</p>\n<p><b>β)</b> Ισχύει:</p>\n<p>Τρ = Πρ<sub>Μ</sub> - Απ<sub>σ </sub>(αλγεβρικά)</p>\n<p>Συνεπώς:</p>\n<p>Τρ = (-2° 06΄) - (+2° 45΄) = - 2° 06΄ - 2° 45΄ = 4° 51΄Δ/W</p>"},{"id":"17993-4.1","th":"17993","part":"4.1","k":"calc","secs":["1.17-1.19"],"p":5,"q":"<p>Το πλοίο έχει ταχύτητα 10 κόμβους και η απόσταση που θα διανύσει είναι 240 ναυτικά μίλια (ν.μ.). Να υπολογιστούν οι μέρες του ταξιδιού.</p>","sol":"<p>Ισχύει:</p>\n<img class=\"eq\" src=\"img/17993_SOLUTION_l138.png\" alt=\"\">\n<img class=\"eq\" src=\"img/17993_SOLUTION_l167.png\" alt=\"\">\n<p>Άρα το πλοίο θα φτάσει στον προορισμό του σε 24 ώρες ή 1 ημέρα.</p>"},{"id":"17993-4.2","th":"17993","part":"4.2","k":"calc","secs":["1.10","1.13-1.14","1.15"],"p":20,"q":"<p>Πλοίο πλέει με πορεία μαγνητικής πυξίδας (ζ<sub>ΠΜ</sub>) Ν45°Α. Στο πλησιέστερο ανεμολόγιο της περιοχής του πλου στο ναυτικό χάρτη αναγράφεται Απ 1° 56΄Δ (2016) ελαττούμενη περίπου 10΄ ετησίως. Από το ειδικό πινακίδιο παρεκτροπών δίδεται η τιμή της παρεκτροπής (Τρ) 2,5°Α.</p>\n<p class=in><b>α) </b>Να υπολογιστεί η σύγχρονη απόκλιση (Απ<sub>2022</sub>). <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>β) </b>Να υπολογιστεί η παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>). <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>γ) </b>Να υπολογιστεί η αληθής πορεία (ζλ). <span class=pt>(Μονάδες 10)</span></p>","sol":"<p>α) Ισχύει:</p>\n<p>[1]Απ<sub>(2022)</sub> = Απ<sub>χάρτη</sub>± ολική μεταβολή (+ αυξ., - ελατ.) και</p>\n<p>[2]ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p>Συνεπώς:</p>\n<p>2022-2016=6 έτη άρα η σχέση [2] θα γίνει: ολική μεταβολή = 6 έτη × 10΄=60΄=1°</p>\n<p>Σύμφωνα με τη σχέση [2] η σχέση [1] θα έχει ως εξής:</p>\n<p>Απ<sub>(2022)</sub> = 1° 56΄Δ - 1° (- ελατ.)</p>\n<p>Απ<sub>(2022)</sub> = 0°56΄Δ</p>\n<p>β) Ισχύει:</p>\n<p>Πρ<sub>Μ </sub>= Απ<sub>(2022) </sub>+ Τρ (Αλγεβρικά)</p>\n<p>Πρ<sub>Μ</sub>= (-0° 56΄) + (+2°30΄) = +1°34΄= 1°34΄Α</p>\n<p>γ) Αντιλαμβανόμαστε ότι η ζπ<sub>Μ</sub> είναι τεταρτοκυκλική τιμή και πρέπει να μετατραπεί σε ολοκυκλική τιμή, συνεπώς:</p>\n<p>ζπ<sub>Μ</sub> = 180° - 45° = 135°</p>\n<p>Ισχύει:</p>\n<p>ζλ = ζπ ± Πρ (+Α, -Δ)</p>\n<p>Επομένως:</p>\n<p>ζλ = 135° + 1° 34΄ = 136° 34΄≈136°,5</p>"},{"id":"18010-Θ","th":"18010","part":"","k":"calc","secs":["1.10"],"p":25,"q":"<p><b>Θέμα 4ο </b></p>\n<p>Την 10/12/2021 στο πλησιέστερο ανεμολόγιο του χάρτη της περιοχής που πλέουμε, αναγράφεται: Απόκλιση<sub>2014</sub> (Απ/Var.) 01° 35΄ Δ/W αυξανόμενη 9΄ ετησίως. Το πλοίο μας τηρεί πορεία μαγνητικής πυξίδας 140° (ζ<sub>ΠΜ</sub>) και η παρεκτροπή είναι Τρ= 01° 40΄Δ/W. Ζητείται να υπολογιστεί:</p>\n<p><b> α) </b>Η σύγχρονη Απόκλιση (Απ<sub>σ</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p><b>β)</b> Η Παραλλαγή (Πρ) της μαγνητικής πυξίδας του πλοίου. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α)</b> Ισχύει: ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p class=in>Απ<sub>σ</sub> = Απ<sub>χ </sub>± ολική μεταβολή (+ αυξανόμενη, - ελαττούμενη)</p>\n<p>2021 – 2014 = 7 έτη</p>\n<p>Ολική μεταβολή = 7 έτη Χ 9΄= 63΄ = 01° 03΄Αυξανόμενη.</p>\n<p>Απ<sub>2021 </sub> = Απ<sub>2014 </sub>± ολική μεταβολή (+ αυξ., - ελατ.)</p>\n<p>Απ<sub>2021 </sub>= 01° 35΄ Δ/W + 01° 03΄</p>\n<p>Απ<sub>2021 </sub>= 02° 38΄Δ/W</p>\n<p><b>β) </b>Ισχύει: Πρ = Απ + Τρ (αλγεβρικά)</p>\n<p>Πρ = 02° 38΄Δ/W + 01° 40΄ Δ/W (αλγεβρικά)</p>\n<p>Πρ = ( - 02° 38)΄+ (- 01° 40΄)</p>\n<p>Πρ = - 02° 38΄- 01° 40΄</p>\n<p>Πρ = - 03° 78΄</p>\n<p>Πρ = 04° 18΄ Δ/W</p>"},{"id":"18027-4.1α","th":"18027","part":"4.1","lab":"α","k":"mc","secs":["1.4"],"p":5,"ctx":"Πλοίο αποπλέει από τόπο Α με γεωγραφικό πλάτος φ1=30°45′ Ν και γεωγραφικό μήκος λ1=014°10′ Α και καταπλέει σε τόπο Β με γεωγραφικό πλάτος φ2=39°15′ Ν και γεωγραφικό μήκος λ2=015°50′ Δ.","q":"Η διαφορά γεωγραφικού πλάτους Δφ μεταξύ των δύο τόπων είναι:","opts":["Δφ =70°00′ Ν","Δφ =07°30′ Β","Δφ =08°30′ Ν","Δφ =09°30′ Β","Δφ =44°55′ Ν"],"a":2,"why":"Η διαφορά πλάτους Δφ μεταξύ των δύο τόπων είναι:<br>Δφ = 39°15′ – 30°45′ = 08°30′ Ν<br>(Η σχέση υπολογισμού δεν ζητείται. Αρκεί μόνο η επιλογή μιας απάντησης)"},{"id":"18027-4.1β","th":"18027","part":"4.1","lab":"β","k":"mc","secs":["1.4"],"p":5,"ctx":"Πλοίο αποπλέει από τόπο Α με γεωγραφικό πλάτος φ1=30°45′ Ν και γεωγραφικό μήκος λ1=014°10′ Α και καταπλέει σε τόπο Β με γεωγραφικό πλάτος φ2=39°15′ Ν και γεωγραφικό μήκος λ2=015°50′ Δ.","q":"Η διαφορά γεωγραφικού μήκους Δλ μεταξύ των δύο τόπων είναι:","opts":["Δλ =030°00′ Δ","Δλ =001°40’ Α","Δλ =029°40′ Δ","Δλ =045°05′ Α","Δλ =040°00′ Δ"],"a":0,"why":"Η διαφορά μήκους Δλ μεταξύ των δύο τόπων είναι:<br>Δλ = 014°10′ + 015°50′ = 030°00′ Δ<br>(Η σχέση υπολογισμού δεν ζητείται. Αρκεί μόνο η επιλογή μιας απάντησης)"},{"id":"18027-4.2","th":"18027","part":"4.2","k":"calc","secs":["1.10"],"p":15,"q":"<p>Στο πλησιέστερο ανεμολόγιο της περιοχής πλου στο ναυτικό χάρτη αναγράφεται Απ 10° 05΄Α 2001 (+3΄) [Var. 10° 05′ E 2001 (+ 3′)]. Για τιμή παρεκτροπής (Τρ) 3° Α/Ε να υπολογιστεί η παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>) την 17/03/2022.</p>","sol":"<p>Ισχύει:</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ </sub>± ολική μεταβολή (+ αυξ., - ελατ.), όπου: ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p>Πρ<sub>Μ</sub> = Απ<sub>σ </sub>+ Τρ (αλγεβρικά)</p>\n<p>Συνεπώς:</p>\n<p>ολική μεταβολή = έτη × ετήσια μεταβολή = (2022 - 2001) × 3΄ = 21 × 3΄ = 63΄ = 1° 03΄</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ </sub>+ ολική μεταβολή (+ αυξ.)</p>\n<p>Απ<sub>σ</sub> = 10° 05΄ + 1° 03΄ = 11° 08΄ Α/Ε</p>\n<p>Πρ<sub>Μ</sub> = Απ<sub>σ </sub>+ Τρ = (+11°08΄) + (+3°) = 11°08΄ +3° = +14°08΄ = 14°08΄ Α/Ε</p>"},{"id":"18041-4.1","th":"18041","part":"4.1","k":"calc","secs":["1.1-1.2"],"p":10,"q":"<p>Με βάση το παρακάτω σχήμα, να γράψετε στην κόλλα σας τους αριθμούς 1,2,3,4 και δίπλα σε κάθε αριθμό να αναφέρετε ονομαστικά τον ορισμό στη γη που αντιστοιχεί.</p>\n<img class=\"fig\" src=\"img/18041_fig.png\" alt=\"\">","sol":"<p>1: μεσημβρινός</p>\n<p>2: πρώτος μεσημβρινός ή μεσημβρινός του Greenwich</p>\n<p>3: ισημερινός</p>\n<p>4: παράλληλος κύκλος ή παράλληλος πλάτους.</p>"},{"id":"18041-4.2","th":"18041","part":"4.2","k":"calc","secs":["1.10"],"p":15,"q":"<p>Η σύγχρονη απόκλιση (Απ<sub>σ</sub>) είναι 1,5°Δ και για την πορεία του πλοίου η παρεκτροπή (Τρ) της μαγνητικής πυξίδας ειναι 1° 10΄Α.</p>\n<p>Να βρεθεί η παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>) (<i>απαιτείται σχήμα, Μονάδες 5</i>).</p>","sol":"<p>Ισχύει:</p>\n<p>Πρ<sub>Μ</sub> = Απ<sub>σ</sub>+ Τρ (αλγεβρικά)</p>\n<p>Συνεπώς:</p>\n<p class=in>Απ<sub>σ</sub> = 1,5° → Απ<sub>σ</sub> = 1° +0,5° × 60′ = 1° 30′</p>\n<p class=in>Πρ<sub>Μ</sub> = (−1° 30<sup>′</sup>)+(+1° 10<sup>′</sup>) = −1° 30<sup>′</sup> +1° 10<sup>′</sup> = 0° 20<sup>′</sup>Δ</p>\n<img class=\"fig\" src=\"img/18041s_fig.png\" alt=\"\">"},{"id":"18044-Θ","th":"18044","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Πλοίο αποπλέει από αρχικό στίγμα Α με γεωγραφικό πλάτος φ<sub>ε</sub> = 42° 38΄Β και γεωγραφικό μήκος λ<sub>ε</sub> = 031° 52΄Δ και καταπλέει σε τελικό στίγμα Β με γεωγραφικό πλάτος φ<sub>α</sub> = 12° 44΄Β και γεωγραφικό μήκος λ<sub>α</sub> = 050° 11΄Α.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> τη διαφορά πλάτους (Δφ) <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη διαφορά μήκους (Δλ) <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5)</i></p>","sol":"<p><b>α)</b> Ισχύει: Δφ = φ ± φ΄ (+ετ, -ομ)</p>\n<p>Επειδή: φ<sub>ε</sub>, φ<sub>α</sub> ομ. ⇒ Δφ = φ<sub>ε</sub> - φ<sub>α</sub> παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Συνεπώς:</p>\n<p>Δφ = φ<sub>ε</sub> - φ<sub>α </sub>= 42° 38΄B - 12° 44΄B = 29° 54΄Ν</p>\n<p><b>β)</b> Ισχύει: Δλ = λ ± λ΄ (+ετ, -ομ)</p>\n<p>Επειδή: λ<sub>ε</sub>, λ<sub>α</sub> ετ. ⇒ Δλ = λ<sub>ε</sub> + λ<sub>α</sub> παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Συνεπώς:</p>\n<p>Δλ = λ<sub>ε</sub> + λ<sub>α </sub>= 031° 52΄Δ + 050° 11΄Α = 082° 03΄Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"18609-Θ","th":"18609","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Πλοίο αποπλέει από αρχικό στίγμα Α με γεωγραφικό πλάτος φ<sub>ε</sub> = 32° 56΄Β και γεωγραφικό μήκος λ<sub>ε</sub> = 059° 43΄Α και καταπλέει σε τελικό στίγμα Β με γεωγραφικό πλάτος φ<sub>α</sub> = 07° 59΄Β και γεωγραφικό μήκος λ<sub>α</sub> = 143° 56΄Δ.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> τη διαφορά πλάτους (Δφ) <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη διαφορά μήκους (Δλ) <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5)</i></p>","sol":"<p><b>α)</b> Ισχύει: Δφ = φ ± φ΄ (+ετ, -ομ)</p>\n<p>Επειδή: φ<sub>ε</sub>, φ<sub>α</sub> ομ. ⇒ Δφ = φ<sub>ε</sub> - φ<sub>α</sub> παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Συνεπώς:</p>\n<p class=in>31° 116΄</p>\n<p>φ<sub>ε</sub> = 32° 56΄ Β</p>\n<p>φ<sub>α </sub>= 07° 59΄ Β -</p>\n<p>Δφ= 24° 57΄ Ν</p>\n<p><b>β)</b> Ισχύει: Δλ = λ ± λ΄ (+ετ, -ομ) [αν (λ + λ΄) &gt; 180°, έχουμε Δλ = 360° – (λ + λ΄)]</p>\n<p>Επειδή: λ<sub>ε</sub>, λ<sub>α</sub> ετ. &amp; (λ + λ΄) &gt; 180° ⇒ Δλ = 360° – (λ<sub>ε</sub> + λ<sub>α</sub>) παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Συνεπώς:</p>\n<p>λ<sub>ε </sub>= 059° 43΄Α</p>\n<p>λ<sub>α</sub>= 143° 56΄ Δ +</p>\n<p class=in>202° 99΄ (1° = 60΄)</p>\n<p>Δλ =203° 39΄ Δ ˃ 180°</p>\n<p class=in>359° 60′</p>\n<p class=in>360⁰ 00′</p>\n<p>Δλ = 203° 39΄Δ -</p>\n<p>Δλ = 156°21΄Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"18721-Θ","th":"18721","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Οι συντεταγμένες του στίγματος ενός τόπου Θ είναι, φ= 30° 30΄ Β καιλ= 165° 44΄ Α, και ενός άλλου Θ’, φ’= 28° 10΄Ν, λ’= 171° 20΄Δ.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α)</b> Η διαφορά πλάτους (Δφ) μεταξύ των δύο τόπων. <span class=pt>(Μονάδες 10)</i></p>\n<p class=in><b>β) </b>Η διαφορά μήκους (Δλ) μεταξύ των δύο τόπων . <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5) </i></p>","sol":"<p><b>α) </b>Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ, φ<sub>΄</sub> ετ. ⇒ Δφ = φ + φ΄ παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ = 30° 30΄ Β</p>\n<p>φ’ = 28° 10΄ Ν +</p>\n<p>Δφ΄= 58° 40΄ Ν</p>\n<p><b>β) </b>Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ) [αν (λ + λ΄) &gt; 180° τότε Δλ = 360° - (λ + λ΄)]</p>\n<p>Επειδή: λ, λ΄ ετ. &amp; (λ + λ΄) &gt; 180° ⇒ Δλ = 360° - (λ + λ΄) παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Επομένως:</p>\n<img class=\"fig\" src=\"img/18721s_dl.png\" alt=\"\">\n<p>*(Σημειωτέoν, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"18900-Θ","th":"18900","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Πλοίο αποπλέει από στίγμα εκκίνησης με γεωγραφικό πλάτος φ<sub>ε </sub>= 33° 32′ Β και γεωγραφικό</p>\n<p>μήκος λ<sub>ε</sub>= 128⁰ 52′ Δ, με κατεύθυνση για το στίγμα άφιξης με γεωγραφικό πλάτος φ<sub>α </sub>= 22° 13′ Ν και γεωγραφικό μήκος λ<sub>α </sub>= 133° 46′ Α.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> τη διαφορά πλάτους (Δφ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη διαφορά μήκους (Δλ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in>(<i>απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5</i>)</p>","sol":"<p><b>α)</b>Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ<sub>ε</sub>, φ<sub>α </sub>ετ. ⇒ Δφ = φ<sub>ε</sub> + φ<sub>α </sub>παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ<sub>ε</sub>= 33° 32΄ Β</p>\n<p>φ<sub>α</sub>= 22° 13΄ Ν +</p>\n<p>Δφ= 55° 45΄ Ν</p>\n<p><b>β)</b>Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ) [αν (λ + λ΄) &gt; 180° τότε Δλ = 360°- (λ + λ΄)]</p>\n<p>Επειδή: λ<sub>ε</sub>, λ<sub>α </sub>ετ. &amp;(λ + λ΄) &gt; 180° ⇒ Δλ = 360° – (λ<sub>ε</sub> + λ<sub>α</sub>) παρουσιάζει επωνυμία δυτική (Δ), διότι το πλοίο πλέει προς δυτικότερα μήκη</p>\n<p>Επομένως:</p>\n<p>λ<sub>ε </sub>= 128°52′ Δ</p>\n<p>λ<sub>α</sub> = 133°46′ Α +</p>\n<p>Δλ =261°98′ Α (1°= 60′)</p>\n<p class=in>60′ -</p>\n<p>Δλ = 262°38′ Α ˃ 180°</p>\n<p class=in>359°60′</p>\n<p class=in>360⁰ 00′</p>\n<p>Δλ = 262°38′ Α -</p>\n<p>Δλ = 097°22′ Δ</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"18903-Θ","th":"18903","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Οι συντεταγμένες του στίγματος ενός τόπου Θ είναι, φ = 12° 10΄Ν, λ = 155° 35’Α και ενός άλλου τόπου Θ’, φ΄ = 25° 30΄Β, λ’=175° 02΄Δ.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α)</b> η διαφορά πλάτους (Δφ). <span class=pt>(Μονάδες 10)</i></p>\n<p class=in><b>β)</b> η διαφορά μήκους (Δλ) . <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5) </i></p>","sol":"<p><b>α)</b> Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ, φ<sub>΄</sub> ετ. ⇒ Δφ = φ + φ΄ παρουσιάζει επωνυμία βόρεια (Β), διότι το πλοίο πλέει προς βορειότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ = 12° 10΄ Ν</p>\n<p>φ΄= 25° 30΄ Β +</p>\n<p>Δφ= 37° 40΄ Β</p>\n<p><b>β)</b> Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ) [αν (λ + λ΄) &gt; 180° τότε Δλ = 360° - (λ + λ΄)]</p>\n<p>Επειδή: λ, λ΄ ετ. &amp; (λ + λ΄) &gt; 180° ⇒ Δλ = 360° - (λ + λ΄) παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Επομένως:</p>\n<p>λ = 155° 35ʹ Α</p>\n<p>λ΄= 175° 02ʹ Δ +</p>\n<p>Δλ = 330° 37ʹ Δ ˃ 180°</p>\n<p class=in>359° 60ʹ</p>\n<p class=in>360⁰ 00ʹ</p>\n<p>Δλ = 330° 37ʹ Δ -</p>\n<p>Δλ = 029° 23ʹ Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφ
