ήματα.)</p>"},{"id":"19603-Θ","th":"19603","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Πλοίο αποπλέει από στίγμα εκκίνησης με γεωγραφικό πλάτος φ<sub>ε </sub>= 16° 32´ Ν και γεωγραφικό</p>\n<p>μήκος λ<sub>ε</sub>= 038° 42´ Δ, με κατεύθυνση για το στίγμα άφιξης με γεωγραφικό πλάτος φ<sub>α </sub>= 22° 33´ Ν και γεωγραφικό μήκος λ<sub>α </sub>= 046° 46´ Δ.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> τη διαφορά πλάτους (Δφ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη διαφορά μήκους (Δλ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in>(<i>απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5</i>)</p>","sol":"<p><b>α)</b> Ισχύει: Δφ = φ<sub>ε</sub> ± φ<sub>α</sub> (+ ετ, - ομ)</p>\n<p>Επειδή: φ<sub>ε</sub>, φ<sub>α</sub> ομ. ⇒ Δφ = φ<sub>α</sub> – φ<sub>ε </sub>(αφαιρούμε το μικρότερο από το μεγαλύτερο) και παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη.</p>\n<p>Επομένως: Δφ = φ<sub>α</sub> – φ<sub>ε</sub> = 22° 33´Ν - 16° 32´Ν = 06° 01´ Ν</p>\n<p><b>β)</b> Ισχύει: Δλ = λ<sub>ε</sub> ± λ<sub>α</sub> (+ ετ, - ομ)</p>\n<p>Επειδή: λ<sub>ε</sub>, λ<sub>α</sub> ομ. ⇒ Δλ = λ<sub>α</sub> – λ<sub>ε</sub> (αφαιρούμε το μικρότερο από το μεγαλύτερο) και παρουσιάζει επωνυμία δυτική (Δ), διότι το πλοίο πλέει προς δυτικότερα μήκη.</p>\n<p>Επομένως: Δλ = λ<sub>α</sub> – λ<sub>ε</sub> = 046° 46´Δ - 038° 42´Δ = 008° 04´ Δ</p>\n<p><i>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και </i> <i>με σκαριφήματα.) </i></p>"},{"id":"20243-Θ","th":"20243","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Οι συντεταγμένες του στίγματος ενός τόπου Θ είναι, φ = 45° 46΄Ν, λ = 137° 52΄Δ και ενός άλλου Θ΄ φ΄ = 20° 36΄Ν, λ΄ = 122° 32΄Δ.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> τη διαφορά πλάτους (Δφ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη διαφορά μήκους (Δλ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5) </i></p>","sol":"<p><b>α) </b>Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ, φ<sub>΄</sub> ομ. ⇒ Δφ = φ - φ΄ παρουσιάζει επωνυμία βόρεια (Β), διότι το πλοίο πλέει προς βορειότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ = 45° 46΄ Ν</p>\n<p>φ’ = 20° 36΄ Ν -</p>\n<p>Δφ΄= 25° 10΄ Β</p>\n<p><b>β) </b>Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: λ, λ΄ ομ. ⇒ Δλ = λ - λ΄ παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Επομένως:</p>\n<p>λ = 137° 52΄ Δ</p>\n<p>λ’= 122° 32΄ Δ -</p>\n<p>Δλ = 015° 20΄ Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"23708-Θ","th":"23708","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Οι συντεταγμένες του στίγματος ενός τόπου Θ είναι, φ= 20° 20΄ Β και λ= 145° 24΄ Α, και ενός άλλου Θ’, φ’= 28° 30΄Ν, λ’= 161° 54΄Δ.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α)</b> Η διαφορά πλάτους μεταξύ των δύο τόπων. <span class=pt>(Μονάδες 10)</i></p>\n<p class=in><b>β) </b>Η διαφορά μήκους μεταξύ των δύο τόπων . <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5) </i></p>","sol":"<p><b>α) </b>Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ, φ<sub>΄</sub> ετ. ⇒ Δφ = φ + φ΄ παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ = 20° 20΄ Β</p>\n<p>φ’ = 28° 30΄ Ν +</p>\n<p>Δφ΄= 48° 50΄ Ν</p>\n<p><b>β) </b>Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ) [αν (λ + λ΄) &gt; 180° τότε Δλ = 360° - (λ + λ΄)]</p>\n<p>Επειδή: λ, λ΄ ετ. &amp; (λ + λ΄) &gt; 180° ⇒ Δλ = 360° - (λ + λ΄) παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Επομένως:</p>\n<img class=\"fig\" src=\"img/23708s_dl.png\" alt=\"\">\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"23965-Θ","th":"23965","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Οι συντεταγμένες του στίγματος ενός τόπου Θ είναι, φ = 50° 46΄Ν, λ = 140° 52΄Δ και ενός άλλου Θ΄ φ΄ = 40° 36΄Ν, λ΄ = 132° 32΄Δ.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> τη διαφορά πλάτους (Δφ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη διαφορά μήκους (Δλ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5)</i></p>","sol":"<p><b>α)</b> Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ, φ<sub>΄</sub> ομ. ⇒ Δφ = φ - φ΄ παρουσιάζει επωνυμία βόρεια (Β), διότι το πλοίο πλέει προς βορειότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ = 50° 46΄ Ν</p>\n<p>φ’ = 40° 36΄ Ν -</p>\n<p>Δφ΄=10° 10΄ Β</p>\n<p><b>β)</b> Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: λ, λ΄ ομ. ⇒ Δλ = λ - λ΄ παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Επομένως:</p>\n<p>λ = 140° 52΄ Δ</p>\n<p>λ’= 132° 32΄ Δ -</p>\n<p>Δλ = 08° 20΄ Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"23996-Θ","th":"23996","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Πλοίο αποπλέει από αρχικό στίγμα Α με γεωγραφικό πλάτος φ<sub>ε</sub> = 38° 08΄Β και γεωγραφικό μήκος λ<sub>ε</sub> = 044° 44΄Α και καταπλέει σε τελικό στίγμα Β με γεωγραφικό πλάτος φ<sub>α</sub> = 11° 58΄Β και γεωγραφικό μήκος λ<sub>α</sub> = 135° 45΄Δ.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> τη διαφορά πλάτους (Δφ) <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη διαφορά μήκους (Δλ) <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5)</i></p>","sol":"<p><b>α)</b> Ισχύει: Δφ = φ ± φ΄ (+ετ, -ομ)</p>\n<p>Επειδή: φ<sub>ε</sub>, φ<sub>α</sub> ομ. ⇒ Δφ = φ<sub>ε</sub> - φ<sub>α</sub> παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Συνεπώς:</p>\n<p class=in>38° 68΄</p>\n<p>φ<sub>ε</sub> = 38° 08΄ Β</p>\n<p>φ<sub>α </sub>= 11° 58΄ Β -</p>\n<p>Δφ= 27° 10΄ Ν</p>\n<p><b>β)</b> Ισχύει: Δλ = λ ± λ΄ (+ετ, -ομ) [αν (λ + λ΄) &gt; 180°, έχουμε Δλ = 360° – (λ + λ΄)]</p>\n<p>Επειδή: λ<sub>ε</sub>, λ<sub>α</sub> ετ. &amp; (λ + λ΄) &gt; 180° ⇒ Δλ = 360° – (λ<sub>ε</sub> + λ<sub>α</sub>) παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Συνεπώς:</p>\n<p>λ<sub>ε </sub>= 084° 44΄Α</p>\n<p>λ<sub>α</sub>= 135° 45΄ Δ +</p>\n<p class=in>219° 89΄ (1° = 60΄)</p>\n<p>Δλ =220° 29΄ Δ ˃ 180°</p>\n<p class=in>359° 60′</p>\n<p class=in>360⁰ 00′</p>\n<p>Δλ = 220° 29΄Δ -</p>\n<p>Δλ = 139°31΄Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>","note":"Προσοχή: η ενδεικτική απάντηση έχει δύο λάθη. Δφ = 38° 08΄ − 11° 58΄ = 26° 10΄ Ν (όχι 27° 10΄). Στη Δλ γράφει λε 084° 44΄ αντί για 044° 44΄: σωστά 044° 44΄ + 135° 45΄ = 180° 29΄ > 180°, άρα Δλ = 360° − 180° 29΄ = 179° 31΄ Α (όχι 139° 31΄)."},{"id":"23998-Θ","th":"23998","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Πλοίο αποπλέει από αρχικό στίγμα Α με γεωγραφικό πλάτος φ<sub>ε</sub> = 30° 14΄Β και γεωγραφικό μήκος λ<sub>ε</sub> = 050° 50΄Δ και καταπλέει σε τελικό στίγμα Β με γεωγραφικό πλάτος φ<sub>α</sub> = 11° 20΄Β και γεωγραφικό μήκος λ<sub>α</sub> = 082° 11΄Α.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> τη διαφορά πλάτους (Δφ) <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη διαφορά μήκους (Δλ) <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5)</i></p>","sol":"<p><b>α)</b> Ισχύει: Δφ = φ ± φ΄ (+ετ, -ομ)</p>\n<p>Επειδή: φ<sub>ε</sub>, φ<sub>α</sub> ομ. ⇒ Δφ = φ<sub>ε</sub> - φ<sub>α</sub> παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Συνεπώς:</p>\n<p class=in>29° 74΄</p>\n<p>φ<sub>ε</sub> = 30° 14΄ Β</p>\n<p>φ<sub>α </sub>= 11° 20΄ Β -</p>\n<p>Δφ= 18° 54΄ Ν</p>\n<p><b>β)</b> Ισχύει: Δλ = λ ± λ΄ (+ετ, -ομ) [αν (λ + λ΄) &gt; 180°, έχουμε Δλ = 360° – (λ + λ΄)]</p>\n<p>Επειδή: λ<sub>ε</sub>, λ<sub>α</sub> ετ. &amp; (λ + λ΄) &gt; 180° ⇒ Δλ = 360° – (λ<sub>ε</sub> + λ<sub>α</sub>) παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Συνεπώς:</p>\n<p>λ<sub>ε </sub>= 050° 50΄Δ</p>\n<p>λ<sub>α</sub>= 082° 11΄ Α +</p>\n<p class=in>132° 61΄ (1° = 60΄)</p>\n<p>Δλ =133° 01΄ Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"24068-Θ","th":"24068","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Πλοίο αποπλέει από στίγμα εκκίνησης με γεωγραφικό πλάτος φ<sub>ε</sub>= 54°18′ Β και γεωγραφικό</p>\n<p>μήκος λ<sub>ε</sub>= 134⁰ 58′ Δ, με κατεύθυνση για το στίγμα άφιξης με γεωγραφικό πλάτος φ<sub>α</sub>= 26° 11′ Ν και γεωγραφικό μήκος λ<sub>α</sub>= 148° 33′ Α.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α) </b>τη διαφορά πλάτους (Δφ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β) </b>τη διαφορά μήκους (Δλ). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5) </i></p>","sol":"<p><b>α)</b>Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ<sub>ε</sub>, φ<sub>α </sub>ετ. ⇒ Δφ = φ<sub>ε</sub> + φ<sub>α </sub>παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ<sub>ε</sub>= 54° 18΄ Β</p>\n<p>φ<sub>α</sub>= 26° 11΄ Ν +</p>\n<p>Δφ= 80° 29΄ Ν</p>\n<p><b>β)</b>Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ) [αν (λ + λ΄) &gt; 180° τότε Δλ = 360°- (λ + λ΄)]</p>\n<p>Επειδή: λ<sub>ε</sub>, λ<sub>α </sub>ετ. &amp;(λ + λ΄) &gt; 180° ⇒ Δλ = 360° – (λ<sub>ε</sub> + λ<sub>α</sub>) παρουσιάζει επωνυμία δυτική (Δ), διότι το πλοίο πλέει προς δυτικότερα μήκη</p>\n<p>Επομένως:</p>\n<p>λ<sub>ε </sub>= 134°58′ Δ</p>\n<p>λ<sub>α</sub> = 148°33′ Α +</p>\n<p>Δλ =282°91′ Α (1°= 60′)</p>\n<p class=in>60′ -</p>\n<p>Δλ = 283°31′ Α ˃ 180°</p>\n<p class=in>359°60′</p>\n<p class=in>360⁰ 00′</p>\n<p>Δλ = 283°31′ Α -</p>\n<p>Δλ = 076°29′ Δ</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"24103-Θ","th":"24103","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Οι συντεταγμένες του στίγματος ενός τόπου Θ είναι, φ= 30° 30΄ Β και λ= 095° 34΄ Α, και ενός άλλου Θ’, φ’= 28° 05΄Ν, λ’= 101° 34΄Δ.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α)</b> Η διαφορά πλάτους μεταξύ των δύο τόπων. <span class=pt>(Μονάδες 10)</i></p>\n<p class=in><b>β) </b>Η διαφορά μήκους μεταξύ των δύο τόπων . <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5) </i></p>","sol":"<p><b>α)</b>Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ, φ<sub>΄</sub> ετ. ⇒Δφ = φ + φ΄ παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ = 30° 30΄ Β</p>\n<p>φ’ = 28° 05΄ Ν +</p>\n<p>Δφ΄= 58°35΄ Ν</p>\n<p><b>β)</b>Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ) [αν (λ + λ΄) &gt; 180° τότε Δλ = 360° - (λ + λ΄)]</p>\n<p>Επειδή: λ, λ΄ ετ. &amp; (λ + λ΄) &gt; 180° ⇒Δλ = 360° - (λ + λ΄) παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Επομένως:</p>\n<img class=\"fig\" src=\"img/24103s_dl.png\" alt=\"\">\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>","note":"Προσοχή: 360° 00΄ − 197° 08΄ = 162° 52΄ Α· η ενδεικτική απάντηση γράφει 162° 54΄."},{"id":"24160-Θ","th":"24160","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Πλοίο αποπλέει από στίγμα εκκίνησης με γεωγραφικό πλάτος φ<sub>ε </sub>= 09° 37´ Β και γεωγραφικό</p>\n<p>μήκος λ<sub>ε</sub>= 022° 03´ Δ, με κατεύθυνση για το στίγμα άφιξης με γεωγραφικό πλάτος φ<sub>α </sub>= 12° 22´ Β και γεωγραφικό μήκος λ<sub>α </sub>= 004° 41´ Δ.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in>α) τη διαφορά πλάτους (Δφ). (Μονάδες 10)</p>\n<p class=in>β) τη διαφορά μήκους (Δλ). (Μονάδες 10)</p>\n<p class=in>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5)</p>","sol":"<p>α) Ισχύει: Δφ = φ<sub>ε </sub>± φ<sub>α </sub>(+ ετ, - ομ)</p>\n<p>Επειδή: φ<sub>ε</sub>, φ<sub>α </sub>ομ. ⇒ Δφ = φ<sub>α </sub>– φ<sub>ε </sub>(αφαιρούμε το μικρότερο από το μεγαλύτερο) και παρουσιάζει επωνυμία βόρεια (Β), διότι το πλοίο πλέει προς βορειότερα πλάτη.</p>\n<p>Επομένως: Δφ = φ<sub>α </sub>– φ<sub>ε </sub>= 12° 22´Β - 09° 37´Β = 11° 82´Β - 09° 37´Β = 02° 45´ Β</p>\n<p>β) Ισχύει: Δλ = λ<sub>ε </sub>± λ<sub>α </sub>(+ ετ, - ομ)</p>\n<p>Παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη.</p>\n<p>Επομένως: Δλ = λ<sub>ε </sub>– λ<sub>α </sub>= 022° 03´Δ - 004° 41´Δ = 021° 63´Δ - 004° 41´Δ = 017° 22´ Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"24711-Θ","th":"24711","part":"","k":"calc","secs":["1.4"],"p":25,"q":"<p>Οι συντεταγμένες του στίγματος ενός τόπου Θ είναι, φ = 22° 20΄Ν, λ = 135° 33’Α και ενός άλλου τόπου Θ’, φ΄ = 25° 30΄Ν, λ’=155° 02΄Δ.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α)</b> η διαφορά πλάτους (Δφ). <span class=pt>(Μονάδες 10)</i></p>\n<p class=in><b>β)</b> η διαφορά μήκους (Δλ) . <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται τεκμηρίωση επωνυμιών, Μονάδες 5) </i></p>","sol":"<p><b>α)</b> Ισχύει: Δφ = φ ± φ΄ (+ ετ, - ομ)</p>\n<p>Επειδή: φ, φ΄ ομ. ⇒ Δφ = φ΄ - φ παρουσιάζει επωνυμία νότια (Ν), διότι το πλοίο πλέει προς νοτιότερα πλάτη</p>\n<p>Επομένως:</p>\n<p>φ΄ = 25° 30΄ Ν</p>\n<p>φ = 22° 20΄ Ν -</p>\n<p>Δφ= 03° 10΄ Ν</p>\n<p><b>β)</b> Ισχύει: Δλ = λ ± λ΄ (+ ετ, - ομ) [αν (λ + λ΄) &gt; 180ο τότε Δλ = 360° - (λ + λ΄)]</p>\n<p>Επειδή: λ, λ΄ ετ. &amp; (λ + λ΄) &gt; 180° ⇒ Δλ = 360° - (λ + λ΄) παρουσιάζει επωνυμία ανατολική (Α), διότι το πλοίο πλέει προς ανατολικότερα μήκη</p>\n<p>Επομένως:</p>\n<p>λ = 135° 33ʹ Α</p>\n<p>λ΄= 155° 02ʹ Δ +</p>\n<p>Δλ = 290° 35ʹ Δ ˃ 180°</p>\n<p class=in>359° 60ʹ</p>\n<p class=in>360⁰ 00ʹ</p>\n<p>Δλ = 290° 35ʹ Δ –</p>\n<p>Δλ = 069° 25ʹ Α</p>\n<p>*(Σημειωτέον, οι τεκμηριώσεις των ανωτέρω επωνυμιών δύνανται να προκύψουν ακόμη και με σκαριφήματα.)</p>"},{"id":"18916-Θ","th":"18916","part":"","k":"calc","secs":["1.13-1.14","1.16"],"p":25,"q":"<p>Κατά τον πλου, με πορεία γυροσκοπικής πυξίδας (ζ<sub>ΠG</sub>) 050°, μετρήσαμε με τη διόπτρα του επαναλήπτη της γυροπυξίδας τη διόπτευση ενός φάρου (Αζ<sub>ΠG</sub>) 100°, ενώ η αληθής απόλυτη διόπτευση του φάρου (Αζ<sub>λ</sub>) είναι 102°.</p>\n<p class=in><b>α)</b> Να υπολογίσετε το/την σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>). <span class=pt>(Μονάδες 15)</span></p>\n<p class=in><b>β) </b>Να υπολογίσετε τη σχετική διόπτευση του φάρου. <span class=pt>(Μονάδες 10)</span></p>","sol":"<p><b>α)</b> Ισχύει: Αζ<sub>λ</sub> = Αζ<sub>Π </sub>+ Πρ (αλγεβρικά) ⇒ Πρ = Αζ<sub>λ</sub> – Αζ<sub>Π</sub> (αλγεβρικά)</p>\n<p>Επομένως: Πρ<sub>G</sub> = Αζ<sub>λ</sub> – Αζ<sub>ΠG</sub> = 102° - 100° = + 2° = 2° Α</p>\n<p><b>β) </b>Ισχύει: Σχ = Αζ - ζ (για ομοειδείς Αζ και ζ κατά ζεύγη)</p>\n<p>Επομένως: Σχ = Αζ<sub>ΠG</sub> - ζ<sub>ΠG </sub>= 100° - 050° = 050° (ολοκ. τιμή) ή 050° προς τα δεξιά (ημικ. τιμή)</p>"},{"id":"19598-Θ","th":"19598","part":"","k":"calc","secs":["1.13-1.14","1.16"],"p":25,"q":"<p>Κατά τον πλου, με πορεία μαγνητικής πυξίδας (ζ<sub>ΠM</sub>) 060°, μετρήσατε μαγνητικής πυξίδας απόλυτη διόπτευση (Αζ<sub>ΠM</sub>) ενός φάρου 110°, ενώ η αληθής απόλυτη διόπτευση (Αζ<sub>λ</sub>) του φάρου είναι 108°.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> την παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>M</sub>). <span class=pt>(Μονάδες 15)</span></p>\n<p class=in><b>β) </b>τη σχετική διόπτευση (Σχ) του φάρου. <span class=pt>(Μονάδες 10)</span></p>","sol":"<p><b>α)</b> Ισχύει: Αζ<sub>λ</sub> = Αζ<sub>Π </sub>+ Πρ (αλγεβρικά) ⇒ Πρ = Αζ<sub>λ</sub> – Αζ<sub>Π</sub> (αλγεβρικά)</p>\n<p>Επομένως: Πρ<sub>M</sub> = Αζ<sub>λ</sub> – Αζ<sub>ΠM</sub> = 108° - 110° = - 2° = 2° Δ</p>\n<p><b>β) </b>Ισχύει: Σχ = Αζ - ζ (για ομοειδείς Αζ και ζ κατά ζεύγη)</p>\n<p>Επομένως: Σχ = Αζ<sub>ΠM</sub> - ζ<sub>ΠM </sub>= 110° - 060° = 050° (ολοκ. τιμή) ή 050° προς τα δεξιά (ημικ. τιμή)</p>"},{"id":"24158-Θ","th":"24158","part":"","k":"calc","secs":["1.13-1.14","1.16"],"p":25,"q":"<p>Κατά τον πλου, με πορεία γυροσκοπικής πυξίδας (ζ<sub>ΠG</sub>) 338°, μετρήσαμε με τη διόπτρα του επαναλήπτη της γυροπυξίδας τη διόπτευση ενός φάρου (Αζ<sub>ΠG</sub>) 012°, ενώ η αληθής απόλυτη διόπτευση του φάρου (Αζ<sub>λ</sub>) είναι 013°.</p>\n<p class=in>α) Να υπολογίσετε το/την σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>). (Μονάδες 15)</p>\n<p class=in>β) Να υπολογίσετε τη σχετική διόπτευση του φάρου. (Μονάδες 10)</p>","sol":"<p>α) Ισχύει: Αζ<sub>λ </sub>= Αζ<sub>Π </sub>+ Πρ (αλγεβρικά) ⇒ Πρ = Αζ<sub>λ </sub>– Αζ<sub>Π </sub>(αλγεβρικά)</p>\n<p>Επομένως: Πρ<sub>G </sub>= Αζ<sub>λ </sub>– Αζ<sub>ΠG </sub>= 013° - 012° = + 1° = 1° Α</p>\n<p>β) Ισχύει: Σχ = Αζ - ζ (για ομοειδείς Αζ και ζ κατά ζεύγη)</p>\n<p>Επομένως: Σχ = Αζ<sub>ΠG </sub>- ζ<sub>ΠG </sub>= 012° - 338° = (360°+ 012°) - 338°=372°+ 338°= 034° (ολοκ. τιμή) ή 034° προς τα δεξιά (ημικ. τιμή)</p>","note":"Στην ενδεικτική απάντηση γράφεται «372° + 338°»· η πράξη είναι 372° − 338° = 034°."},{"id":"24159-Θ","th":"24159","part":"","k":"calc","secs":["1.13-1.14","1.16"],"p":25,"q":"<p>Κατά τον πλου, με πορεία μαγνητικής πυξίδας (ζ<sub>ΠM</sub>) 155°, μετρήσατε μαγνητικής πυξίδας απόλυτη διόπτευση (Αζ<sub>ΠM</sub>) ενός φάρου 145°, ενώ η αληθής απόλυτη διόπτευση (Αζ<sub>λ</sub>) του φάρου είναι 144°.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in>α) την παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>M</sub>). (Μονάδες 15)</p>\n<p class=in>β) τη σχετική διόπτευση (Σχ) του φάρου. (Μονάδες 10)</p>","sol":"<p>α) Ισχύει: Αζ<sub>λ </sub>= Αζ<sub>Π </sub>+ Πρ (αλγεβρικά) ⇒ Πρ = Αζ<sub>λ </sub>– Αζ<sub>Π </sub>(αλγεβρικά)</p>\n<p>Επομένως: Πρ<sub>M </sub>= Αζ<sub>λ </sub>– Αζ<sub>ΠM </sub>= 144° - 145° = - 1° = 1° Δ</p>\n<p>β) Ισχύει: Σχ = Αζ - ζ (για ομοειδείς Αζ και ζ κατά ζεύγη)</p>\n<p>Επομένως: Σχ = Αζ<sub>ΠM </sub>- ζ<sub>ΠM </sub>= 145° - 155° = (360°+ 145°) - 155° = 505°+ 155°= 350° (ολοκ. τιμή) ή 360° - 350°= 010° προς τα αριστερά (ημικ. τιμή)</p>","note":"Στην ενδεικτική απάντηση γράφεται «505° + 155°»· η πράξη είναι 505° − 155° = 350°."},{"id":"36447-Θ","th":"36447","part":"","k":"calc","secs":["1.13-1.14","1.16"],"p":25,"q":"<p>Με πορεία (compass course) της γυροσκοπικής πυξίδας (ζπ<sub>G</sub>) 059°, κατά τον πλου μετρήσατε με τη διόπτρα του επαναλήπτη της γυροσκοπικής πυξίδας απόλυτη διόπτευση (Αζπ<sub>G</sub>) δύο φανών σε ευθυγράμμιση 359°. Στους φαροδείκτες αναγράφεται η τιμή της ευθυγραμμίσεως των φανών 000° - 180°.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> το/την σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη σχετική διόπτευση (relative bearing) των φανών (Σχ). <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α) </b>Ισχύει: Αζλ = Αζπ + Πρ (αλγεβρικά) ⇒ Πρ = Αζλ - Αζπ</p>\n<p>Επομένως:</p>\n<p class=in>Πρ<sub>G</sub> = Αζλ – Αζπ<sub>G </sub>= 000° - 359° = +1° = 1°A/E</p>\n<p><b>β) </b>Ισχύει: Σχ = Αζ - ζ</p>\n<p>Επομένως:</p>\n<p>Σχ = Αζπ<sub>G</sub> - ζπ<sub>G</sub>= 359° - 059° = 300° (ολοκυκλικά) ⇒ 360° - 300° = 060° ΑΡ (ημικυκλικά)</p>"},{"id":"36458-Θ","th":"36458","part":"","k":"calc","secs":["1.13-1.14","1.16"],"p":25,"q":"<p>Με πορεία (compass course) της μαγνητικής πυξίδας (ζπ<sub>Μ</sub>) 270°, κατά τον πλου μετρήσατε μαγνητικής πυξίδας απόλυτη διόπτευση (Αζπ<sub>M</sub>) δύο φανών σε ευθυγράμμιση 205°. Στους φαροδείκτες αναγράφεται η τιμή της ευθυγραμμίσεως των φανών 200° - 020°.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> την παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>M</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τη σχετική διόπτευση (relative bearing) των φανών (Σχ). <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α) </b>Ισχύει: Αζλ = Αζπ + Πρ (αλγεβρικά) ⇒ Πρ = Αζλ - Αζπ</p>\n<p>Επομένως:</p>\n<p class=in>Πρ<sub>Μ</sub> = Αζλ – Αζπ<sub>Μ </sub>= 200° - 205° = -5° = 5°Δ/W</p>\n<p><b>β) </b>Ισχύει: Σχ = Αζ - ζ</p>\n<p>Επομένως:</p>\n<p>Σχ = Αζπ<sub>Μ</sub> - ζπ<sub>Μ</sub> = 205° - 270° = 295° (ολοκυκλικά) ⇒ 360° - 295° = 065° ΑΡ (ημικυκλικά)</p>"},{"id":"19115-4.1","th":"19115","part":"4.1","k":"calc","secs":["1.13-1.14"],"p":10,"q":"<p>Πλέοντας με πορεία πυξίδας (ζ<sub>Π</sub>) 100°, λάβατε σχετική διόπτευση (Σχ) ακρωτηρίου 045° προς τα δεξιά της πλώρης και σχετική διόπτευση (Σχ) πλοίου 060° προς τα αριστερά της πλώρης.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α) </b>Η πυξίδας απόλυτη διόπτευση (Αζ<sub>Π</sub>) του ακρωτηρίου. <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>β) </b>Η πυξίδας απόλυτη διόπτευση (Αζ<sub>Π</sub>) του πλοίου. <span class=pt>(Μονάδες 5)</span></p>","sol":"<p>Ισχύει:</p>\n<p>Αζ = ζ + Σχ (για ομοειδείς Αζ και ζ κατά ζεύγη), όπου οι Σχ και Αζ ανάγονται πρώτα σε ολοκ. τιμές &amp; Αν ζ + Σχ &gt; 360°, τότε μειώνεται η Αζ κατά 360°</p>\n<p>Επομένως:</p>\n<p><b>α)</b> Αζ<sub>Π</sub> = ζ<sub>Π</sub> + Σχ = 100° + 045° = 145°</p>\n<p><b>β) </b>Αζ<sub>Π</sub> = ζ<sub>Π</sub> + Σχ = 100° + (360° - 060°) = 100° + 300° = 400° &gt; 360° ⇒ Αζ<sub>Π</sub> = 400° - 360° = 040°</p>"},{"id":"19115-4.2","th":"19115","part":"4.2","k":"calc","secs":["1.13-1.14"],"p":15,"q":"<p>Πλέοντας με αληθή πορεία (ζλ) 200°, υπολογίσατε τις αληθείς απόλυτες διοπτεύσεις (Αζλ) ενός ακρωτηρίου 210° και ενός φάρου 180°.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α) </b>Η σχετική διόπτευση (Σχ) του ακρωτηρίου. <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>β) </b>Η σχετική διόπτευση (Σχ) του φάρου. <span class=pt>(Μονάδες 10)</span></p>","sol":"<p>Ισχύει:</p>\n<p>Σχ = Αζ - ζ (για ομοειδείς Αζ και ζ κατά ζεύγη)</p>\n<p>&amp; Αν ζ &gt; Αζ, τότε αυξάνεται η Αζ κατά 360°</p>\n<p>Επομένως:</p>\n<p><b>α)</b> Σχ = Αζλ - ζλ = 210° - 200° = 010° (ολοκ. τιμή)</p>\n<p>ή/και Σχ = 10° προς τα δεξιά (ημικ. τιμή)</p>\n<p><b>β) </b>Σχ = Αζλ - ζλ = (180°+360°) - 200° = 540° - 200° = 340° (ολοκ. τιμή)</p>\n<p>ή/και Σχ = 360° - 340° = 20° προς τα αριστερά (ημικ. τιμή)</p>"},{"id":"23706-4.1","th":"23706","part":"4.1","k":"calc","secs":["1.13-1.14"],"p":10,"q":"<p>Πλέοντας με πορεία πυξίδας (ζ<sub>Π</sub>) 140°, λάβατε σχετική διόπτευση (Σχ) ακρωτηρίου 060° προς τα δεξιά της πλώρης και σχετική διόπτευση (Σχ) πλοίου 050° προς τα αριστερά της πλώρης.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α) </b>Η πυξίδας απόλυτη διόπτευση (Αζ<sub>Π</sub>) του ακρωτηρίου. <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>β) </b>Η πυξίδας απόλυτη διόπτευση (Αζ<sub>Π</sub>) του πλοίου. <span class=pt>(Μονάδες 5)</span></p>","sol":"<p>Ισχύει:</p>\n<p>Αζ = ζ + Σχ (για ομοειδείς Αζ και ζ κατά ζεύγη), όπου οι Σχ και Αζ ανάγονται πρώτα σε ολοκ. τιμές &amp; Αν ζ + Σχ &gt; 360°, τότε μειώνεται η Αζ κατά 360°</p>\n<p>Επομένως:</p>\n<p><b>α)</b> Αζ<sub>Π</sub> = ζ<sub>Π</sub> + Σχ = 140° + 060° = 200°</p>\n<p><b>β) </b>Αζ<sub>Π</sub> = ζ<sub>Π</sub> + Σχ = 140° + (360° - 050°) = 140° + 310° = 450° &gt; 360° ⇒ Αζ<sub>Π</sub> = 450° - 360° = 090°</p>","note":"Στην εκφώνηση της τράπεζας οι μονάδες του 4.1 και του 4.2 είναι αντεστραμμένες: τα ερωτήματα του 4.1 αθροίζουν 10 μονάδες και του 4.2 15."},{"id":"23706-4.2","th":"23706","part":"4.2","k":"calc","secs":["1.13-1.14"],"p":15,"q":"<p>Πλέοντας με αληθή πορεία (ζλ) 210°, υπολογίσατε τις αληθείς απόλυτες διοπτεύσεις (Αζλ) ενός ακρωτηρίου 220° και ενός φάρου 190°.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α) </b>Η σχετική διόπτευση (Σχ) του ακρωτηρίου. <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>β) </b>Η σχετική διόπτευση (Σχ) του φάρου. <span class=pt>(Μονάδες 10)</span></p>","sol":"<p>Ισχύει:</p>\n<p>Σχ = Αζ - ζ (για ομοειδείς Αζ και ζ κατά ζεύγη)</p>\n<p>&amp; Αν ζ &gt; Αζ, τότε αυξάνεται η Αζ κατά 360°</p>\n<p>Επομένως:</p>\n<p><b>α)</b> Σχ = Αζλ - ζλ = 220° - 210° = 010° (ολοκ. τιμή)</p>\n<p>ή/και Σχ = 10° προς τα δεξιά (ημικ. τιμή)</p>\n<p><b>β) </b>Σχ = Αζλ - ζλ = (190°+360°) - 210° = 550° - 210° = 340° (ολοκ. τιμή)</p>\n<p>ή/και Σχ = 360° - 340° = 20° προς τα αριστερά (ημικ. τιμή)</p>","note":"Στην εκφώνηση της τράπεζας οι μονάδες του 4.1 και του 4.2 είναι αντεστραμμένες: τα ερωτήματα του 4.1 αθροίζουν 10 μονάδες και του 4.2 15."},{"id":"28350-4.1","th":"28350","part":"4.1","k":"calc","secs":["1.13-1.14"],"p":10,"q":"<p>Πλέοντας με πορεία πυξίδας (ζ<sub>Π</sub>) 082°, λάβατε σχετική διόπτευση (Σχ) ακρωτηρίου 015° προς τα δεξιά της πλώρης και σχετική διόπτευση (Σχ) πλοίου 055° προς τα αριστερά της πλώρης.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α) </b>Η πυξίδας απόλυτη διόπτευση (Αζ<sub>Π</sub>) του ακρωτηρίου. <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>β) </b>Η πυξίδας απόλυτη διόπτευση (Αζ<sub>Π</sub>) του πλοίου. <span class=pt>(Μονάδες 5)</span></p>","sol":"<p>Ισχύει:</p>\n<p>Αζ = ζ + Σχ (για ομοειδείς Αζ και ζ κατά ζεύγη), όπου οι Σχ και Αζ ανάγονται πρώτα σε ολοκ. τιμές &amp; Αν ζ + Σχ &gt; 360°, τότε μειώνεται η Αζ κατά 360°</p>\n<p>Επομένως:</p>\n<p><b>α)</b> Αζ<sub>Π</sub> = ζ<sub>Π</sub> + Σχ = 082° + 015° = 097°</p>\n<p><b>β) </b>Αζ<sub>Π</sub> = ζ<sub>Π</sub> + Σχ = 082° + (360° - 055°) = 082° + 305° = 387° &gt; 360° ⇒ Αζ<sub>Π</sub> = 387° - 360° = 027°</p>"},{"id":"28350-4.2","th":"28350","part":"4.2","k":"calc","secs":["1.13-1.14"],"p":15,"q":"<p>Πλέοντας με αληθή πορεία (ζλ) 190°, υπολογίσατε τις αληθείς απόλυτες διοπτεύσεις (Αζλ) ενός ακρωτηρίου 200° και ενός φάρου 170°.</p>\n<p>Ζητείται:</p>\n<p class=in><b>α) </b>Η σχετική διόπτευση (Σχ) του ακρωτηρίου. <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>β) </b>Η σχετική διόπτευση (Σχ) του φάρου. <span class=pt>(Μονάδες 10)</span></p>","sol":"<p>Ισχύει:</p>\n<p>Σχ = Αζ - ζ (για ομοειδείς Αζ και ζ κατά ζεύγη)</p>\n<p>&amp; Αν ζ &gt; Αζ, τότε αυξάνεται η Αζ κατά 360°</p>\n<p>Επομένως:</p>\n<p><b>α)</b> Σχ = Αζλ - ζλ = 200° - 190° = 010° (ολοκ. τιμή)</p>\n<p>ή/και Σχ = 10° προς τα δεξιά (ημικ. τιμή)</p>\n<p><b>β) </b>Σχ = Αζλ - ζλ = (170°+360°) - 190° = 530° - 190° = 340° (ολοκ. τιμή)</p>\n<p>ή/και Σχ = 360° - 340° = 20° προς τα αριστερά (ημικ. τιμή)</p>"},{"id":"19267-Θ","th":"19267","part":"","k":"calc","secs":["1.10","1.16"],"p":25,"q":"<p>Η πορεία που χαράξατε στο ναυτικό χάρτη (ζλ), από το λιμάνι απόπλου μέχρι το λιμάνι προορισμού είναι 124°. Στο πλησιέστερο ανεμολόγιο της περιοχής του πλου αναγράφεται: Απ = 2° 44΄Δ (2000) ελατ. περίπου 2΄ ετησίως [Var 2° 44΄ W (2000) decr. about 02΄annually].</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α) </b>Την πορεία της γυροσκοπικής πυξίδας (ζπ<sub>G</sub>), με δεδομένο ότι το/η σφάλμα/παραλλαγή της (Πρ<sub>G</sub>) είναι 1° Δ/W. <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> Την πορεία της μαγνητικής πυξίδας (ζπ<sub>M</sub>), με δεδομένο ότι από το ειδικό πινακίδιο παρεκτροπών της παρέχεται η τιμή της παρεκτροπής (Τρ) 00°. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α)</b> Ισχύει:</p>\n<p>ζπ = ζλ - Πρ (αλγεβρικά)</p>\n<p>Επομένως:</p>\n<p>ζπ<sub>G</sub> = 124° - (- 1°) = 124° + 1° = 125°</p>\n<p><b>β)</b> Ισχύει:</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ </sub>± ολική μεταβολή (+ αυξ., - ελατ.), όπου: ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p>Πρ = Απ<sub>σ </sub>+ Τρ (αλγεβρικά)</p>\n<p>ζ<sub>Π</sub> = ζλ - Πρ (αλγεβρικά)</p>\n<p>Επομένως:</p>\n<p>ολική μεταβολή = έτη × ετήσια μεταβολή = (2022 - 2000) × 2΄ = 22 × 2΄ = 44΄</p>\n<p>Απ<sub>2022</sub> = Απ<sub>2000 </sub>- ολική μεταβολή (- ελατ.) ⇒ Απ<sub>2022 </sub>= 2° 44΄- 44΄ = 2°Δ/ W</p>\n<p>Πρ<sub>M </sub>= Απ<sub>2022</sub> + Τρ = - 2° + 0° = - 2° = 2° Δ/W</p>\n<p>ζπ<sub>M</sub> = ζλ - Πρ<sub>M </sub>= 124° - (-2°) = 124° + 2° = 126°</p>","note":"Η παραλλαγή της μαγνητικής δεν δίνεται: πρώτα βρίσκουμε τη σύγχρονη απόκλιση από το ανεμολόγιο."},{"id":"23707-Θ","th":"23707","part":"","k":"calc","secs":["1.10","1.16"],"p":25,"q":"<p>Η πορεία που χαράξατε στο ναυτικό χάρτη (ζλ), από το λιμάνι απόπλου μέχρι το λιμάνι προορισμού είναι 132°. Στο πλησιέστερο ανεμολόγιο της περιοχής του πλου αναγράφεται:</p>\n<p>Απ = 2° 30΄Δ (2002) ελατ. περίπου 1΄ ετησίως [Var 2° 30΄ W (2002) decr. about 01΄annually]. Να υπολογίσετε:</p>\n<p class=in><b>α) </b>Την πορεία της γυροσκοπικής πυξίδας (ζπ<sub>G</sub>), με δεδομένο ότι το/η σφάλμα/παραλλαγή της (Πρ<sub>G</sub>) είναι 2° Δ/W. <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> Την πορεία της μαγνητικής πυξίδας (ζπ<sub>M</sub>), με δεδομένο ότι από το ειδικό πινακίδιο παρεκτροπών της παρέχεται η τιμή της παρεκτροπής (Τρ) 01° Δ/W. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α)</b> Ισχύει:</p>\n<p>ζπ = ζλ - Πρ (αλγεβρικά)</p>\n<p>Επομένως:</p>\n<p>ζπ<sub>G</sub> = 132° - (- 2°) = 132° + 2° = 134°</p>\n<p><b>β)</b> Ισχύει:</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ </sub>± ολική μεταβολή (+ αυξ., - ελατ.), όπου: ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p>Πρ = Απ<sub>σ </sub>+ Τρ (αλγεβρικά)</p>\n<p>ζ<sub>Π</sub> = ζλ - Πρ (αλγεβρικά)</p>\n<p>Επομένως:</p>\n<p>ολική μεταβολή = έτη × ετήσια μεταβολή = (2022 - 2002) × 1΄ = 20 × 1΄ = 20΄</p>\n<p>Απ<sub>2022</sub> = Απ<sub>2002 </sub>- ολική μεταβολή (- ελατ.) ⇒ Απ<sub>2022 </sub>= 2° 30΄- 20΄ = 2° 10΄ Δ/ W</p>\n<p>Πρ<sub>M </sub>= Απ<sub>2022</sub> + Τρ = - 2°10΄ + 1° = - 1°10΄ = 1°10΄ Δ/W</p>\n<p>ζπ<sub>M</sub> = ζλ - Πρ<sub>M </sub>= 132° - (-1°10΄ ) = 132° + 1°10΄ = 133° 10΄</p>","note":"Η παραλλαγή της μαγνητικής δεν δίνεται: πρώτα βρίσκουμε τη σύγχρονη απόκλιση από το ανεμολόγιο. Προσοχή: η ενδεικτική απάντηση προσθέτει την παρεκτροπή ως +1°, ενώ είναι 1° Δ (−1°). Σωστά (για το 2022): ΠρΜ = −2° 10΄ + (−1°) = 3° 10΄ Δ και ζπΜ = 132° + 3° 10΄ = 135° 10΄."},{"id":"19268-Θ","th":"19268","part":"","k":"calc","secs":["1.13-1.14"],"p":25,"q":"<p>Ζητείται η μετατροπή των παρακάτω:</p>\n<p class=in><b>α)</b> ολοκυκλικών διοπτεύσεων σε τεταρτοκυκλικές.</p>\n<p class=in><b>1.</b> 020°, <b>2</b>. 130°, <b>3.</b> 045°, <b>4.</b> 250°, <b>5.</b> 350°</p>\n<p class=in><span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τεταρτοκυκλικών διοπτεύσεων σε ολοκυκλικές.</p>\n<p class=in><b>1.</b> Ν50°Α, <b>2</b>. Ν30°Ζ, <b>3.</b> Β30°Ζ, <b>4.</b> Ν80°Ζ, <b>5.</b> Β30°Α</p>\n<p class=in><span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α) 1. </b>Β20°Α, <b>2</b>. 180° – 130° = Ν50°Α, <b>3.</b> Β45°Α, <b>4.</b> 250° – 180° = N70°Ζ, <b>5.</b> 360° – 350° = B10°Ζ</p>\n<p><b>β) 1. </b>180° - 050° = 130°, <b>2</b>. 180° + 30° = 210° , <b>3.</b> 360° – 30° = 330° , <b>4.</b> 180° + 80° = 260°, <b>5.</b> 030°</p>"},{"id":"19656-Θ","th":"19656","part":"","k":"calc","secs":["1.13-1.14"],"p":25,"q":"<p>Ζητείται η μετατροπή των παρακάτω:</p>\n<p class=in><b>α)</b> ολοκυκλικών πορειών σε τεταρτοκυκλικές.</p>\n<p class=in><b>1.</b> 010°, <b>2</b>. 120°, <b>3.</b> 200°, <b>4.</b> 300°, <b>5.</b> 080°</p>\n<p class=in><span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τεταρτοκυκλικών πορειών σε ολοκυκλικές.</p>\n<p class=in><b>1.</b> Β60°Α, <b>2</b>. Ν50°Ζ, <b>3.</b> Β20°Ζ, <b>4.</b> Ν70°Α, <b>5.</b> Β10°Α</p>\n<p class=in><span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α) 1. </b>Β10°Α, <b>2</b>. 180° – 120° = Ν60°Α, <b>3.</b> 200° – 180° = Ν20°Ζ, <b>4.</b> 360° – 300° = Β60°Ζ, <b>5.</b>Β80°Α</p>\n<p><b>β) 1. </b>060° , <b>2</b>. 180° + 50° = 230° , <b>3.</b> 360° – 20° = 340° , <b>4.</b> 180° – 70° = 110°, <b>5.</b> 010°</p>"},{"id":"24064-Θ","th":"24064","part":"","k":"calc","secs":["1.13-1.14"],"p":25,"q":"<p>Ζητείται η μετατροπή των παρακάτω:</p>\n<p class=in><b>α)</b> ολοκυκλικών διοπτεύσεων σε τεταρτοκυκλικές.</p>\n<p class=in><b>1.</b> 050°, <b>2</b>. 160°, <b>3.</b> 065°, <b>4.</b> 260°, <b>5.</b> 300°</p>\n<p class=in><span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τεταρτοκυκλικών διοπτεύσεων σε ολοκυκλικές.</p>\n<p class=in><b>1.</b> Ν60°Α, <b>2</b>. Ν40°Ζ, <b>3.</b> Β40°Ζ, <b>4.</b> Ν70°Ζ, <b>5.</b> Β50°Α</p>\n<p class=in><span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α) 1. </b>Β50°Α, <b>2</b>. 180° – 160° = Ν20°Α, <b>3.</b> Β65°Α, <b>4.</b> 260° – 180° = N80°Ζ, <b>5.</b> 360° – 300° = B60°Ζ</p>\n<p><b>β) 1. </b>180° - 060° = 120°, <b>2</b>. 180° + 40° = 220° , <b>3.</b> 360° – 40° = 320° , <b>4.</b> 180° + 70° = 250°, <b>5.</b> 050°</p>"},{"id":"24710-Θ","th":"24710","part":"","k":"calc","secs":["1.13-1.14"],"p":25,"q":"<p>Ζητείται η μετατροπή των παρακάτω:</p>\n<p class=in><b>α)</b> ολοκυκλικών πορειών σε τεταρτοκυκλικές.</p>\n<p class=in><b>1.</b> 050°, <b>2</b>. 150°, <b>3.</b> 220°, <b>4.</b> 330°, <b>5.</b> 010°</p>\n<p class=in><span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> τεταρτοκυκλικών πορειών σε ολοκυκλικές.</p>\n<p class=in><b>1.</b> Β80°Α, <b>2</b>. Ν30°Ζ, <b>3.</b> Β40°Ζ, <b>4.</b> Ν20°Α, <b>5.</b> Β05°Α</p>\n<p class=in><span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α)</b> <b>1.</b> Β50°Α, <b>2.</b> 180° – 150° = Ν30°Α, <b>3.</b> 220° – 180° = Ν40°Ζ, <b>4.</b> 360° – 330° = Β30°Ζ, <b>5.</b>Β10°Α</p>\n<p><b>β)</b> <b>1.</b> 080°, <b>2.</b> 180° + 30° = 210°, <b>3.</b> 360° – 40° = 320°, <b>4.</b> 180° – 20° = 160°, <b>5.</b> 005°.</p>"},{"id":"19270-4.1","th":"19270","part":"4.1","k":"calc","secs":["1.15"],"p":12,"q":"<p>Με τη διόπτρα του επαναλήπτη της γυροσκοπικής πυξίδας, η οποία παρουσιάζει σφάλμα/παραλλαγή (Πρ<sub>G</sub>) 1° Δ, διοπτεύσατε φάρο (Αζ<sub>ΠG</sub>) προς 204°. Ποια είναι η τιμή της αληθούς διόπτευσης (Αζλ) που πρέπει να χαράξετε στο ναυτικό χάρτη;</p>","sol":"<p>Ισχύει: Αζλ = Αζ<sub>Π</sub> + Πρ (αλγεβρικά)</p>\n<p>Επομένως: Αζλ = Αζ<sub>ΠG</sub> + Πρ<sub>G</sub> = 204° + (-1° ) = 204° - 1° = 203°</p>"},{"id":"19270-4.2","th":"19270","part":"4.2","k":"calc","secs":["1.15"],"p":13,"q":"<p>Η πορεία που χαράξατε στο ναυτικό χάρτη είναι 234°. Με δεδομένο ότι η παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>) είναι 7,5° Δ, να υπολογίσετε την πορεία της μαγνητικής πυξίδας (ζ<sub>ΠΜ</sub>).</p>","sol":"<p>Ισχύει: ζ<sub>Π</sub> = ζλ - Πρ (αλγεβρικά)</p>\n<p>Επομένως: ζ<sub>ΠΜ</sub> = ζλ – Πρ<sub>Μ</sub> = 234° - (-7,5° ) = 234° + 7,5° = 241,5°</p>"},{"id":"20186-Θ","th":"20186","part":"","k":"calc","secs":["1.16"],"p":25,"q":"<p>Από το πλησιέστερο ανεμολόγιο της περιοχής πλου στο ναυτικού χάρτη μετρήσατε προς την πλευρά του πλου την τιμή της ευθυγραμμίσεως 219°-039°. Με τη διόπτρα του επαναλήπτη της γυροσκοπικής πυξίδας λάβατε απόλυτη διόπτευση (Αζπ<sub>G</sub>) 218°, ενώ η μαγνητικής πυξίδας απόλυτη διόπτευση (Αζπ<sub>Μ</sub>) είναι 214°.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α) </b>το/την σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β) </b>την παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται σχήμα, Μονάδες 5) </i></p>","sol":"<p>Ισχύει: Αζλ = Αζπ+Πρ (αλγεβρικά) ⇒ Πρ = Αζλ - Αζπ</p>\n<p>Επομένως:</p>\n<p><b>α) </b>Πρ<sub>G</sub> = Αζλ - Αζπ<sub>G</sub>= 219° - 218° = + 1° = 1°Α</p>\n<p><b>β) </b>Πρ<sub>Μ</sub> = Αζλ-Αζπ<sub>Μ</sub>= 219° - 214° = + 5° = 5°Α</p>\n<img class=\"fig\" src=\"img/20186s_fig.png\" alt=\"\">"},{"id":"20244-Θ","th":"20244","part":"","k":"calc","secs":["1.16"],"p":25,"q":"<p>Η πορεία που χαράξατε στο ναυτικό χάρτη (ζλ) είναι 121°. Με δεδομένο ότι το/η σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>) έχει προσδιοριστεί 0,7° Δ/W, ενώ της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>) έχει προσδιοριστεί 3°Α/Ε, να υπολογίσετε:</p>\n<p class=in><b>α)</b> την πορεία της γυροσκοπικής πυξίδας (ζ<sub>ΠG</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β) </b>την πορεία της μαγνητικής πυξίδας (ζ<sub>ΠΜ</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται σχήμα, Μονάδες 5) </i></p>","sol":"<p>Ισχύει: ζ<sub>Π</sub> = ζλ - Πρ (αλγεβρικά)</p>\n<p>Επομένως:</p>\n<p><b>α)</b> ζ<sub>ΠG</sub> = ζλ - Πρ<sub>G </sub>= 121° - (- 0,7° ) = 121° + 0,7° = 121,7°</p>\n<p><b>β)</b> ζ<sub>ΠΜ</sub> = ζλ – Πρ<sub>Μ </sub>= 121° - (+ 3° ) = 121° - 3° = 118°</p>\n<img class=\"fig\" src=\"img/20244s_fig.png\" alt=\"\">"},{"id":"20423-Θ","th":"20423","part":"","k":"calc","secs":["1.16"],"p":25,"q":"<p>Κατά τον πλου μετρήσατε μαγνητικής πυξίδας απόλυτη διόπτευση (Αζπ<sub>M</sub>) ενός φάρου 140°, ενώ με τη δίοπτρα του επαναλήπτη της γυροσκοπικής πυξίδας (Αζπ<sub>G</sub>) 141°. Στο ναυτικό χάρτη η διόπτευση του φάρου είναι 142°.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α)</b> την παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>M</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> το/την σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>). <span class=pt>(Μονάδες 10)</span> <i>(Απαιτείται σχήμα, Μονάδες 5)</i></p>","sol":"<p>Ισχύει: Αζλ = Αζπ + Πρ (αλγεβρικά) ⇒ Πρ = Αζλ - Αζπ</p>\n<p>Επομένως:</p>\n<p class=in><b>α) </b>Πρ<sub>Μ</sub> = Αζλ - Αζπ<sub>Μ </sub>= 142° - 140° = +2° = 2°Α/E</p>\n<p class=in><b>β) </b>Πρ<sub>G</sub> = Αζλ - Αζπ<sub>G </sub>= 142° - 141° = +1° = 1°Α/E</p>\n<img class=\"fig\" src=\"img/20423s_fig.png\" alt=\"\">"},{"id":"23966-Θ","th":"23966","part":"","k":"calc","secs":["1.16"],"p":25,"q":"<p>Η πορεία που χαράξατε στο ναυτικό χάρτη (ζλ) είναι 124°. Με δεδομένο ότι το/η σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>) έχει προσδιοριστεί 0,7° Δ/W, ενώ της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>) έχει προσδιοριστεί 3°Α/Ε, να υπολογίσετε:</p>\n<p class=in><b>α)</b> την πορεία της γυροσκοπικής πυξίδας (ζ<sub>ΠG</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> την πορεία της μαγνητικής πυξίδας (ζ<sub>ΠΜ</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται σχήμα, Μονάδες 5)</i></p>","sol":"<p>Ισχύει: ζ<sub>Π</sub> = ζλ- Πρ (αλγεβρικά)</p>\n<p>Επομένως:</p>\n<p><b>α)</b> ζ<sub>ΠG</sub> = ζλ- Πρ<sub>G</sub>= 124° - (- 0,7° ) = 124° + 0,7° = 124,7°</p>\n<p><b>β)</b> ζ<sub>ΠΜ</sub> = ζλ– Πρ<sub>Μ</sub>= 124° - (+ 3° ) = 124° - 3° = 121°</p>\n<img class=\"fig\" src=\"img/23966s_fig.png\" alt=\"\">"},{"id":"24067-Θ","th":"24067","part":"","k":"calc","secs":["1.16"],"p":25,"q":"<p>Από το πλησιέστερο ανεμολόγιο της περιοχής πλου στο ναυτικού χάρτη μετρήσατε προς την πλευρά του πλου την τιμή της ευθυγραμμίσεως 280°-100°. Με τη διόπτρα του επαναλήπτη της γυροσκοπικής πυξίδας λάβατε απόλυτη διόπτευση (Αζπ<sub>G</sub>) 277°, ενώ η μαγνητικής πυξίδας απόλυτη διόπτευση (Αζπ<sub>Μ</sub>) είναι 275°.</p>\n<p>Να υπολογίσετε:</p>\n<p class=in><b>α) </b>το/την σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β) </b>την παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><i>(απαιτείται σχήμα, Μονάδες 5) </i></p>","sol":"<p>Ισχύει: Αζλ = Αζπ+Πρ (αλγεβρικά) ⇒ Πρ = Αζλ - Αζπ</p>\n<p>Επομένως:</p>\n<p><b>α) </b>Πρ<sub>G</sub> = Αζλ - Αζπ<sub>G</sub>= 280° - 277° = + 3° = 3°Α</p>\n<p><b>β) </b>Πρ<sub>Μ</sub> = Αζλ-Αζπ<sub>Μ</sub>= 280° - 275° = + 5° = 5°Α</p>\n<img class=\"fig\" src=\"img/24067s_fig.png\" alt=\"\">"},{"id":"23705-Θ","th":"23705","part":"","k":"calc","secs":["1.10"],"p":25,"q":"<p><b>Θέμα 4ο </b></p>\n<p>Στις 20/12/2022 στο πλησιέστερο ανεμολόγιο του χάρτη της περιοχής που πλέουμε, αναγράφεται: Απόκλιση<sub>2015</sub> (Απ/Var.) 01° 20΄ Δ/W αυξανόμενη 10΄ το έτος ετησίως. Το πλοίο μας τηρεί πορεία μαγνητικής πυξίδας 130° (ζ<sub>ΠΜ</sub>) και η παρεκτροπή είναι Τρ= 01° 20΄Δ/W. Ζητείται να υπολογιστεί:</p>\n<p class=in><b>α) </b>Η σύγχρονη Απόκλιση (Απ<sub>σ</sub>). <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> Η Παραλλαγή (Πρ) της μαγνητικής πυξίδας του πλοίου. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α)</b> Ισχύει: ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p class=in>Απ<sub>σ</sub> = Απ<sub>χ </sub>± ολική μεταβολή (+ αυξανόμενη, - ελαττούμενη)</p>\n<p>2022 – 2015 = 7 έτη</p>\n<p>Ολική μεταβολή = 7 έτη Χ 10΄= 70΄ = 01° 10΄Αυξανόμενη.</p>\n<p>Απ<sub>2021 </sub> = Απ<sub>2015 </sub>± ολική μεταβολή (+ αυξ., - ελατ.)</p>\n<p>Απ<sub>2021 </sub>= 01° 20΄ Δ/W + 01° 10΄</p>\n<p>Απ<sub>2021 </sub>= 02° 30΄Δ/W</p>\n<p><b>β) </b>Ισχύει: Πρ = Απ + Τρ (αλγεβρικά)</p>\n<p>Πρ = 02° 30΄Δ/W + 01° 20΄ Δ/W (αλγεβρικά)</p>\n<p>Πρ = ( - 02° 30)΄+ (- 01° 20΄)</p>\n<p>Πρ = - 02° 30΄- 01° 20΄</p>\n<p>Πρ = - 03° 50΄</p>\n<p>Πρ = 03° 50΄ Δ/W</p>","note":"Στην ενδεικτική απάντηση γράφεται «Απ2021»· ο υπολογισμός είναι για το 2022 (20/12/2022)."},{"id":"24712-Θ","th":"24712","part":"","k":"calc","secs":["1.10"],"p":25,"q":"<p>Στο πλησιέστερο ανεμολόγιο της περιοχής πλου στο ν. χάρτη αναγράφεται Απ= 3° 20΄ Α (2020) αυξανόμενη περίπου 5’ ετησίως.</p>\n<p>Δίδεται η παραλλαγή της μαγνητικής πυξίδας του πλοίου (Πρ<sub>Μ</sub>) 2° 00΄Δ.</p>\n<p><b>α)</b> Να βρεθεί η σύγχρονη απόκλιση (Απ) για το 2022.</p>\n<p><b>β)</b> Να υπολογιστεί η παρεκτροπή (Τρ) της μαγνητικής πυξίδας.</p>","sol":"<p><b>α)</b> Ισχύει:</p>\n<p>Απ<sub>σ </sub>= Απ<sub>χ </sub>± ολική μεταβολή (+ αυξ., - ελατ.), όπου: ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p>Συνεπώς:</p>\n<p>ολική μεταβολή = έτη × ετήσια μεταβολή = (2022 - 2020) × 5΄ = 2 × 5΄ = 10΄</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ</sub> + ολική μεταβολή (+ αυξ.)</p>\n<p>Απ<sub>σ</sub> = 3° 20΄ + 10΄ = 3° 30΄Α/Ε</p>\n<p><b>β)</b> Ισχύει:</p>\n<p>Τρ = Πρ<sub>Μ</sub> - Απ<sub>σ</sub> (αλγεβρικά)</p>\n<p>Συνεπώς:</p>\n<p>Τρ = (-2° 00΄) - (+3° 30΄) = - 2° 00΄ - 3° 30΄ = 1° 30΄Δ/W</p>","note":"Προσοχή: η ενδεικτική απάντηση γράφει σωστά την πράξη −2° 00΄ − 3° 30΄, αλλά δίνει αποτέλεσμα 1° 30΄ Δ. Σωστά: Τρ = 5° 30΄ Δ."},{"id":"24072-Θ","th":"24072","part":"","k":"calc","secs":["1.10"],"p":25,"q":"<p>Στο πλησιέστερο ανεμολόγιο της περιοχής του πλου στο ναυτικό χάρτη αναγράφεται: Var 3⁰ 18′ E (2013) decr. about 8′ annually. H παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>) στις 27/08/2022 είναι 1⁰,2 E.</p>\n<p>Να βρεθεί η παρεκτροπή (Τρ) της μαγνητικής πυξίδας <i>(απαιτείται σχήμα, Μονάδες 5)</i>.</p>","sol":"<p>Απ<sub>σ</sub> = Απ<sub>χ</sub>± ολική μεταβολή (+ αυξ., -ελατ.), όπου: ολική μεταβολή = έτη × ετήσια μεταβολή</p>\n<p>Τρ = Πρ<sub>Μ</sub> - Απ<sub>σ</sub> (αλγεβρικά)</p>\n<p>Συνεπώς:</p>\n<p>ολική μεταβολή = έτη × ετήσια μεταβολή = (2022 - 2013) × 8΄ = 9 × 8΄ = 72΄ = 1° 12΄</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ </sub>- ολική μεταβολή (-ελατ.)</p>\n<p>Απ<sub>σ</sub> = 3°18΄ - 1° 12΄ = 2° 06΄ Α/Ε</p>\n<p>Πρ<sub>Μ </sub>= 1⁰,2 Α/Ε = 1°12΄ Α/Ε</p>\n<p>Τρ = Πρ<sub>Μ</sub> - Απ<sub>σ</sub> = (+1°12΄) - (+2°06′) = 1°12΄ - 2°06′ = - 0°54΄ = 0°54΄Δ/W</p>\n<img class=\"fig\" src=\"img/24072s_fig.png\" alt=\"\">"},{"id":"24157-4.1","th":"24157","part":"4.1","k":"calc","secs":["1.17-1.19"],"p":5,"q":"<p>Ένα πλοίο έχει διανύσει 288 ναυτικά μίλια (ν.μ.) σε 24 ώρες.</p>\n<p>Να υπολογιστεί η ταχύτητα του πλοίου σε κόμβους, που είχε κατά τη διάρκεια του πλου.</p>","sol":"<p>Ισχύει:</p>\n<img class=\"eq\" src=\"img/24157_SOLUTION_l154.png\" alt=\"\">\n<p>άρα έχουμε:</p>\n<img class=\"eq\" src=\"img/24157_SOLUTION_l220.png\" alt=\"\">\n<p>Άρα κατά τη διάρκεια του πλου το πλοίο κινούνταν με 12 κόμβους.</p>"},{"id":"24157-4.2","th":"24157","part":"4.2","k":"calc","secs":["1.10","1.13-1.14","1.15"],"p":20,"q":"<p>Πλοίο πλέει με πορεία μαγνητικής πυξίδας (ζ<sub>ΠΜ</sub>) Β88°Α. Στο πλησιέστερο ανεμολόγιο της περιοχής του πλου στο ναυτικό χάρτη αναγράφεται Απ 2° 42΄Δ (2017) αυξανόμενη περίπου 6΄ ετησίως. Από το ειδικό πινακίδιο παρεκτροπών δίδεται η τιμή της παρεκτροπής (Τρ) 2,1°Α.</p>\n<p class=in>α) Να υπολογιστεί η σύγχρονη απόκλιση (Απ<sub>2022</sub>). (Μονάδες 5)</p>\n<p class=in>β) Να υπολογιστεί η παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>). (Μονάδες 5)</p>\n<p class=in>γ) Να υπολογιστεί η αληθής πορεία (ζλ). (Μονάδες 10)</p>","sol":"<p>α) Ισχύει:</p>\n<p>[1]Απ<sub>(2022) </sub>= Απ<sub>χάρτη</sub>± ολική μεταβολή (+ αυξ., - ελατ.) και</p>\n<p>[2]ολική μεταβολή = έτη × ετήσια μεταβολή Συνεπώς:</p>\n<p>2022-2017=5 έτη άρα η σχέση [2] θα γίνει: ολική μεταβολή = 5 έτη × 6΄=30΄</p>\n<p>Σύμφωνα με τη σχέση [2] η σχέση [1] θα έχει ως εξής:</p>\n<p>Απ<sub>(2022) </sub>= 2° 42΄Δ + 0° 30΄ (+ αυξ.)</p>\n<p>Απ<sub>(2022) </sub>= 2° 72΄Δ = 3° 12΄Δ</p>\n<p>β) Ισχύει:</p>\n<p>Πρ<sub>Μ </sub>= Απ<sub>(2022) </sub>+ Τρ (Αλγεβρικά)</p>\n<p>Πρ<sub>Μ</sub>= (-3° 12΄) + (+2° 06΄) = - 1° 06΄= 1° 06΄Δ</p>\n<p>γ) Αντιλαμβανόμαστε ότι η ζπ<sub>Μ </sub>είναι τεταρτοκυκλική τιμή και πρέπει να μετατραπεί σε ολοκυκλική τιμή, συνεπώς:</p>\n<p>ζπ<sub>Μ </sub>= Β88°Α = 088°</p>\n<p>Ισχύει:</p>\n<p>ζλ = ζπ ± Πρ (+Α, -Δ)</p>\n<p>Επομένως:</p>\n<p>ζλ = 088° - 1° 06΄ = 086° 54΄=086°,9</p>"},{"id":"28351-Θ","th":"28351","part":"","k":"calc","secs":["1.4","1.10","1.13-1.14","1.15"],"p":25,"q":"<p>Ένα πλοίο με πορεία μαγνητικής πυξίδας (ζπ<sub>Μ</sub>) Ν45°Α πλέει από στίγμα αναχώρησης Α με συντεταγμένες φ= 10° 45’ Β και λ= 023° 17’ Δ σε στίγμα άφιξης Β με συντεταγμένες φ’= 04° 06’ Ν και λ’= 005° 13’ Δ. Στο πλησιέστερο ανεμολόγιο της περιοχής του πλου αναγράφεται: Var 1° 56&#x27; Δ (2009) decr. about 33&#x27; annually. Δίνεται η τιμή της παρεκτροπής (Τρ) 2,5° Α. Να υπολογίσετε:</p>\n<p class=in>α) Τη διαφορά πλάτους (Δφ) και τη διαφορά μήκους (Δλ). (απαιτείται σκαρίφημα, Μονάδες 10)</p>\n<p class=in>β) Τη σύγχρονη απόκλιση (Απ<sub>σ</sub>) για το έτος 2021. (Μονάδες 5)</p>\n<p class=in>γ) Την παραλλαγή της μαγνητικής πυξίδας (Πρ<sub>Μ</sub>). (Μονάδες 5)</p>\n<p class=in>ε) Την αληθή πορεία (ζλ) που θα χαράξετε στον χάρτη. (Μονάδες 5)</p>","sol":"<p>α) Ισχύει: Δφ = φ ± φ’ (+ετ,-ομ)</p>\n<p>Επομένως, Δφ = φ + φ΄ ⇒ Δφ = 10° 45’ Β + 04° 06’ Ν ⇒ Δφ = 14° 51’ Ν</p>\n<p>Ισχύει: Δλ = λ ± λ’ (+ετ, -ομ)</p>\n<p>Επομένως, Δλ = λ -λ’ ⇒ Δλ = 023° 17’ Δ - 005° 13’ Δ ⇒ Δλ = 018° 04’ Α .</p>\n<p>Σκαρίφημα:</p>\n<img class=\"fig\" src=\"img/28351s_fig.png\" alt=\"\">\n<p>β) Ισχύει:</p>\n<p>Απ<sub>σ</sub> = Απ<sub>χ</sub> ± ολική μεταβολή &amp; ολική μεταβολή = έτη x ετήσια μεταβολή</p>\n<p>Επομένως, ολική μεταβολή = (2021-2009) x 33’ = 12 × 33’ = 396’ ⇒ 6° 36’ (ελατ.)</p>\n<p>Απ(2021) = 1° 56’ Δ – 6° 36’=4° 40’ Α</p>\n<p>γ) Ισχύει: Πρ = Απ + Τρ (αλγεβρικά)</p>\n<p>Επομένως, Πρ = 4° 40’ Α + 2,5°Α = 4° 40’ + 2° 30’= 7° 10’ Α</p>\n<p>δ) ζπ =Ν 45° Α (τεταρτοκυκλική τιμή) ⇒ ζπ = 180°- 45°⇒ ζπ =135° (ολοκυκλική τιμή)</p>\n<p>Ισχύει: ζλ = ζπ ± Πρ (+Α, -Δ)</p>\n<p>Επομένως, ζλ = 135° + 7° 10’ = 142° 10’</p>","note":"Στην εκφώνηση τα ερωτήματα αριθμούνται α, β, γ, ε (λείπει το δ)· στην ενδεικτική απάντηση το ε είναι το δ."},{"id":"20100-4.1","th":"20100","part":"4.1","k":"calc","secs":["3.3"],"p":10,"q":"<p>Με βάση το παρακάτω σχήμα, να αναφέρετε τους τομείς που επισημαίνονται.</p>\n<img class=\"fig\" src=\"img/20100_fig.png\" alt=\"\">","sol":"<p>Ο ορατός τομέας του φάρου βρίσκεται από 055°- 091° και 202°- 222°, όπου από 055° μέχρι 071°και από 202° μέχρι 222°είναι κόκκινοι τομείς, δηλαδή επισημαίνεται η επικίνδυνη περιοχή, ενώ από 071° – 091°είναι πράσινος τομέας, δηλαδή επισημαίνεται η πλεύσιμη περιοχή.</p>"},{"id":"20100-4.2","th":"20100","part":"4.2","k":"calc","secs":["3.3"],"p":15,"q":"<p>Σύμφωνα με τις συντμήσεις, να προσδιορίσετε τα χαρακτηριστικά τριών φάρων:</p>\n<p class=in><b>α) </b>Fl.13M. <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>β) </b>Gp.Fl.(2)19M. <span class=pt>(Μονάδες 5)</span></p>\n<p class=in><b>γ) </b>Αν(3)πρ15δ17µ5Μ. <span class=pt>(Μονάδες 5)</span></p>","sol":"<p><b>α) </b>Φωτεινό σήμα λευκού χρώματος, απλής αναλαμπής, ορατότητας 13 ν. μιλίων στην περιοχή του.</p>\n<p><b>β) </b>Φωτεινό σήμα λευκού χρώματος, με δέσμη 2 αναλαμπών, ορατότητας 19 ν. μιλίων στην περιοχή του.</p>\n<p><b>γ) </b>Φωτεινό σήμα πράσινου χρώματος, με δέσμη 3 αναλαμπών, περιόδου 15 δευτερολέπτων, ύψος εστίας 17 μέτρων από τη μέση στάθμη της θάλασσας και ορατότητας 5 ν. μιλίων στην περιοχή του.</p>"},{"id":"24066-4.1","th":"24066","part":"4.1","k":"calc","secs":["3.8"],"p":10,"q":"<p>Να ορίσετε με συντομία τα δυο συστήματα θαλάσσιας σήμανσης (IALA).</p>","sol":"<p>Σκοπός των συστημάτων αυτών είναι να επισημαίνουν κατά την νύχτα ή με περιορισμένη ορατότητα τα πλευρικά σημεία και τον άξονα των διαύλων, φυσικούς κινδύνους, εμπόδια και περιοχές με ειδικούς κανονισμούς. Το Σύστημα «Α» είναι συνδυασμός πλευρικής και τεταρτοκυκλικής σημάνσεως (κόκκινο στα αριστερά). Το</p>\n<p>Σύστημα «Β» είναι πλευρικό σύστημα μόνο (κόκκινο στα δεξιά).</p>"},{"id":"24066-4.2","th":"24066","part":"4.2","k":"calc","secs":["3.8"],"p":15,"q":"<p>Να αναφέρετε κατά την τεταρτοκυκλική βόρεια σήμανση και στη σήμανση μεμονωμένου κινδύνου, τα χαρακτηριστικά τους (χρώμα, σχήμα, σήματα κορυφής, φωτισμό).</p>","sol":"<p>Κατά την βόρεια τεταρτοκυκλική σήμανση, το χρώμα θα είναι μαύρο πάνω από το κίτρινο, το σχήμα θα είναι πάσαλος ή αλεώριο, το σχήμα στην κορυφή θα είναι 2 μαύροι κώνοι κατακόρυφα με τις κορυφές τους προς τα επάνω και ο φωτισμός αν υπάρχει θα είναι λευκός με χαρακτηριστικό VQkFl ή QkFl πολύ ταχείες αναλαμπές ή ταχείες αναλαμπές.</p>\n<p>Κατά τη σήμανση μεμονωμένου κίνδυνου το χρώμα θα είναι μαύρο με μία ή περισσότερες κόκκινες ζώνες, το σχήμα θα είναι πάσσαλος ή αλεώριο, το σχήμα στην κορυφή θα είναι 2 μαύρες σφαίρες κατακόρυφα και ο φωτισμός αν υπάρχει θα είναι λευκός με χαρακτηριστικό δέσμη αναλαμπών (2).</p>"},{"id":"20190-4.1","th":"20190","part":"4.1","k":"calc","secs":["M1"],"p":10,"q":"<p>Σύμφωνα με τις παρακάτω εικόνες, να αναγνωρίσετε και να αιτιολογήσετε τη μορφή της ισοβαρούς καμπύλης που φαίνεται στους χάρτες καιρού και περιγράφονται στα μετεωρολογικά δελτία στο βόρειο ημισφαίριο.</p>\n<img class=\"fig\" src=\"img/20190_41.png\" alt=\"\">","sol":"<p>α) Η μορφή της ισοβαρούς καμπύλης είναι ο αντικυκλώνας (υψηλό βαρομετρικό, High). Οι υψηλότερες πιέσεις είναι στο κέντρο και η οριζόντια βαροβαθμίδα έχει κατεύθυνση από το κέντρο προς την περιφέρεια.</p>\n<p>β) Η μορφή της ισοβαρούς καμπύλης είναι η ύφεση (χαμηλό βαρομετρικό, Low). Οι χαμηλότερες πιέσεις είναι στο κέντρο και η οριζόντια βαροβαθμίδα έχει κατεύθυνση από την περιφέρεια προς το κέντρο.</p>"},{"id":"20190-4.2","th":"20190","part":"4.2","k":"calc","secs":["M4"],"p":15,"q":"<p>Με βάση τις παρακάτω εικόνες,</p>\n<p class=in><b>α) </b>να αναγνωρίσετε και να αναφέρετε ονομαστικά τα είδη μετώπων. <span class=pt>(Μονάδες 9)</span></p>\n<img class=\"fig\" src=\"img/20190_42.png\" alt=\"\">\n<p class=in><b>β) </b>να εξηγήσετε με συντομία γιατί στις μετωπικές επιφάνειες σχηματίζεται συχνά ομίχλη ανάμιξης (βαρομετρικό χαμηλό). <span class=pt>(Μονάδες 6)</span></p>","sol":"<p>α) 1. Συνεσφιγμένο μέτωπο, 2. Στάσιμο μέτωπο, 3. Ψυχρό μέτωπο</p>\n<p>β) Επειδή αέριες μάζες με διαφορετική θερμοκρασία και υγρασία έρχονται σε επαφή.</p>"},{"id":"24069-4.1","th":"24069","part":"4.1","k":"calc","secs":["M1"],"p":10,"q":"<p>Σύμφωνα με τις παρακάτω εικόνες, να αναγνωρίσετε και να αιτιολογήσετε τη μορφή της ισοβαρούς καμπύλης που φαίνεται στους χάρτες καιρού και περιγράφονται στα μετεωρολογικά δελτία στο βόρειο ημισφαίριο.</p>\n<img class=\"fig\" src=\"img/24069_41.png\" alt=\"\">","sol":"<p>α) Η μορφή της ισοβαρούς καμπύλης είναι η σφήνα εξάρσεως (Ridge). Οι ισοβαρείς σχηματίζουν σφήνα, όπου οι υψηλές πιέσεις βρίσκονται στο μέσα μέρος της.</p>\n<p>β) Η μορφή της ισοβαρούς καμπύλης είναι ο αυλώνας υφέσεως (Trough). Οι ισοβαρείς σχηματίζουν σφήνα, όπου οι χαμηλές πιέσεις βρίσκονται στο μέσα μέρος της.</p>"},{"id":"24069-4.2","th":"24069","part":"4.2","k":"calc","secs":["M5"],"p":15,"q":"<p>Να αναφερθούν ονομαστικά τα στάδια ανάλυσης και πρόγνωσης καιρού.</p>","sol":"<p>Τα στάδια ανάλυσης και πρόγνωσης καιρού είναι:</p>\n<p class=in>• Η συγκέντρωση των μετεωρολογικών παρατηρήσεων</p>\n<p class=in>• Η σύνταξη των χαρτών καιρού επιφανείας</p>\n<p class=in>• Η ανάλυση των χαρτών καιρού</p>\n<p class=in>• Η πρόγνωση</p>"},{"id":"28341-4.1","th":"28341","part":"4.1","k":"calc","secs":["M4"],"p":10,"q":"<p>Με βάση τα δύο είδη μετώπων που παρουσιάζονται παρακάτω:</p>\n<p class=in><b>α)</b> Να αναγνωρίσετε τον κάθε τύπο μετώπου ανάλογα με τα χαρακτηριστικά του καθενός. <span class=pt>(Μονάδες 4)</span></p>\n<p class=in><b>β)</b> Να τοποθετήσετε στην κατάλληλη μεριά τις θερμοκρασίες 42°C, 38°C, 22°C και 25°C, οι οποίες επικρατούν σε κάθε μέτωπο. <span class=pt>(Μονάδες 6)</span></p>\n<img class=\"fig\" src=\"img/28341_41.png\" alt=\"\">","sol":"<p><b>α.</b> 1. Θερμό μέτωπο, 2. Ψυχρό μέτωπο</p>\n<p><b>β. </b></p>\n<img class=\"fig\" src=\"img/28341s_fig.png\" alt=\"\">"},{"id":"28341-4.2","th":"28341","part":"4.2","k":"calc","secs":["M2"],"p":15,"q":"<p>Με βάση το παρακάτω σχήμα:</p>\n<p class=in><b>α)</b> Να αναγνωρίσετε τη θαλάσσια και την απόγειο αύρα. <span class=pt>(Μονάδες 6)</span></p>\n<p class=in><b>β)</b> Να αναλύσετε το μηχανισμό της θαλάσσιας και της απογείου αύρας.</p>\n<p class=in><span class=pt>(Μονάδες 9)</span></p>\n<img class=\"fig\" src=\"img/28341_42.png\" alt=\"\">","sol":"<p><b>α.</b> 1. Θαλάσσια αύρα, 2. Απόγειος αύρα</p>\n<p><b>β. </b>Η Αύρα εμφανίζεται στις περισσότερες παράκτιες περιοχές (ή και σε όχθες μεγάλων σχετικά λιμνών). Πρωινές ώρες, ανάμεσα στις 09:00 - 11:00 η ξηρά, που θερμαίνεται ή ψύχεται ταχύτερα από το νερό, είναι θερμότερη από τη θάλασσα και ο αέρας που βρίσκεται πάνω της είναι αραιότερος από τον αέρα πάνω από τη θάλασσα. O θαλάσσιος λοιπόν αέρας κινείται προς την ξηρά, εκτοπίζοντας το θερμό αραιότερο αέρα πάνω από την ξηρά. Aυτή είναι η θαλάσσια αύρα. Προς το απόγευμα, όταν οι θερμοκρασίες θάλασσας και ξηράς έχουν σχεδόν γίνει ίσες, η αύρα αυτή παύει. Αργότερα, μετά τη δύση του ηλίου, οπότε η ξηρά ψύχεται γρηγορότερα από τη θάλασσα, ο αέρας πάνω από αυτήν κινείται προς τη θάλασσα, εκτοπίζοντας με τη σειρά του το θερμότερο και αραιότερο θαλάσσιο αέρα. Αυτή είναι η απόγειος αύρα, που σταματάει γύρω στην ανατολή του ηλίου.</p>"},{"id":"28389-4.1","th":"28389","part":"4.1","k":"calc","secs":["1.15"],"p":10,"q":"<p>Από το πλησιέστερο ανεμολόγιο της περιοχής πλου στο ναυτικού χάρτη μετρήσατε προς την πλευρά του πλου την τιμή της ευθυγραμμίσεως 000°-180°. Με τη διόπτρα του επαναλήπτη της γυροσκοπικής πυξίδας λάβατε απόλυτη διόπτευση (Αζπ<sub>G</sub>) 181°, Να υπολογίσετε το/την σφάλμα/παραλλαγή της γυροσκοπικής πυξίδας (Πρ<sub>G</sub>).</p>","sol":"<p>Ισχύει: Αζλ = Αζπ + Πρ (αλγεβρικά) ⇒ Πρ = Αζλ - Αζπ</p>\n<p>Επομένως:</p>\n<p>Πρ<sub>G</sub> = Αζλ - Αζπ<sub>G</sub>= 180° - 181° = - 1° = 1°Δ</p>"},{"id":"28389-4.2","th":"28389","part":"4.2","k":"calc","secs":["M4"],"p":15,"q":"<p>Σχετικά με την πρόγνωση καιρού σε μέσα γεωγραφικά πλάτη, να εξηγήσετε την κίνηση που ακολουθούν τα βαρομετρικά συστήματα (Υφέσεις-Αντικυκλώνες).</p>","sol":"<p>Οι υφέσεις αλλά και τα υπόλοιπα βαρομετρικά συστήματα στην κίνησή τους ακολουθούν τη γενική ατμοσφαιρική κυκλοφορία. Στα μέσα γεωγραφικά πλάτη, λοιπόν, κινούνται με κατεύθυνση Ανατολική-Βορειοανατολική στο Βόρειο ημισφαίριο και Ανατολική-Βορειοανατολική στο Νότιο.</p>"}]}; const IMG = {"17992_fig":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbUAAAIGCAMAAADkwuGpAAAAkFBMVEX////+/v79/f38/Pz7+/v6+vr5+fn4+Pj39/f19fXz8/Pv7+/s7Ozo6Ojj4+Pb29vU1NTNzc3IyMjCwsK5ubmxsbGnp6eampqOjo6Hh4d/f39xcXFiYmJWVlZNTU1HR0dDQ0M9PT01NTUsLCwjIyMaGhoTExMNDQ0JCQkHBwcFBQUEBAQDAwMCAgIBAQEAAADvH+ZEAABeQ0lEQVR42u1diULbSBa0unVasiTf9yVfsnz9/99t1ZNNIGGYbJCNyXRvQggwgVW5u99Rr6pWM8sss8wyyyyzzDLLLLPM+sSylK7VHBt/KOv6IcdR+KCFD9YcV2tXaS2ftJR5XE+DGrBwFFCzLEKotQWIlF1vpM12K41D31dcBrUng61W01YNe002nlYu/mY5cWcwWcwng3bkWi/LPK1nWcq260mr3el2uNrNtOFbtu2lo+UmzzeLYSvyyy1pMHuqveYn/fFsmcmaTcbdJLBtvzle58d8t5kP2yE3mUHtqUCzLK85ynZFubar5aTfCpWf9ifT5WZ/2Mz6sVueoAa25zkgteU2x6vd/njYbba7Yr/DqZjabiNtp73perdbT9qBi5tOaxOMPNFeU0Ebp2GxyaaT8TTb5PvNtOM7YejX0/5sk29n3dA3qD3dbgtaY+ypbNxL0+5ouTvmi37DcuuW3+iMV/luOUhDHJG2ZmZn1rPsNkFtm41agR93JpvjedlPAst2dNQZr4v9atxp2Aa1J0RtBdSGTaVDhI77y7IXI270rBgXW4F4ZJDYknubcOR5Av8StV02TC037k42+x1uMtezlNscLrfFMV+NUxtFLgPaE6K2wr3WxL22xQ3XcjXiRr8zWe/Pl/N22vJdhXDEwPZEqPlEbc8YcoIYEvB1Y43yiBP1F7vT+XLJF91GoJQJIp8PtUOx22LlhzwbdWIHH4+aI1x327zYZ4NmxGDEoPZMtRGidrqgfrXb7c/5Zj5qh45nIxbZblerzbZYI4p0Ha0Mas8Dm3aJWrFdZ/PZfLne5tvlqB05TnOc7daz6WKdo6qVeDgibfO0ngc1h6jlq8mg2+31x9n2sJkPEuV3ZtsiG4/Gi+1uPW6iouwY1J4JtbZE/qNWvR41upMVqluT1G70s/ywGHT7yLt3k3Zo2+aEfCYGgqCGYzFFTdJKB/PNIZ+16s3RGn/2UtRHTsd5L/bNvfZUqLlX1JqI973mcI6K8bTZ6E03+82kEyWD7HBBFBlqc6/VnqiX7ZUn5LjdaCRJb4I7bj1Ok1GWs8rlN3rz3Wk97iV1c689E2p+W7Ls+WgwHI4AWsGYsT3dnteTXuJGLCjv0CttN3zztJ4GNYeo5WeE/qv1er3Z7baLQSvtrYpLNu7EXoCbbntCDjBIDWrPc6/ZfmuUbY+Hgr+Ou3U2HbTi1nB9PC/6aei4jQ4Oy/N2OWze/YREiVox79fa9x3t+jYKazbK1ixdl6w/qQuUX1orP/5frWh54IgsV9e1mI56aRi1h7N1Jo01O4h742y1GPdT994/jGYPz9JeI06baSq/kzjycBy4FrN8fFrXSo4f/6JuTM3/ZOQfNbv9fn8wwJt+r9OMA+XH7d6g30nq5Pn4SYcfTxvO/feasrHTGu3+aDIZT7DGI/wUgeN7SCtZVLNt4draLG/LbvtvdiLwBMB+rIfXFYUOuzKWDvi+V55OKoiieuDZ6kGoJf3ZeruTtVnPx31kHTjIXc+1yZ /* ---------- τυχαία επιλογή με διασπορά σε κεφάλαια και ενότητες ----------
   Κληρώνεται πρώτα κεφάλαιο, μετά ενότητα, μετά ερώτηση. Τα μεγάλα κεφάλαια και οι μεγάλες ενότητες έχουν
   μεγαλύτερη πιθανότητα, αλλά όχι ανάλογη του πλήθους τους (∝ √πλήθος). Κάθε επανάληψη του ίδιου
   κεφαλαίου ή της ίδιας ενότητας στο ίδιο σύνολο μειώνει πολύ την πιθανότητα. Ένα θέμα της τράπεζας

const unitSecs = (it, sel) => [...new Set(it.filt ? it.rows.filter(r => !sel || sel.has(r.s)).map(r => r.s) : it.secs)];

function wpick(arr, w) {

}

    const G = {};

/* ---------- διαγώνισμα όπως στις εξετάσεις: Θέματα Α, Β, Γ, Δ (25 μονάδες το καθένα) ---------- */
const PARTS = {
  'Α': 'Ερωτήσεις κλειστού τύπου',
  'Β': 'Ερωτήσεις ανάπτυξης σύντομης απάντησης',
  'Γ': 'Άσκηση εφαρμογής',
  'Δ': 'Σύνθετη άσκηση',
};
const EXER = new Set(['1.4', '1.10', '1.13-1.14', '1.15', '1.16', '1.17-1.19']);   // ενότητες με ασκήσεις υπολογισμών
const CLOSED2 = ['mc', 'fill', 'match', 'fillp'];
// ακέραιες μονάδες ανάλογες του raw, με άθροισμα ακριβώς total (μέθοδος μεγαλύτερου υπολοίπου)
function scaleTo(ids, raw, total) {
  const P = raw.reduce((a, b) => a + b, 0), x = raw.map(r => r / P * total), f = x.map(Math.floor);
  const left = total - f.reduce((a, b) => a + b, 0);
  x.map((v, i) => [v - f[i], i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => f[i]++);
  const w = {}; ids.forEach((id, i) => w[id] = f[i]); return w;
}
function buildExam(sel) {
  const X = newX(), P = {};
  const u1 = it => mkUnit([it.id], sel);
  const whole = it => it.filt ? it.rows.every(r => sel.has(r.s)) : itemOK(it, sel);
  const sum = o => o.reduce((a, u) => a + u.p, 0);
  // Δ: ολόκληρο Θέμα 4ο της τράπεζας· όσα συνδυάζουν ενότητες έχουν τριπλάσια πιθανότητα
  const t4 = Object.values(DATA.themes).filter(th => th.t === 4 && th.items.every(id => whole(ITEM[id]))).map(th => mkUnit(th.items, sel));
  P['Δ'] = t4.length ? [wpick(t4, t4.map(u => u.secs.length > 1 ? 3 : 1))] : [];
  P['Δ'].forEach(u => { X.th.add(u.th); inc(X.ch, u.ch); u.secs.forEach(x => inc(X.sec, x)); });
  // Γ: άσκηση υπολογισμών από άλλη ενότητα· αν βγει μικρή, συμπληρώνεται με δεύτερη (ή τρίτη) από άλλη ενότητα
  let gp = DATA.items.filter(it => it.k === 'calc' && whole(it) && it.secs.every(s => EXER.has(s))).map(u1);
  if (!gp.length) gp = DATA.items.filter(it => DATA.themes[it.th].t === 4 && whole(it)).map(u1);
  P['Γ'] = spread(gp, X, { n: 3, until: o => sum(o) >= 20, w: u => u.secs.length > 1 ? .4 : 1, avoid: new Set(P['Δ'].flatMap(u => u.secs)) });
  // Β: 2–3 ερωτήσεις ανάπτυξης από διαφορετικά κεφάλαια
  const bp = DATA.items.filter(it => it.k === 'open' && itemOK(it, sel)).map(u1);
  P['Β'] = spread(bp, X, { n: 3, until: o => o.length >= 2 && sum(o) >= 20, w: u => u.p >= 5 ? 1 : .2 });
  // Α: 5 Σωστό/Λάθος + 3 πολλαπλής επιλογής, συμπλήρωσης ή αντιστοίχισης (το πολύ μία αντιστοίχιση)
  const a1 = spread(DATA.items.filter(it => it.k === 'tf' && itemOK(it, sel)).map(u1), X, { n: 5 });
  const big = u => ['match', 'fillp'].includes(ITEM[u.ids[0]].k);
  const a2 = spread(DATA.items.filter(it => CLOSED2.includes(it.k) && itemOK(it, sel)).map(u1), X,
    { n: 3 + Math.max(0, Math.round((10 - 2 * a1.length) / 5)), ok: (v, out) => !(big(v) && out.some(big)) });
  P['Α'] = a1.concat(a2);
  const parts = [], w = {}, lab = {}, part = {};
  for (const key of ['Α', 'Β', 'Γ', 'Δ']) {
    const ids = P[key].flatMap(u => u.ids);
    if (!ids.length) continue;
    const raw = key === 'Α' ? ids.map(id => ITEM[id].k === 'tf' ? 2 : 5) : ids.map(id => ITEM[id].p);
    Object.assign(w, scaleTo(ids, raw, 25));
    if (key === 'Α') { let j = 0, k = 1; ids.forEach(id => { lab[id] = ITEM[id].k === 'tf' ? 'Α1' + 'αβγδεζηθ'[j++] : 'Α' + (++k); }); if (!a1.length) ids.forEach((id, i) => lab[id] = 'Α' + (i + 1)); }
    else ids.forEach((id, i) => lab[id] = ids.length === 1 ? key : key + (i + 1));
    ids.forEach(id => part[id] = key);
    parts.push({ key, name: PARTS[key], ids, total: 25 });
  }
  return { parts, items: parts.flatMap(p => p.ids), w, lab, part, full: parts.length * 25 };
}

  if (it.img) body.append(figure(it.img));
  body.append(el('div', { html: it.q }));
  const rows = rowsOf(it, it.filt ? (SES && SES.sel) : null);
  st.v = st.v || rows.map(() => null);
  const isFig = !!it.img;
  if (!isFig) {
    body.append(el('div', { class: 'colb' }, el('div', { class: 'sub', style: 'font-weight:600;margin-bottom:.2rem' }, 'Στήλη Β'), it.opts.map((o, i) => el('div', {}, el('b', {}, LET[i] + '.'), el('span', {}, o)))));
  }
  const ok = j => rows[j][0].a.includes(st.v[j]);
  rows.forEach(([r, ri], j) => {
    const mr = el('div', { class: 'mrow' + (reveal && mode !== 'proj' ? (ok(j) ? ' ok' : ' bad') : '') }, el('div', { class: 'lt' }, el('b', {}, isFig ? r.t : (ri + 1) + '.'), isFig ? '' : r.t));
    const L = el('div', { class: 'letters' });
    it.opts.forEach((o, i) => {
      let cls = 'letter';
      if (reveal) { if (r.a.includes(i)) cls += (mode === 'proj' || st.v[j] === i ? ' ok' : ' want'); else if (st.v[j] === i && mode !== 'proj') cls += ' bad'; }
      else if (st.v[j] === i) cls += ' pick';
      L.append(el('button', { class: cls, disabled: reveal || mode === 'proj', title: o, onclick: () => { st.v[j] = i; if (mode !== 'practice') { st.score = sc(); st.ans = st.v.every(x => x != null); } rerender(); } }, isFig ? o : LET[i]));
    });
    mr.append(L); c.append(mr);
  });
  const sc = () => st.v.filter((v, j) => rows[j][0].a.includes(v)).length / rows.length;
  if (mode === 'practice' && !reveal) c.append(el('div', {}, el('button', { class: 'btn', disabled: st.v.some(x => x == null), onclick: () => finish(it, st, sc()) }, 'Έλεγχος')));
  if (reveal && mode !== 'proj') { const s = sc(); c.append(feedback(s === 1 ? 1 : s === 0 ? 0 : .5, `${st.v.filter((v, j) => rows[j][0].a.includes(v)).length} από ${rows.length} σωστά.`)); }
}
function kOpen(it, st, mode, reveal, body, c) {
  if (it.img) body.append(figure(it.img));
  body.append(el('div', { html: fixImgs(it.q) }));
  body.querySelectorAll('img.fig').forEach(i => i.onclick = () => zoom(i.src));
  const solBox = () => { const s = el('div', { class: 'sol' }, el('div', { class: 'lab' }, it.k === 'calc' ? 'Λύση της τράπεζας' : 'Ενδεικτική απάντηση'), el('div', { html: fixImgs(it.sol) })); s.querySelectorAll('img.fig').forEach(i => i.onclick = () => zoom(i.src)); return s; };
  if (mode === 'proj') { if (st.shown) c.append(solBox()); return; }
  if (mode === 'exam' && !SES.grading) { c.append(el('div', { class: 'fb info' }, el('div', { class: 'h' }, it.k === 'calc' ? 'Λύσε την άσκηση στο χαρτί' : 'Γράψε την απάντηση στο χαρτί'), el('div', { class: 'sub' }, 'Στο τέλος θα δεις τη λύση της τράπεζας και θα βαθμολογήσεις μόνος σου.'))); return; }
  if (!st.open && mode === 'practice' && !st.done) {
    c.append(el('div', { class: 'ask' }, it.k === 'calc' ? 'Λύσε την άσκηση στο τετράδιο και μετά δες τη λύση.' : 'Σκέψου ή γράψε την απάντηση και μετά δες την ενδεικτική απάντηση.'),
      el('div', { style: 'margin-top:.7rem' }, el('button', { class: 'btn', onclick: () => { st.open = true; rerender(); } }, it.k === 'calc' ? 'Δείξε τη λύση' : 'Δείξε την απάντηση')));
    return;
  }
  c.append(solBox());
  if (mode === 'review') { if (st.score != null) c.append(feedback(st.score, null)); return; }
  c.append(el('div', { class: 'sub', style: 'margin-top:.8rem;font-weight:600' }, 'Πώς τα πήγες;'));
  const g = el('div', { class: 'self' });
  [[1, 'g1', '✓ Σωστά'], [.5, 'g5', '◐ Μισά'], [0, 'g0', '✗ Λάθος']].forEach(([v, cls, t]) => g.append(el('button', { class: cls + (st.score === v ? ' on' : ''), onclick: () => { if (mode === 'practice') finish(it, st, v); else { st.score = v; st.ans = true; rerender(); } } }, t)));
  c.append(g);
}

/* ---------- συνεδρία ---------- */
function stopTimer() { if (TIMER) clearInterval(TIMER); TIMER = null; $('#timer').hidden = true; }
function tick() {
  const t = $('#timer');
  if (!SES || !SES.end || SES.done) { stopTimer(); return; }
  const left = Math.max(0, SES.end - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  t.hidden = false; t.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`; t.classList.toggle('low', left < 120000);
  if (!left) { stopTimer(); submitExam(true); }
}
ROUTES.quiz = app => {
  if (!SES || SES.mode === 'proj') return go('home');
  if (SES.mode === 'exam' && SES.end && !SES.done && !TIMER) { TIMER = setInterval(tick, 1000); tick(); }
  const it = ITEM[SES.items[SES.i]];
  const st = SES.ans[it.id] || (SES.ans[it.id] = {});
  if (SES.mode === 'exam') {
    if (SES.grading) return gradeView(app);
    setBar(`${SES.title} · ${SES.i + 1}/${SES.items.length}`);
    const pal = el('div', { class: 'pal' }, SES.items.flatMap((id, j) => [
      SES.part && j && SES.part[id] !== SES.part[SES.items[j - 1]] ? el('span', { class: 'pgap' }) : null,
      el('button', { class: (SES.ans[id] && SES.ans[id].ans ? 'done' : '') + (j === SES.i ? ' cur' : ''), onclick: () => { SES.i = j; render(); } }, SES.lab ? SES.lab[id] : j + 1)]));
    app.append(pal); if (SES.parts) app.append(partBanner(it)); app.append(qcard(it, st, 'exam'));
    const last = SES.i === SES.items.length - 1;
    app.append(el('div', { class: 'navq' }, el('div', { class: 'in' },
      el('button', { class: 'btn sec', style: 'flex:none', disabled: SES.i === 0, onclick: () => { SES.i--; render(); } }, '←'),
      last ? el('button', { class: 'btn', onclick: () => submitExam(false) }, 'Παράδοση') : el('button', { class: 'btn', onclick: () => { SES.i++; render(); } }, 'Επόμενη'),
      !last ? el('button', { class: 'btn ghost', style: 'flex:none', onclick: () => submitExam(false) }, 'Παράδοση') : null)));
    return;
  }
  setBar(`${SES.title} · ${SES.i + 1}/${SES.items.length}`);
  app.append(el('div', { class: 'prog' }, el('div', { style: `width:${(SES.i + (st.done ? 1 : 0)) / SES.items.length * 100}%` })));
  app.append(qcard(it, st, 'practice'));
  if (st.done) {
    const last = SES.i === SES.items.length - 1;
    const next = () => { if (last) { SES.done = true; go('results'); } else { SES.i++; render(); } };
    app.append(el('div', { class: 'navq' }, el('div', { class: 'in' }, el('button', { class: 'btn', onclick: next }, last ? 'Αποτελέσματα' : 'Επόμενη →'))));
    document.onkeydown = e => { if (e.key === 'Enter') next(); };
    const fb = $('.fb', app); if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else {
    document.onkeydown = e => {
      const n = parseInt(e.key, 10); if (!(n >= 1 && n <= 9)) return;
      const b = it.k === 'tf' ? $$('.tf .opt')[n - 1] : it.k === 'mc' ? $$('.opts .opt')[n - 1] : it.k === 'fill' ? $$('.words .word')[n - 1] : null;
      if (b) b.click();
    };
    app.append(el('div', { class: 'navq' }, el('div', { class: 'in' },
      el('button', { class: 'btn ghost', onclick: () => { st.skip = true; if (SES.i < SES.items.length - 1) { SES.i++; render(); } else { SES.done = true; go('results'); } } }, 'Παράλειψη'))));
  }
};
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function submitExam(timeUp) {
  const n = SES.items.filter(id => !(SES.ans[id] && SES.ans[id].ans)).length;
  const go2 = () => {
    stopTimer(); SES.done = true;
    const open = SES.items.filter(id => ['open', 'calc'].includes(ITEM[id].k));
    if (open.length) { SES.grading = { list: open, j: 0 }; SES.i = SES.items.indexOf(open[0]); render(); }
    else finishExam();
  };
  if (timeUp) return dialog('Ο χρόνος τελείωσε', 'Το διαγώνισμα παραδόθηκε.', [['Συνέχεια', go2]]);
  dialog('Παράδοση διαγωνίσματος;', n ? `Έχεις ${n} ${n === 1 ? 'ερώτηση κλειστού τύπου χωρίς απάντηση' : 'ερωτήσεις χωρίς απάντηση'} (οι ασκήσεις στο χαρτί μετράνε ως αναπάντητες εδώ).` : 'Μετά την παράδοση δεν αλλάζουν οι απαντήσεις.', [['Συνέχεια', null, 'sec'], ['Παράδοση', go2]]);
}
function gradeView(app) {
  const g = SES.grading, id = g.list[g.j], it = ITEM[id];
  const st = SES.ans[id] || (SES.ans[id] = {});
  setBar(`Βαθμολόγηση ${g.j + 1}/${g.list.length}`);
  app.append(el('div', { class: 'card sub' }, 'Σύγκρινε αυτό που έγραψες στο χαρτί με τη λύση της τράπεζας και βαθμολόγησε τον εαυτό σου τίμια.'));
  if (SES.parts) app.append(partBanner(it));
  app.append(qcard(it, st, 'exam'));
  const last = g.j === g.list.length - 1;
  app.append(el('div', { class: 'navq' }, el('div', { class: 'in' },
    el('button', { class: 'btn sec', disabled: g.j === 0, onclick: () => { g.j--; render(); } }, '←'),
    el('button', { class: 'btn', disabled: st.score == null, onclick: () => { if (last) finishExam(); else { g.j++; render(); } } }, last ? 'Αποτελέσματα' : 'Επόμενη →'))));
}
function finishExam() {
  SES.grading = null;
  for (const id of SES.items) { const st = SES.ans[id] || {}; record(id, st.score || 0); }
  go('results');
}

/* ---------- αποτελέσματα ---------- */
ROUTES.results = app => {
  if (!SES) return go('home');
  setBar('Αποτελέσματα');
  const ids = SES.items.filter(id => SES.mode === 'exam' || (SES.ans[id] && (SES.ans[id].done || SES.ans[id].skip)));
  const sc = id => (SES.ans[id] && SES.ans[id].score) || 0;
  const answered = ids.filter(id => SES.ans[id] && SES.ans[id].score != null);
  const W = id => SES.w ? SES.w[id] : ITEM[id].p;
  const pts = ids.reduce((a, id) => a + W(id) * sc(id), 0), tot = ids.reduce((a, id) => a + W(id), 0);
  const ok = ids.filter(id => sc(id) >= 1).length;
  const pc = tot ? pts / tot : 0;
  const R = 52, C = 2 * Math.PI * R;
  const ring = `<svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#e4e9ee" stroke-width="12"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${pc >= .5 ? '#2e8b57' : '#c0392b'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C * pc} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="#0d2b45">${Math.round(pc * 100)}%</text></svg>`;
  const box = el('div', { class: 'card score', html: ring });
  if (SES.mode === 'exam' && SES.parts) {
    const rows = SES.parts.map(P => el('tr', {}, el('td', {}, el('b', {}, 'Θέμα ' + P.key)), el('td', {}, P.name), el('td', {}, fmt(P.ids.reduce((a, id) => a + W(id) * sc(id), 0)) + ' / ' + P.total)));
    const chs = [...new Set(ids.flatMap(id => unitSecs(ITEM[id], SES.sel).map(s => SEC[s].ch)))].sort((a, b) => CH.findIndex(c => c.id === a) - CH.findIndex(c => c.id === b));
    const chName = c => c === 'M' ? 'Ναυτική Μετεωρολογία' : 'Κεφάλαιο ' + c;
    box.append(el('div', { class: 'big' }, fmt(pts) + ' / ' + tot + ' μονάδες'), el('div', { class: 'sub' }, 'Βαθμός στα 20: ' + fmt(pts / tot * 20)),
      el('table', { class: 'parts' }, rows), el('div', { class: 'sub', style: 'margin-top:.7rem' }, 'Ερωτήσεις από: ' + chs.map(chName).join(', ')));
  } else {
    box.append(el('div', { class: 'big' }, ok + ' / ' + ids.length), el('div', { class: 'sub' }, `σωστές απαντήσεις · ${fmt(pts)} από ${tot} μονάδες`));
  }
  box.append(el('div', { class: 'who' }, AUTHOR));
  app.append(box);
  const wrong = ids.filter(id => sc(id) < 1);
  const row = el('div', { class: 'row', style: 'margin-bottom:.8rem' });
  if (wrong.length) row.append(el('button', { class: 'btn grow', onclick: () => { SES = { mode: 'practice', items: wrong, i: 0, ans: {}, sel: SES.sel, title: 'Ξανά τα λάθη' }; go('quiz'); } }, 'Ξανά τα λάθη (' + wrong.length + ')'));
  row.append(el('button', { class: 'btn sec grow', onclick: () => go('home') }, 'Αρχική'));
  app.append(row);
  const list = el('div', { class: 'card list' });
  ids.forEach((id, j) => {
    const s = SES.ans[id] || {}; const it = ITEM[id];
    const cls = s.score == null ? 'no' : s.score >= 1 ? 'ok' : s.score > 0 ? 'half' : 'bad';
    const txt = (it.q || '').replace(/<[^>]+>/g, ' ').replace(/⟨[^⟩]*⟩/g, '___').replace(/\s+/g, ' ').trim();
    list.append(el('div', { class: 'li', onclick: () => reviewOne(id) }, el('span', { class: 'd ' + cls }, cls === 'ok' ? '✓' : cls === 'bad' ? '✗' : cls === 'half' ? '½' : '–'), el('span', { class: 'x' }, el('b', {}, (SES.lab ? SES.lab[id] + ' · ' : '') + it.th + ' '), txt)));
  });
  app.append(el('h2', {}, 'Οι απαντήσεις σου'), el('div', { class: 'sub', style: 'margin-bottom:.4rem' }, 'Πάτα μια ερώτηση για να δεις τη σωστή απάντηση.'), list);
};
function reviewOne(id) {
  const m = $('#modal'); m.innerHTML = '';
  const st = Object.assign({}, SES.ans[id] || {});
  const d = el('div', { class: 'dlg', style: 'max-width:44rem;max-height:90vh;overflow:auto' }, qcard(ITEM[id], st, 'review'), el('div', { class: 'row' }, el('button', { class: 'btn', onclick: () => m.hidden = true }, 'Κλείσιμο')));
  m.append(d); m.hidden = false;
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') e.target.hidden = true; });

render();
